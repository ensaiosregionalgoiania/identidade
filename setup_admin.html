<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Administrador - CCB</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }
        h2 {
            color: #667eea;
            font-size: 1rem;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #219a52; }
        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .mensagem {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
        }
        .erro { background: #fee; color: #c0392b; border-left: 4px solid #e74c3c; }
        .sucesso { background: #efe; color: #27ae60; border-left: 4px solid #27ae60; }
        .info { background: #e3f2fd; color: #2980b9; border-left: 4px solid #3498db; }
        .status {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-label {
            font-weight: bold;
            color: #555;
        }
        .status-value {
            font-family: monospace;
            color: #2c3e50;
        }
        .check { color: #27ae60; }
        .xmark { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Identidade Ministerial CCB</h1>
        <h2>Configuração de Administrador</h2>
        
        <div id="statusArea" class="status">
            <div class="status-item">
                <span class="status-label">🔧 Firebase:</span>
                <span class="status-value" id="firebaseStatus">Verificando...</span>
            </div>
            <div class="status-item">
                <span class="status-label">🔐 Authentication:</span>
                <span class="status-value" id="authStatus">Verificando...</span>
            </div>
            <div class="status-item">
                <span class="status-label">💾 Firestore:</span>
                <span class="status-value" id="firestoreStatus">Verificando...</span>
            </div>
        </div>
        
        <div id="formArea">
            <div class="form-group">
                <label>👤 Nome completo</label>
                <input type="text" id="nome" placeholder="Ex: José da Silva">
            </div>
            <div class="form-group">
                <label>📧 E-mail (será seu login)</label>
                <input type="email" id="email" placeholder="admin@ccb.com">
            </div>
            <div class="form-group">
                <label>🔒 Senha (mínimo 6 caracteres)</label>
                <input type="password" id="senha" placeholder="••••••">
            </div>
            <div class="form-group">
                <label>🔒 Confirmar senha</label>
                <input type="password" id="confirmarSenha" placeholder="••••••">
            </div>
            
            <button onclick="criarAdministrador()">✨ Criar Administrador</button>
        </div>
        
        <div id="mensagem"></div>
        
        <div id="loginInfo" style="display: none; margin-top: 20px; text-align: center;">
            <hr style="margin: 20px 0;">
            <button onclick="irParaLogin()" style="background: #3498db;">🔐 Ir para página de Login</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
            authDomain: "identidadeccb.firebaseapp.com",
            projectId: "identidadeccb",
            storageBucket: "identidadeccb.firebasestorage.app",
            messagingSenderId: "385467794937",
            appId: "1:385467794937:web:d2eb32429586f018e2a928"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Verificar status
        async function verificarStatus() {
            const firebaseStatusSpan = document.getElementById('firebaseStatus');
            const authStatusSpan = document.getElementById('authStatus');
            const firestoreStatusSpan = document.getElementById('firestoreStatus');
            
            // Firebase inicializado
            firebaseStatusSpan.innerHTML = '✅ Ativo';
            firebaseStatusSpan.style.color = '#27ae60';
            
            // Verificar Authentication
            try {
                const authConfig = await auth.getConfig();
                authStatusSpan.innerHTML = '✅ Ativo';
                authStatusSpan.style.color = '#27ae60';
            } catch(error) {
                if (error.code === 'auth/internal-error') {
                    authStatusSpan.innerHTML = '⚠️ Precisa ativar no Console - Veja instruções abaixo';
                    authStatusSpan.style.color = '#e74c3c';
                    mostrarInstrucaoAuth();
                } else {
                    authStatusSpan.innerHTML = '⚠️ ' + error.message;
                    authStatusSpan.style.color = '#e74c3c';
                }
            }
            
            // Verificar Firestore
            try {
                await db.collection('teste').doc('teste').set({ teste: true });
                await db.collection('teste').doc('teste').delete();
                firestoreStatusSpan.innerHTML = '✅ Ativo';
                firestoreStatusSpan.style.color = '#27ae60';
            } catch(error) {
                firestoreStatusSpan.innerHTML = '⚠️ ' + error.message;
                firestoreStatusSpan.style.color = '#e74c3c';
            }
        }
        
        function mostrarInstrucaoAuth() {
            const msgDiv = document.getElementById('mensagem');
            msgDiv.innerHTML = `
                <div class="mensagem info">
                    <strong>📌 ATENÇÃO:</strong> Você precisa ativar o Authentication no Firebase Console APENAS UMA VEZ:<br><br>
                    1. Clique neste link: <a href="https://console.firebase.google.com/project/identidadeccb/authentication" target="_blank">console.firebase.google.com/project/identidadeccb/authentication</a><br>
                    2. Clique em "Começar"<br>
                    3. Na aba "Métodos de login", ative o provedor "E-mail/senha"<br>
                    4. Clique em "Salvar"<br>
                    5. Volte aqui e recarregue a página (F5)<br>
                </div>
            `;
        }
        
        async function criarAdministrador() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmarSenha').value;
            const msgDiv = document.getElementById('mensagem');
            
            // Validações
            if (!nome || !email || !senha) {
                msgDiv.innerHTML = '<div class="mensagem erro">❌ Preencha todos os campos</div>';
                return;
            }
            
            if (senha !== confirmar) {
                msgDiv.innerHTML = '<div class="mensagem erro">❌ As senhas não coincidem</div>';
                return;
            }
            
            if (senha.length < 6) {
                msgDiv.innerHTML = '<div class="mensagem erro">❌ A senha deve ter pelo menos 6 caracteres</div>';
                return;
            }
            
            msgDiv.innerHTML = '<div class="mensagem">🔄 Criando administrador...</div>';
            
            try {
                // 1. Criar usuário no Authentication
                const userCredential = await auth.createUserWithEmailAndPassword(email, senha);
                const uid = userCredential.user.uid;
                
                // 2. Adicionar documento na coleção "administradores"
                await db.collection("administradores").doc(uid).set({
                    uid: uid,
                    nome: nome,
                    email: email,
                    papel: "administrador",
                    criadoEm: new Date().toISOString(),
                    ativo: true
                });
                
                // 3. Fazer logout para teste
                await auth.signOut();
                
                msgDiv.innerHTML = `
                    <div class="mensagem sucesso">
                        ✅ Administrador criado com sucesso!<br>
                        <strong>Nome:</strong> ${nome}<br>
                        <strong>E-mail:</strong> ${email}<br>
                        <strong>UID:</strong> ${uid}<br><br>
                        Agora você pode fazer login no sistema!
                    </div>
                `;
                
                // Mostrar botão para ir ao login
                document.getElementById('loginInfo').style.display = 'block';
                
                // Limpar formulário
                document.getElementById('nome').value = '';
                document.getElementById('email').value = '';
                document.getElementById('senha').value = '';
                document.getElementById('confirmarSenha').value = '';
                
            } catch(error) {
                console.error('Erro detalhado:', error);
                
                let mensagemErro = '';
                switch(error.code) {
                    case 'auth/email-already-in-use':
                        mensagemErro = 'Este e-mail já está em uso. Tente outro ou faça login.';
                        break;
                    case 'auth/weak-password':
                        mensagemErro = 'Senha muito fraca. Use pelo menos 6 caracteres.';
                        break;
                    case 'auth/operation-not-allowed':
                        mensagemErro = 'Authentication não está ativado! Siga as instruções acima para ativar.';
                        mostrarInstrucaoAuth();
                        break;
                    default:
                        mensagemErro = error.message;
                }
                
                msgDiv.innerHTML = `<div class="mensagem erro">❌ ${mensagemErro}</div>`;
            }
        }
        
        function irParaLogin() {
            window.location.href = 'login.html';
        }
        
        // Verificar se já existe algum administrador
        async function verificarAdminExistente() {
            try {
                const admins = await db.collection("administradores").limit(1).get();
                if (!admins.empty) {
                    const adminDiv = document.getElementById('formArea');
                    adminDiv.innerHTML = `
                        <div class="mensagem info" style="margin-bottom: 20px;">
                            ✅ Já existe um administrador cadastrado no sistema.<br>
                            <strong>E-mail:</strong> ${admins.docs[0].data().email}<br><br>
                            <button onclick="irParaLogin()" style="background: #3498db;">🔐 Ir para página de Login</button>
                        </div>
                    `;
                    document.getElementById('loginInfo').style.display = 'none';
                }
            } catch(error) {
                console.log('Erro ao verificar administradores:', error);
            }
        }
        
        // Iniciar
        verificarStatus();
        setTimeout(verificarAdminExistente, 2000);
    </script>
</body>
</html>
