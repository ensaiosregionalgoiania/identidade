<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PWA Teste">
    
    <title>PWA Teste</title>
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícones com cores e fundo -->
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%234CAF50'/><text x='96' y='130' font-size='120' text-anchor='middle' fill='white' font-family='Arial'>🚀</text></svg>">
    <link rel="icon" type="image/png" sizes="512x512" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%234CAF50'/><text x='256' y='350' font-size='300' text-anchor='middle' fill='white' font-family='Arial'>🚀</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%234CAF50'/><text x='96' y='130' font-size='120' text-anchor='middle' fill='white' font-family='Arial'>🚀</text></svg>">
    
    <style>
        /* ... seu CSS aqui ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .icone-grande { font-size: 4rem; margin-bottom: 10px; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .btn-instalar {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            display: none;
            transition: all 0.3s ease;
        }
        .btn-instalar:hover { background: #45a049; transform: translateY(-2px); }
        .btn-instalar.visivel { display: block; }
        .badges { margin-top: 15px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-green { background: #4CAF50; color: white; }
        .badge-blue { background: #2196F3; color: white; }
        .badge-orange { background: #FF9800; color: white; }
        .badge-purple { background: #9C27B0; color: white; }
        .detalhes {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #555;
            text-align: left;
        }
        .detalhes .linha { padding: 4px 0; border-bottom: 1px solid #eee; }
        .detalhes .linha:last-child { border-bottom: none; }
        .detalhes strong { color: #333; display: inline-block; min-width: 80px; }
        .info { color: #999; font-size: 0.75rem; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icone-grande">🚀</div>
        <h1>PWA Teste 2</h1>
        <p class="subtitle">Aplicativo Progressivo</p>
        
        <div class="status" id="statusMsg">
            <strong>✅ Pronto para instalar</strong><br>
            <small>Clique no botão abaixo</small>
        </div>
        
        <button id="btnInstalar" class="btn-instalar">📲 Instalar Aplicativo</button>
        
        <div class="badges">
            <span class="badge badge-green">v1.0.0</span>
            <span class="badge badge-blue">PWA</span>
            <span class="badge badge-orange">Teste</span>
            <span class="badge badge-purple">Offline</span>
        </div>
        
        <div class="detalhes">
            <div class="linha"><strong>📱 Status:</strong> <span id="statusApp">Navegador</span></div>
            <div class="linha"><strong>🔄 SW:</strong> <span id="swStatus">⏳ Carregando...</span></div>
            <div class="linha"><strong>📦 Ícone:</strong> <span style="color:#4CAF50;">✅ Emoji 🚀</span></div>
        </div>
        
        <p class="info">
            💡 O ícone será o foguete 🚀<br>
            <small style="color: #bbb;">Personalize trocando o emoji no código</small>
        </p>
    </div>

    <script>
        // ====== STATUS ======
        function atualizarStatus() {
            const statusApp = document.getElementById('statusApp');
            const statusMsg = document.getElementById('statusMsg');
            const btn = document.getElementById('btnInstalar');
            
            if (window.matchMedia('(display-mode: standalone)').matches) {
                statusApp.textContent = '✅ Instalado';
                statusApp.style.color = '#2e7d32';
                statusMsg.innerHTML = '📱 <strong>App instalado!</strong><br><small>Executando em modo standalone 🎉</small>';
                btn.style.display = 'none';
            } else {
                statusApp.textContent = '🌐 Navegador';
                statusApp.style.color = '#666';
            }
        }

        setTimeout(atualizarStatus, 100);
        window.matchMedia('(display-mode: standalone)').addEventListener('change', atualizarStatus);

        // ====== SERVICE WORKER ======
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => {
                    document.getElementById('swStatus').textContent = '✅ Registrado';
                    document.getElementById('swStatus').style.color = '#2e7d32';
                })
                .catch(() => {
                    document.getElementById('swStatus').textContent = '❌ Erro';
                    document.getElementById('swStatus').style.color = '#dc3545';
                });
        }

        // ====== INSTALAÇÃO ======
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            const btn = document.getElementById('btnInstalar');
            btn.style.display = 'block';
            btn.classList.add('visivel');
            
            document.getElementById('statusMsg').innerHTML = '📲 <strong>PWA detectado!</strong><br><small>Clique em "Instalar"</small>';
        });

        document.getElementById('btnInstalar').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                
                if (result.outcome === 'accepted') {
                    document.getElementById('statusMsg').innerHTML = '✅ <strong>Instalado!</strong><br><small>App adicionado à tela inicial 🎉</small>';
                    document.getElementById('btnInstalar').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            document.getElementById('statusMsg').innerHTML = '✅ <strong>App instalado!</strong><br><small>Obrigado! 🎉</small>';
            document.getElementById('btnInstalar').style.display = 'none';
            setTimeout(atualizarStatus, 1000);
        });

        console.log('🚀 PWA com ícone emoji carregado!');
    </script>
</body>
</html>
