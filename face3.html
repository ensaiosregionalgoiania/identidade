<body>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
            authDomain: "identidadeccb.firebaseapp.com",
            projectId: "identidadeccb",
            storageBucket: "identidadeccb.firebasestorage.app",
            messagingSenderId: "385467794937",
            appId: "1:385467794937:web:d2eb32429586f018e2a928"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const membrosCollection = db.collection("membros");
        const facialCollection = db.collection("dados_faciais_v3"); // Nova coleção

        let streamAtual = null;
        let modoAtual = null;
        let membrosList = [];
        let rostosCadastrados = [];

        // Elementos
        const telaInicial = document.getElementById('telaInicial');
        const telaCamera = document.getElementById('telaCamera');
        const telaLista = document.getElementById('telaLista');
        const video = document.getElementById('video');
        const feedbackCamera = document.getElementById('feedbackCamera');
        const tituloCamera = document.getElementById('tituloCamera');
        const zonaCadastroDiv = document.getElementById('zonaCadastro');
        const zonaConsultaDiv = document.getElementById('zonaConsulta');
        const nomeCadastroInput = document.getElementById('nomeCadastro');
        const btnConfirmarCadastro = document.getElementById('btnConfirmarCadastro');
        const btnBuscarFace = document.getElementById('btnBuscarFace');
        const resultadoConsultaDiv = document.getElementById('resultadoConsulta');
        const btnFecharCamera = document.getElementById('btnFecharCamera');
        const btnVoltarMenu = document.getElementById('btnVoltarMenu');
        const btnAbrirCadastro = document.getElementById('btnAbrirCadastro');
        const btnAbrirConsulta = document.getElementById('btnAbrirConsulta');
        const btnAbrirLista = document.getElementById('btnAbrirLista');
        const btnFecharLista = document.getElementById('btnFecharLista');
        const listaBody = document.getElementById('listaBody');
        const progressoDiv = document.getElementById('progressoCarregamento');

        function pararCamera() {
            if (streamAtual) {
                streamAtual.getTracks().forEach(track => track.stop());
                streamAtual = null;
            }
            video.srcObject = null;
        }

        async function iniciarCamera() {
            pararCamera();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                streamAtual = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => { video.play(); resolve(); };
                });
                feedbackCamera.innerText = "✅ Câmera ativa! Posicione o rosto.";
                return true;
            } catch (err) {
                feedbackCamera.innerText = "❌ Erro ao acessar câmera.";
                return false;
            }
        }

        // Capturar rosto com foco na região central (onde normalmente está o rosto)
        async function capturarFace() {
            if (!video.videoWidth) return null;
            
            const canvas = document.createElement('canvas');
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            
            // Focar na região central onde o rosto geralmente está
            const cropX = videoWidth * 0.2;
            const cropY = videoHeight * 0.15;
            const cropWidth = videoWidth * 0.6;
            const cropHeight = videoHeight * 0.7;
            
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // Desenhar apenas a região do rosto
            ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, 128, 128);
            
            // Aplicar melhorias na imagem
            const imageData = ctx.getImageData(0, 0, 128, 128);
            
            // Aplicar equalização de histograma para melhorar contraste
            const equalizedData = equalizarHistograma(imageData);
            ctx.putImageData(equalizedData, 0, 0);
            
            // Gerar hash perceptual mais robusto
            const hash = await gerarHashPerceptual(canvas);
            
            return {
                hash: hash,
                timestamp: Date.now()
            };
        }

        // Equalização de histograma para melhorar contraste
        function equalizarHistograma(imageData) {
            const data = imageData.data;
            const histR = new Array(256).fill(0);
            const histG = new Array(256).fill(0);
            const histB = new Array(256).fill(0);
            
            for (let i = 0; i < data.length; i += 4) {
                histR[data[i]]++;
                histG[data[i+1]]++;
                histB[data[i+2]]++;
            }
            
            let cdfR = 0, cdfG = 0, cdfB = 0;
            const minR = histR.findIndex(v => v > 0);
            const minG = histG.findIndex(v => v > 0);
            const minB = histB.findIndex(v => v > 0);
            const total = data.length / 4;
            
            for (let i = 0; i < 256; i++) {
                cdfR += histR[i];
                cdfG += histG[i];
                cdfB += histB[i];
                
                const equalR = Math.round(((cdfR - minR) / (total - minR)) * 255);
                const equalG = Math.round(((cdfG - minG) / (total - minG)) * 255);
                const equalB = Math.round(((cdfB - minB) / (total - minB)) * 255);
                
                histR[i] = Math.max(0, Math.min(255, equalR));
                histG[i] = Math.max(0, Math.min(255, equalG));
                histB[i] = Math.max(0, Math.min(255, equalB));
            }
            
            const newData = new Uint8ClampedArray(data.length);
            for (let i = 0; i < data.length; i += 4) {
                newData[i] = histR[data[i]];
                newData[i+1] = histG[data[i+1]];
                newData[i+2] = histB[data[i+2]];
                newData[i+3] = 255;
            }
            
            return new ImageData(newData, imageData.width, imageData.height);
        }

        // Gerar hash perceptual (pHash) mais robusto
        async function gerarHashPerceptual(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, 32, 32);
            const data = imageData.data;
            
            // Converter para escala de cinza
            const gray = [];
            for (let i = 0; i < data.length; i += 4) {
                const g = (data[i] + data[i+1] + data[i+2]) / 3;
                gray.push(g);
            }
            
            // Calcular DCT (simplificada)
            const dct = aplicarDCT(gray, 32);
            
            // Extrair os 64 bits mais significativos
            let hash = '';
            const media = calcularMedia(dct);
            
            for (let i = 0; i < 64; i++) {
                hash += dct[i] > media ? '1' : '0';
            }
            
            return hash;
        }

        // Aplicar DCT simplificada
        function aplicarDCT(matrix, size) {
            const result = [];
            for (let u = 0; u < 8; u++) {
                for (let v = 0; v < 8; v++) {
                    let sum = 0;
                    for (let x = 0; x < size; x++) {
                        for (let y = 0; y < size; y++) {
                            const val = matrix[x * size + y];
                            const cu = u === 0 ? 1 / Math.sqrt(2) : 1;
                            const cv = v === 0 ? 1 / Math.sqrt(2) : 1;
                            const cosU = Math.cos((2 * x + 1) * u * Math.PI / (2 * size));
                            const cosV = Math.cos((2 * y + 1) * v * Math.PI / (2 * size));
                            sum += val * cosU * cosV;
                        }
                    }
                    const dctVal = sum * 0.25 * cu * cv;
                    result.push(dctVal);
                }
            }
            return result;
        }

        function calcularMedia(arr) {
            const sum = arr.reduce((a, b) => a + b, 0);
            return sum / arr.length;
        }

        // Calcular distância de Hamming (diferença entre hashes)
        function calcularDistanciaHash(hash1, hash2) {
            if (!hash1 || !hash2 || hash1.length !== hash2.length) return 1;
            let diff = 0;
            for (let i = 0; i < hash1.length; i++) {
                if (hash1[i] !== hash2[i]) diff++;
            }
            return diff / hash1.length;
        }

        // Similaridade (0 a 1, onde 1 é idêntico)
        function calcularSimilaridade(hash1, hash2) {
            return 1 - calcularDistanciaHash(hash1, hash2);
        }

        async function carregarRostosCadastrados() {
            const snapshot = await facialCollection.get();
            rostosCadastrados = [];
            snapshot.forEach(doc => {
                rostosCadastrados.push({
                    id: doc.id,
                    membroId: doc.data().membroId,
                    membroNome: doc.data().membroNome,
                    faceHash: doc.data().faceHash,
                    dataCadastro: doc.data().dataCadastro
                });
            });
            console.log(`✅ ${rostosCadastrados.length} rostos carregados`);
            return rostosCadastrados;
        }

        async function carregarMembros() {
            const snapshot = await membrosCollection.orderBy("id").get();
            membrosList = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                membrosList.push({
                    id: doc.id,
                    nomeId: data.id,
                    nome: data.nome,
                    cargo: data.cargo || ''
                });
            });
            return membrosList;
        }

        // CADASTRAR - Captura múltiplas imagens para melhor precisão
        async function cadastrarRosto() {
            const nome = nomeCadastroInput.value.trim();
            if (!nome) {
                feedbackCamera.innerText = "⚠️ Digite o nome do membro!";
                return;
            }

            const membroEncontrado = membrosList.find(m => 
                m.nome.toLowerCase().includes(nome.toLowerCase())
            );

            if (!membroEncontrado) {
                feedbackCamera.innerText = "❌ Membro não encontrado!";
                return;
            }

            const jaCadastrado = rostosCadastrados.some(r => r.membroId === membroEncontrado.id);
            if (jaCadastrado) {
                feedbackCamera.innerText = `❌ ${membroEncontrado.nome} já possui rosto cadastrado!`;
                return;
            }

            feedbackCamera.innerText = "📸 Capturando rosto (aguarde 3 segundos)...";
            
            // Capturar múltiplas imagens para obter a melhor
            let melhoresHashes = [];
            
            for (let i = 0; i < 5; i++) {
                await new Promise(r => setTimeout(r, 500));
                const faceData = await capturarFace();
                if (faceData && faceData.hash) {
                    melhoresHashes.push(faceData.hash);
                }
                feedbackCamera.innerText = `📸 Capturando... ${i+1}/5`;
            }
            
            if (melhoresHashes.length === 0) {
                feedbackCamera.innerText = "❌ Não foi possível capturar. Tente novamente.";
                return;
            }
            
            // Usar o hash mais consistente
            const hashFinal = encontrarHashMaisConsistente(melhoresHashes);
            
            feedbackCamera.innerText = "💾 Salvando no Firebase...";
            
            try {
                await facialCollection.add({
                    membroId: membroEncontrado.id,
                    membroNome: membroEncontrado.nome,
                    faceHash: hashFinal,
                    dataCadastro: new Date().toISOString()
                });
                
                await carregarRostosCadastrados();
                feedbackCamera.innerHTML = `✅ Rosto de "${membroEncontrado.nome}" cadastrado com sucesso!`;
                nomeCadastroInput.value = "";
                
                setTimeout(() => fecharCameraEVoltar(), 1500);
            } catch (error) {
                console.error(error);
                feedbackCamera.innerText = "❌ Erro ao salvar.";
            }
        }

        function encontrarHashMaisConsistente(hashes) {
            // Retorna o hash que mais se repete
            const contagem = {};
            for (const hash of hashes) {
                contagem[hash] = (contagem[hash] || 0) + 1;
            }
            let maxHash = hashes[0];
            let maxCount = 0;
            for (const [hash, count] of Object.entries(contagem)) {
                if (count > maxCount) {
                    maxCount = count;
                    maxHash = hash;
                }
            }
            return maxHash;
        }

        // CONSULTAR acesso com limiar alto
        async function consultarAcesso() {
            if (rostosCadastrados.length === 0) {
                await carregarRostosCadastrados();
                if (rostosCadastrados.length === 0) {
                    resultadoConsultaDiv.style.display = "block";
                    resultadoConsultaDiv.className = "resultado resultado-erro";
                    resultadoConsultaDiv.innerHTML = "📭 Nenhum rosto cadastrado!";
                    return;
                }
            }
            
            feedbackCamera.innerText = "📸 Analisando rosto...";
            
            // Capturar múltiplas amostras para verificação
            let amostras = [];
            for (let i = 0; i < 3; i++) {
                await new Promise(r => setTimeout(r, 300));
                const faceData = await capturarFace();
                if (faceData && faceData.hash) {
                    amostras.push(faceData.hash);
                }
            }
            
            if (amostras.length === 0) {
                feedbackCamera.innerText = "❌ Não foi possível capturar o rosto.";
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado resultado-erro";
                resultadoConsultaDiv.innerHTML = "❌ Não foi possível capturar o rosto!";
                return;
            }
            
            // Testar cada amostra contra cada rosto cadastrado
            let melhorMatch = null;
            let melhorSimilaridade = 0;
            
            for (const amostra of amostras) {
                for (const rost of rostosCadastrados) {
                    const similaridade = calcularSimilaridade(amostra, rost.faceHash);
                    console.log(`Comparando com ${rost.membroNome}: similaridade = ${similaridade.toFixed(4)}`);
                    
                    // Limiar aumentado para 0.85 (85% de similaridade)
                    if (similaridade > melhorSimilaridade && similaridade > 0.85) {
                        melhorSimilaridade = similaridade;
                        melhorMatch = rost;
                    }
                }
            }
            
            if (melhorMatch && melhorSimilaridade > 0.85) {
                const confianca = Math.round(melhorSimilaridade * 100);
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado resultado-sucesso";
                resultadoConsultaDiv.innerHTML = `
                    ✅ ACESSO LIBERADO!<br>
                    👤 ${melhorMatch.membroNome}<br>
                    🎯 Confiança: ${confianca}%
                `;
                feedbackCamera.innerHTML = `🟢 Bem-vindo(a), ${melhorMatch.membroNome}!`;
                
                const logCollection = db.collection("log_acessos");
                await logCollection.add({
                    membroId: melhorMatch.membroId,
                    membroNome: melhorMatch.membroNome,
                    dataHora: new Date().toISOString(),
                    confianca: confianca
                });
            } else {
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado resultado-erro";
                resultadoConsultaDiv.innerHTML = "❌ ACESSO NEGADO!<br>Rosto não reconhecido.";
                feedbackCamera.innerText = "🔴 Nenhuma correspondência encontrada.";
            }
        }

        async function exibirListaMembros() {
            listaBody.innerHTML = '<div class="loading">Carregando membros...</div>';
            telaLista.classList.add('ativa');
            
            await carregarMembros();
            await carregarRostosCadastrados();
            
            if (membrosList.length === 0) {
                listaBody.innerHTML = '<div style="text-align:center; padding:40px;">📭 Nenhum membro encontrado</div>';
                return;
            }
            
            listaBody.innerHTML = '';
            for (const membro of membrosList) {
                const temRosto = rostosCadastrados.some(r => r.membroId === membro.id);
                const card = document.createElement('div');
                card.className = 'membro-item';
                card.innerHTML = `
                    <div class="membro-info">
                        <h4>👤 ${membro.nome}</h4>
                        <p>ID: ${membro.nomeId || membro.id}</p>
                    </div>
                    <div class="facial-status ${temRosto ? 'facial-cadastrado' : ''}">
                        ${temRosto ? '✅ Rosto cadastrado' : '⏳ Aguardando cadastro'}
                    </div>
                `;
                listaBody.appendChild(card);
            }
        }

        async function abrirModo(modo) {
            modoAtual = modo;
            zonaCadastroDiv.style.display = "none";
            zonaConsultaDiv.style.display = "none";
            resultadoConsultaDiv.style.display = "none";
            nomeCadastroInput.value = "";
            
            if (modo === 'cadastro') {
                tituloCamera.innerText = "📸 CADASTRAR ROSTO";
                zonaCadastroDiv.style.display = "block";
                feedbackCamera.innerText = "📷 Olhe para a câmera e digite o nome";
                await carregarMembros();
                await carregarRostosCadastrados();
            } else {
                tituloCamera.innerText = "🔍 CONSULTAR ACESSO";
                zonaConsultaDiv.style.display = "block";
                feedbackCamera.innerText = "📷 Olhe para a câmera e clique em VERIFICAR";
                await carregarRostosCadastrados();
            }
            
            await iniciarCamera();
            telaCamera.classList.add('ativa');
        }
        
        function fecharCameraEVoltar() {
            pararCamera();
            telaCamera.classList.remove('ativa');
            telaInicial.style.display = 'flex';
        }
        
        btnAbrirCadastro.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            abrirModo('cadastro');
        });
        
        btnAbrirConsulta.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            abrirModo('consulta');
        });
        
        btnAbrirLista.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            exibirListaMembros();
        });
        
        btnFecharLista.addEventListener('click', () => {
            telaLista.classList.remove('ativa');
            telaInicial.style.display = 'flex';
        });
        
        btnVoltarMenu.addEventListener('click', fecharCameraEVoltar);
        btnFecharCamera.addEventListener('click', fecharCameraEVoltar);
        btnConfirmarCadastro.addEventListener('click', cadastrarRosto);
        btnBuscarFace.addEventListener('click', consultarAcesso);
        
        nomeCadastroInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') cadastrarRosto();
        });
        
        async function init() {
            progressoDiv.style.display = 'block';
            await carregarMembros();
            await carregarRostosCadastrados();
            progressoDiv.style.display = 'none';
            telaInicial.style.display = 'flex';
        }
        
        init().catch(console.error);
    </script>
</body>
</html>
