<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sistema de Acesso Facial - CCB</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .tela-inicial {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .tela-inicial h1 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .tela-inicial .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .btn-principal {
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-cadastrar {
            background: #27ae60;
            color: white;
        }

        .btn-consultar {
            background: #3498db;
            color: white;
        }

        .btn-listar {
            background: #9b59b6;
            color: white;
        }

        .btn-principal:active {
            transform: scale(0.98);
        }

        .tela-camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .tela-camera.ativa {
            opacity: 1;
            visibility: visible;
        }

        .camera-card {
            width: 90%;
            max-width: 450px;
            background: #1a1a1a;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
        }

        .camera-header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .camera-header h3 {
            font-size: 18px;
        }

        .btn-fechar {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-controls {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
        }

        .feedback {
            background: rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            color: #f39c12;
            font-size: 13px;
        }

        .input-nome {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #f0f0f0;
            outline: none;
        }

        .btn-acao {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-cadastrar-acao {
            background: #27ae60;
            color: white;
        }

        .btn-consultar-acao {
            background: #3498db;
            color: white;
        }

        .btn-voltar {
            background: #7f8c8d;
            color: white;
            margin-top: 15px;
        }

        .resultado {
            margin-top: 15px;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            font-weight: bold;
            animation: slideDown 0.3s ease;
        }

        .resultado-sucesso {
            background: #27ae60;
            color: white;
        }

        .resultado-erro {
            background: #e74c3c;
            color: white;
        }

        .progresso-carregamento {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 2000;
            display: none;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .tela-lista {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }

        .tela-lista.ativa {
            opacity: 1;
            visibility: visible;
        }

        .lista-card {
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .lista-header {
            background: #3498db;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lista-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .membro-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3498db;
        }

        .membro-info h4 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .membro-info p {
            color: #7f8c8d;
            font-size: 11px;
        }

        .facial-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            background: #ecf0f1;
            color: #2c3e50;
        }

        .facial-cadastrado {
            background: #27ae60;
            color: white;
        }

        .btn-excluir {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 10px;
        }

        .btn-excluir:hover {
            background: #c0392b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .modal-confirm {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .modal-confirm-content {
            background: white;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-confirmar-excluir {
            background: #e74c3c;
            color: white;
        }

        .btn-cancelar-excluir {
            background: #95a5a6;
            color: white;
        }
    </style>
</head>
<body>

    <div class="progresso-carregamento" id="progressoCarregamento">
        <div>🔄 Inicializando sistema...</div>
        <div style="font-size: 12px; margin-top: 10px;">Aguarde</div>
    </div>

    <div id="telaInicial" class="tela-inicial">
        <h1>🚪 Acesso Facial CCB 2</h1>
        <p class="subtitle">Sistema de reconhecimento facial para membros</p>
        <button id="btnAbrirCadastro" class="btn-principal btn-cadastrar">📝 CADASTRAR ROSTO</button>
        <button id="btnAbrirConsulta" class="btn-principal btn-consultar">🔍 CONSULTAR ACESSO</button>
        <button id="btnAbrirLista" class="btn-principal btn-listar">📋 MEMBROS CADASTRADOS</button>
    </div>

    <div id="telaCamera" class="tela-camera">
        <div class="camera-card">
            <div class="camera-header">
                <h3 id="tituloCamera">Modo</h3>
                <button id="btnFecharCamera" class="btn-fechar">✕</button>
            </div>
            <div class="video-wrapper">
                <video id="video" autoplay muted playsinline></video>
            </div>
            <div class="camera-controls">
                <div id="feedbackCamera" class="feedback">🔄 Aguardando...</div>
                <div id="zonaCadastro" style="display: none;">
                    <input type="text" id="nomeCadastro" class="input-nome" placeholder="Digite o nome do membro" autocomplete="off">
                    <button id="btnConfirmarCadastro" class="btn-acao btn-cadastrar-acao">✅ CADASTRAR ROSTO</button>
                </div>
                <div id="zonaConsulta" style="display: none;">
                    <button id="btnBuscarFace" class="btn-acao btn-consultar-acao">🔍 VERIFICAR ACESSO</button>
                    <div id="resultadoConsulta" class="resultado" style="display: none;"></div>
                </div>
                <button id="btnVoltarMenu" class="btn-acao btn-voltar">◀ VOLTAR</button>
            </div>
        </div>
    </div>

    <div id="telaLista" class="tela-lista">
        <div class="lista-card">
            <div class="lista-header">
                <h3>📋 Membros Cadastrados</h3>
                <button id="btnFecharLista" class="btn-fechar" style="background: rgba(255,255,255,0.2);">✕</button>
            </div>
            <div class="lista-body" id="listaBody">
                <div class="loading">Carregando membros...</div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div id="modalConfirm" class="modal-confirm">
        <div class="modal-confirm-content">
            <h3>⚠️ Confirmar Exclusão</h3>
            <p id="modalMensagem">Tem certeza que deseja excluir o rosto deste membro?</p>
            <div class="modal-buttons">
                <button id="btnConfirmarExcluir" class="btn-confirmar-excluir">🗑️ Excluir</button>
                <button id="btnCancelarExcluir" class="btn-cancelar-excluir">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
            authDomain: "identidadeccb.firebaseapp.com",
            projectId: "identidadeccb",
            storageBucket: "identidadeccb.firebasestorage.app",
            messagingSenderId: "385467794937",
            appId: "1:385467794937:web:d2eb32429586f018e2a928"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const membrosCollection = db.collection("membros");
        const facialCollection = db.collection("dados_faciais_v3");

        let streamAtual = null;
        let modoAtual = null;
        let membrosList = [];
        let rostosCadastrados = [];
        let excluirId = null;

        const telaInicial = document.getElementById('telaInicial');
        const telaCamera = document.getElementById('telaCamera');
        const telaLista = document.getElementById('telaLista');
        const video = document.getElementById('video');
        const feedbackCamera = document.getElementById('feedbackCamera');
        const tituloCamera = document.getElementById('tituloCamera');
        const zonaCadastroDiv = document.getElementById('zonaCadastro');
        const zonaConsultaDiv = document.getElementById('zonaConsulta');
        const nomeCadastroInput = document.getElementById('nomeCadastro');
        const btnConfirmarCadastro = document.getElementById('btnConfirmarCadastro');
        const btnBuscarFace = document.getElementById('btnBuscarFace');
        const resultadoConsultaDiv = document.getElementById('resultadoConsulta');
        const btnFecharCamera = document.getElementById('btnFecharCamera');
        const btnVoltarMenu = document.getElementById('btnVoltarMenu');
        const btnAbrirCadastro = document.getElementById('btnAbrirCadastro');
        const btnAbrirConsulta = document.getElementById('btnAbrirConsulta');
        const btnAbrirLista = document.getElementById('btnAbrirLista');
        const btnFecharLista = document.getElementById('btnFecharLista');
        const listaBody = document.getElementById('listaBody');
        const progressoDiv = document.getElementById('progressoCarregamento');
        const modalConfirm = document.getElementById('modalConfirm');
        const btnConfirmarExcluir = document.getElementById('btnConfirmarExcluir');
        const btnCancelarExcluir = document.getElementById('btnCancelarExcluir');

        function pararCamera() {
            if (streamAtual) {
                streamAtual.getTracks().forEach(track => track.stop());
                streamAtual = null;
            }
            video.srcObject = null;
        }

        async function iniciarCamera() {
            pararCamera();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                streamAtual = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => { video.play(); resolve(); };
                });
                feedbackCamera.innerText = "✅ Câmera ativa! Posicione o rosto.";
                return true;
            } catch (err) {
                feedbackCamera.innerText = "❌ Erro ao acessar câmera.";
                return false;
            }
        }

        // Capturar face de forma simples e rápida
        function capturarFace() {
            if (!video.videoWidth) return null;
            
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // Capturar o centro do vídeo (onde o rosto deve estar)
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            const cropX = videoWidth * 0.2;
            const cropY = videoHeight * 0.15;
            const cropW = videoWidth * 0.6;
            const cropH = videoHeight * 0.7;
            
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 128, 128);
            
            // Gerar hash simples
            const imageData = ctx.getImageData(0, 0, 128, 128);
            const hash = gerarHashSimples(imageData);
            
            return { hash: hash };
        }

        function gerarHashSimples(imageData) {
            const data = imageData.data;
            // Reduzir para 32x32
            const size = 32;
            const step = Math.floor(128 / size);
            let hash = '';
            
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const px = x * step;
                    const py = y * step;
                    const idx = (py * 128 + px) * 4;
                    const gray = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    hash += gray > 128 ? '1' : '0';
                }
            }
            return hash;
        }

        function calcularSimilaridade(hash1, hash2) {
            if (!hash1 || !hash2 || hash1.length !== hash2.length) return 0;
            let diff = 0;
            for (let i = 0; i < hash1.length; i++) {
                if (hash1[i] !== hash2[i]) diff++;
            }
            return 1 - (diff / hash1.length);
        }

        async function carregarRostosCadastrados() {
            const snapshot = await facialCollection.get();
            rostosCadastrados = [];
            snapshot.forEach(doc => {
                rostosCadastrados.push({
                    id: doc.id,
                    membroId: doc.data().membroId,
                    membroNome: doc.data().membroNome,
                    faceHash: doc.data().faceHash,
                    dataCadastro: doc.data().dataCadastro
                });
            });
            console.log(`✅ ${rostosCadastrados.length} rostos carregados`);
            return rostosCadastrados;
        }

        async function carregarMembros() {
            const snapshot = await membrosCollection.orderBy("id").get();
            membrosList = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                membrosList.push({
                    id: doc.id,
                    nomeId: data.id,
                    nome: data.nome,
                    cargo: data.cargo || ''
                });
            });
            return membrosList;
        }

        // CADASTRAR - Versão simplificada e rápida
        async function cadastrarRosto() {
            const nome = nomeCadastroInput.value.trim();
            if (!nome) {
                feedbackCamera.innerText = "⚠️ Digite o nome do membro!";
                return;
            }

            const membroEncontrado = membrosList.find(m => 
                m.nome.toLowerCase().includes(nome.toLowerCase())
            );

            if (!membroEncontrado) {
                feedbackCamera.innerText = "❌ Membro não encontrado!";
                return;
            }

            const jaCadastrado = rostosCadastrados.some(r => r.membroId === membroEncontrado.id);
            if (jaCadastrado) {
                feedbackCamera.innerText = `❌ ${membroEncontrado.nome} já possui rosto cadastrado!`;
                return;
            }

            feedbackCamera.innerText = "📸 Capturando rosto...";
            
            const faceData = capturarFace();
            if (!faceData || !faceData.hash) {
                feedbackCamera.innerText = "❌ Não foi possível capturar. Tente novamente.";
                return;
            }

            feedbackCamera.innerText = "💾 Salvando...";
            
            try {
                await facialCollection.add({
                    membroId: membroEncontrado.id,
                    membroNome: membroEncontrado.nome,
                    faceHash: faceData.hash,
                    dataCadastro: new Date().toISOString()
                });
                
                await carregarRostosCadastrados();
                feedbackCamera.innerHTML = `✅ Rosto de "${membroEncontrado.nome}" cadastrado!`;
                nomeCadastroInput.value = "";
                
                setTimeout(() => fecharCameraEVoltar(), 1500);
            } catch (error) {
                console.error(error);
                feedbackCamera.innerText = "❌ Erro ao salvar.";
            }
        }

        // CONSULTAR acesso
        async function consultarAcesso() {
            if (rostosCadastrados.length === 0) {
                await carregarRostosCadastrados();
                if (rostosCadastrados.length === 0) {
                    resultadoConsultaDiv.style.display = "block";
                    resultadoConsultaDiv.className = "resultado resultado-erro";
                    resultadoConsultaDiv.innerHTML = "📭 Nenhum rosto cadastrado!";
                    return;
                }
            }
            
            feedbackCamera.innerText = "📸 Analisando rosto...";
            
            const faceAtual = capturarFace();
            if (!faceAtual || !faceAtual.hash) {
                feedbackCamera.innerText = "❌ Não foi possível capturar.";
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado resultado-erro";
                resultadoConsultaDiv.innerHTML = "❌ Não foi possível capturar o rosto!";
                return;
            }
            
            let melhorMatch = null;
            let melhorSimilaridade = 0;
            
            for (const rost of rostosCadastrados) {
                const similaridade = calcularSimilaridade(faceAtual.hash, rost.faceHash);
                console.log(`${rost.membroNome}: ${similaridade.toFixed(4)}`);
                
                if (similaridade > melhorSimilaridade && similaridade > 0.75) {
                    melhorSimilaridade = similaridade;
                    melhorMatch = rost;
                }
            }
            
            if (melhorMatch && melhorSimilaridade > 0.75) {
                const confianca = Math.round(melhorSimilaridade * 100);
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado resultado-sucesso";
                resultadoConsultaDiv.innerHTML = `
                    ✅ ACESSO LIBERADO!<br>
                    👤 ${melhorMatch.membroNome}<br>
                    🎯 Confiança: ${confianca}%
                `;
                feedbackCamera.innerHTML = `🟢 Bem-vindo(a), ${melhorMatch.membroNome}!`;
                
                const logCollection = db.collection("log_acessos");
                await logCollection.add({
                    membroId: melhorMatch.membroId,
                    membroNome: melhorMatch.membroNome,
                    dataHora: new Date().toISOString(),
                    confianca: confianca
                });
            } else {
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado resultado-erro";
                resultadoConsultaDiv.innerHTML = "❌ ACESSO NEGADO!<br>Rosto não reconhecido.";
                feedbackCamera.innerText = "🔴 Nenhuma correspondência encontrada.";
            }
        }

        // Excluir rosto
        async function excluirRosto(id, nome) {
            try {
                await facialCollection.doc(id).delete();
                await carregarRostosCadastrados();
                await exibirListaMembros();
                mostrarToast(`✅ Rosto de "${nome}" excluído com sucesso!`);
            } catch (error) {
                console.error(error);
                mostrarToast(`❌ Erro ao excluir: ${error.message}`, 'error');
            }
        }

        function mostrarToast(msg, tipo = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo === 'error' ? 'error' : ''}`;
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: ${tipo === 'error' ? '#e74c3c' : '#27ae60'};
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                z-index: 1000;
                animation: fadeIn 0.3s ease;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function exibirListaMembros() {
            listaBody.innerHTML = '<div class="loading">Carregando membros...</div>';
            telaLista.classList.add('ativa');
            
            await carregarMembros();
            await carregarRostosCadastrados();
            
            if (membrosList.length === 0) {
                listaBody.innerHTML = '<div style="text-align:center; padding:40px;">📭 Nenhum membro encontrado</div>';
                return;
            }
            
            listaBody.innerHTML = '';
            for (const membro of membrosList) {
                const rosto = rostosCadastrados.find(r => r.membroId === membro.id);
                const temRosto = !!rosto;
                
                const card = document.createElement('div');
                card.className = 'membro-item';
                card.innerHTML = `
                    <div class="membro-info">
                        <h4>👤 ${membro.nome}</h4>
                        <p>ID: ${membro.nomeId || membro.id}</p>
                    </div>
                    <div>
                        <span class="facial-status ${temRosto ? 'facial-cadastrado' : ''}">
                            ${temRosto ? '✅ Rosto cadastrado' : '⏳ Aguardando cadastro'}
                        </span>
                        ${temRosto ? `<button class="btn-excluir" data-id="${rosto.id}" data-nome="${membro.nome}">🗑️ Excluir</button>` : ''}
                    </div>
                `;
                listaBody.appendChild(card);
            }
            
            // Adicionar eventos de excluir
            document.querySelectorAll('.btn-excluir').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    const nome = btn.getAttribute('data-nome');
                    excluirId = id;
                    document.getElementById('modalMensagem').innerHTML = `Tem certeza que deseja excluir o rosto de <strong>${nome}</strong>?`;
                    modalConfirm.style.display = 'flex';
                });
            });
        }

        async function abrirModo(modo) {
            modoAtual = modo;
            zonaCadastroDiv.style.display = "none";
            zonaConsultaDiv.style.display = "none";
            resultadoConsultaDiv.style.display = "none";
            nomeCadastroInput.value = "";
            
            if (modo === 'cadastro') {
                tituloCamera.innerText = "📸 CADASTRAR ROSTO";
                zonaCadastroDiv.style.display = "block";
                feedbackCamera.innerText = "📷 Olhe para a câmera e digite o nome";
                await carregarMembros();
                await carregarRostosCadastrados();
            } else {
                tituloCamera.innerText = "🔍 CONSULTAR ACESSO";
                zonaConsultaDiv.style.display = "block";
                feedbackCamera.innerText = "📷 Olhe para a câmera e clique em VERIFICAR";
                await carregarRostosCadastrados();
            }
            
            await iniciarCamera();
            telaCamera.classList.add('ativa');
        }
        
        function fecharCameraEVoltar() {
            pararCamera();
            telaCamera.classList.remove('ativa');
            telaInicial.style.display = 'flex';
        }
        
        btnAbrirCadastro.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            abrirModo('cadastro');
        });
        
        btnAbrirConsulta.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            abrirModo('consulta');
        });
        
        btnAbrirLista.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            exibirListaMembros();
        });
        
        btnFecharLista.addEventListener('click', () => {
            telaLista.classList.remove('ativa');
            telaInicial.style.display = 'flex';
        });
        
        btnVoltarMenu.addEventListener('click', fecharCameraEVoltar);
        btnFecharCamera.addEventListener('click', fecharCameraEVoltar);
        btnConfirmarCadastro.addEventListener('click', cadastrarRosto);
        btnBuscarFace.addEventListener('click', consultarAcesso);
        
        btnConfirmarExcluir.addEventListener('click', async () => {
            if (excluirId) {
                const rosto = rostosCadastrados.find(r => r.id === excluirId);
                if (rosto) {
                    await excluirRosto(excluirId, rosto.membroNome);
                }
                modalConfirm.style.display = 'none';
                excluirId = null;
            }
        });
        
        btnCancelarExcluir.addEventListener('click', () => {
            modalConfirm.style.display = 'none';
            excluirId = null;
        });
        
        nomeCadastroInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') cadastrarRosto();
        });
        
        async function init() {
            progressoDiv.style.display = 'block';
            await carregarMembros();
            await carregarRostosCadastrados();
            progressoDiv.style.display = 'none';
            telaInicial.style.display = 'flex';
        }
        
        init().catch(console.error);
    </script>
</body>
</html>
