<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Acesso Facial Pro</title>
    <!-- Carrega a biblioteca localmente da raiz do seu repositório -->
    <script src="face-api.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background: #f0f2f5; color: #333; }
        h2 { text-align: center; font-size: 22px; margin-bottom: 20px; }
        .container { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .video-container { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 6px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 10px; background: #f8f9fa; margin-bottom: 6px; border-radius: 4px; display: flex; justify-content: space-between; font-size: 14px; border-left: 4px solid #007bff; }
        .status { font-weight: bold; color: #28a745; }
        #feedback { font-weight: bold; text-align: center; margin: 10px 0; color: #555; font-size: 15px; }
        
        /* Área de cadastro condicional (escondida por padrão) */
        #zona-cadastro { display: none; margin-top: 10px; padding: 10px; background: #e9ecef; border-radius: 6px; }
        .alerta-erro { color: #dc3545 !important; font-size: 16px; animation: piscar 0.5s alternate infinite; }
        @keyframes piscar { from { opacity: 1; } to { opacity: 0.6; } }
    </style>
</head>
<body>

    <h2>🚪 Controle Facial de Acesso 2</h2>
    
    <div class="container">
        <!-- ÁREA DA CÂMERA (OTIMIZADA PARA CELULAR) -->
        <div class="box">
            <div class="video-container">
                <!-- playsinline impede o iPhone de abrir o vídeo em tela cheia -->
                <video id="video" autoplay muted playsinline></video>
            </div>
            <p id="feedback">Carregando inteligência artificial... Aguarde.</p>
            
            <!-- FORMULÁRIO QUE SÓ APARECE SE O ROSTO FOR NOVO -->
            <div id="zona-cadastro">
                <p style="margin:0; color:#495057; font-weight:bold;">👤 Rosto desconhecido detectado:</p>
                <input type="text" id="nome" placeholder="Digite o nome para cadastrar">
                <button id="btn-cadastrar">Finalizar Cadastro</button>
            </div>
        </div>

        <!-- HISTÓRICO DE ACESSOS -->
        <div class="box">
            <h3>🕒 Registro de Entradas (Log)</h3>
            <ul id="log-acesso"></ul>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const feedback = document.getElementById('feedback');
        const zonaCadastro = document.getElementById('zona-cadastro');
        const btnCadastrar = document.getElementById('btn-cadastrar');
        const nomeInput = document.getElementById('nome');
        const logAcesso = document.getElementById('log-acesso');

        let bancoDados = JSON.parse(localStorage.getItem('usuariosFaciais')) || [];
        let reconhecedorRostos = null;
        let ultimoDescritorDetectado = null; // Guarda temporariamente o rosto visto

        // 1. Inicializar e carregar modelos da pasta "models"
        async function iniciar() {
            try {
                await faceapi.nets.ssdMobilenetv1.loadFromUri('models');
                await faceapi.nets.faceLandmark68Net.loadFromUri('models');
                await faceapi.nets.faceRecognitionNet.loadFromUri('models');
                
                feedback.innerText = "Modelos carregados. Acessando câmera...";
                
                // Configuração ideal para celulares (Câmera de selfie e resolução padrão)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                video.srcObject = stream;
            } catch (err) {
                feedback.innerText = "Erro ao iniciar. Verifique as permissões de câmera.";
                console.error(err);
            }
        }

        // 2. Quando o vídeo iniciar, ativa as validações em loop
        video.addEventListener('play', () => {
            feedback.innerText = "Olhe para a câmera...";
            atualizarReconhecedor();
            setInterval(processarFrameFacial, 1500); // Roda a checagem a cada 1.5 segundos
        });

        // 3. Monta o comparador matemático de rostos
        function atualizarReconhecedor() {
            if (bancoDados.length === 0) return;
            const rotulosIdentificados = bancoDados.map(usuario => {
                return new faceapi.LabeledFaceDescriptors(usuario.nome, [new Float32Array(usuario.descriptor)]);
            });
            // Margem de precisão: 0.55 (quanto menor, mais rigoroso o reconhecimento)
            reconhecedorRostos = new faceapi.FaceMatcher(rotulosIdentificados, 0.55);
        }

        // 4. Lógica Principal: Escaneia e decide o que exibir na tela
        async function processarFrameFacial() {
            const deteccao = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            
            if (!deteccao) {
                feedback.innerText = "Nenhum rosto visível. Posicione-se em frente à tela.";
                feedback.classList.remove('alerta-erro');
                zonaCadastro.style.display = "none";
                ultimoDescritorDetectado = null;
                return;
            }

            // Armazena o vetor matemático do rosto atual para uso no cadastro
            ultimoDescritorDetectado = Array.from(deteccao.descriptor);

            // Cenário A: Não há ninguém cadastrado ainda no banco
            if (bancoDados.length === 0) {
                feedback.innerText = "Nenhum usuário no banco. Cadastre o primeiro!";
                zonaCadastro.style.display = "block";
                return;
            }

            // Cenário B: Comparar rosto atual com os cadastrados
            const resultado = reconhecedorRostos.findBestMatch(deteccao.descriptor);

            if (resultado.label !== 'unknown') {
                // ROSTO ENCONTRADO
                feedback.innerText = `🛑 ${resultado.label} JÁ CADASTRADO(A)!`;
                feedback.classList.add('alerta-erro');
                zonaCadastro.style.display = "none"; // Esconde o formulário se já existe
                registrarEntrada(resultado.label);   // Bate o ponto no log automaticamente
            } else {
                // ROSTO NOVO
                feedback.innerText = "✨ Rosto pronto para registro.";
                feedback.classList.remove('alerta-erro');
                zonaCadastro.style.display = "block"; // Abre os campos de nome e cadastro
            }
        }

        // 5. Salvar Novo Registro no LocalStorage
        btnCadastrar.addEventListener('click', () => {
            const nome = nomeInput.value.trim();
            if (!nome) return alert("Por favor, digite o nome.");
            if (!ultimoDescritorDetectado) return alert("Rosto perdido. Olhe para a câmera novamente.");

            // Adiciona no "banco" do navegador
            bancoDados.push({ nome: nome, descriptor: ultimoDescritorDetectado });
            localStorage.setItem('usuariosFaciais', JSON.stringify(bancoDados));

            nomeInput.value = "";
            zonaCadastro.style.display = "none";
            feedback.innerText = `✅ ${nome} cadastrado com sucesso!`;
            
            atualizarReconhecedor();
        });

        // 6. Imprime a hora de chegada no histórico da tela
        let ultimoRegistrado = "";
        let tempoUltimoRegistro = 0;

        function registrarEntrada(nome) {
            const agora = Date.now();
            // Evita registrar a mesma pessoa repetidamente em menos de 8 segundos
            if (nome === ultimoRegistrado && (agora - tempoUltimoRegistro) < 8000) return;

            ultimoRegistrado = nome;
            tempoUltimoRegistro = agora;

            const horaAtual = new Date().toLocaleTimeString('pt-BR');
            const item = document.createElement('li');
            item.innerHTML = `<span>👤 ${nome}</span> <span class="status">Chegou às ${horaAtual}</span>`;
            logAcesso.prepend(item);
        }

        // Inicializa a aplicação ao carregar a página
        iniciar();
    </script>
</body>
</html>
