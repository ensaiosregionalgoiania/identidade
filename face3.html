<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Controle Facial - Cadastro e Consulta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* TELA INICIAL - DOIS BOTÕES */
        .tela-inicial {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 25px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .tela-inicial h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        .tela-inicial p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .btn-principal {
            padding: 18px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-cadastrar {
            background: #28a745;
            color: white;
        }

        .btn-cadastrar:hover {
            background: #218838;
            transform: scale(0.98);
        }

        .btn-consultar {
            background: #007bff;
            color: white;
        }

        .btn-consultar:hover {
            background: #0069d9;
            transform: scale(0.98);
        }

        /* TELA DE CÂMERA - AGORA COM TAMANHO REDUZIDO */
        .tela-camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .tela-camera.ativa {
            opacity: 1;
            visibility: visible;
        }

        /* CONTAINER PRINCIPAL DA CÂMERA - TAMANHO REDUZIDO */
        .camera-container {
            width: 90%;
            max-width: 450px;
            background: #000;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .cabecalho-camera {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .cabecalho-camera h3 {
            font-size: 18px;
            font-weight: 500;
        }

        .btn-fechar {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-fechar:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* CONTAINER DO VÍDEO - TAMANHO CONTROLADO */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #1a1a1a;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* PAINEL DE CONTROLE */
        .painel-controles {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
        }

        .feedback-area {
            background: rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            color: #ffd966;
            font-size: 13px;
        }

        .input-nome {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #f0f0f0;
            outline: none;
        }

        .input-nome:focus {
            background: white;
            box-shadow: 0 0 0 2px #28a745;
        }

        .btn-acao {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s;
        }

        .btn-acao:active {
            transform: scale(0.98);
        }

        .btn-acao-cadastrar {
            background: #28a745;
            color: white;
        }

        .btn-acao-consultar {
            background: #007bff;
            color: white;
        }

        .btn-acao-voltar {
            background: #6c757d;
            color: white;
            margin-top: 15px;
        }

        .resultado-consulta {
            margin-top: 15px;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .resultado-sucesso {
            background: #28a745;
            color: white;
        }

        .resultado-erro {
            background: #dc3545;
            color: white;
        }

        .erro-camera {
            background: #dc3545 !important;
            color: white !important;
        }

        /* Lista de usuários cadastrados (opcional) */
        .lista-usuarios {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
        }

        .lista-usuarios.hidden {
            display: none;
        }

        .usuario-item {
            color: white;
            font-size: 12px;
            padding: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <!-- TELA INICIAL -->
    <div id="telaInicial" class="tela-inicial">
        <h1>🔒 Acesso Facial</h1>
        <p>Cadastre rostos ou consulte permissões</p>
        <button id="btnAbrirCadastro" class="btn-principal btn-cadastrar">📝 CADASTRAR</button>
        <button id="btnAbrirConsulta" class="btn-principal btn-consultar">🔍 CONSULTAR</button>
    </div>

    <!-- TELA DE CÂMERA - TAMANHO REDUZIDO -->
    <div id="telaCamera" class="tela-camera">
        <div class="camera-container">
            <div class="cabecalho-camera">
                <h3 id="tituloCamera">Modo</h3>
                <button id="btnFecharCamera" class="btn-fechar">✕</button>
            </div>
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>
            <div class="painel-controles">
                <div id="feedbackCamera" class="feedback-area">🔄 Iniciando câmera...</div>
                <div id="zonaCadastro" style="display: none;">
                    <input type="text" id="nomeCadastro" class="input-nome" placeholder="Digite o nome completo" autocomplete="off">
                    <button id="btnConfirmarCadastro" class="btn-acao btn-acao-cadastrar">✅ CADASTRAR</button>
                </div>
                <div id="zonaConsulta" style="display: none;">
                    <button id="btnBuscarFace" class="btn-acao btn-acao-consultar">🔍 VERIFICAR ACESSO</button>
                    <div id="resultadoConsulta" class="resultado-consulta" style="display: none;"></div>
                </div>
                <button id="btnVoltarMenu" class="btn-acao btn-acao-voltar">◀ VOLTAR</button>
            </div>
        </div>
    </div>

    <script>
        // Elementos
        const telaInicial = document.getElementById('telaInicial');
        const telaCamera = document.getElementById('telaCamera');
        const video = document.getElementById('video');
        const feedbackCamera = document.getElementById('feedbackCamera');
        const tituloCamera = document.getElementById('tituloCamera');
        const zonaCadastroDiv = document.getElementById('zonaCadastro');
        const zonaConsultaDiv = document.getElementById('zonaConsulta');
        const nomeCadastroInput = document.getElementById('nomeCadastro');
        const btnConfirmarCadastro = document.getElementById('btnConfirmarCadastro');
        const btnBuscarFace = document.getElementById('btnBuscarFace');
        const resultadoConsultaDiv = document.getElementById('resultadoConsulta');
        const btnFecharCamera = document.getElementById('btnFecharCamera');
        const btnVoltarMenu = document.getElementById('btnVoltarMenu');
        const btnAbrirCadastro = document.getElementById('btnAbrirCadastro');
        const btnAbrirConsulta = document.getElementById('btnAbrirConsulta');

        // Banco de dados
        let bancoUsuarios = JSON.parse(localStorage.getItem('meuBancoFacial')) || [];
        let streamAtual = null;
        let modoAtual = null;
        
        // Função para parar a câmera
        function pararCamera() {
            if (streamAtual) {
                streamAtual.getTracks().forEach(track => track.stop());
                streamAtual = null;
            }
            video.srcObject = null;
        }
        
        // Função para iniciar a câmera
        async function iniciarCamera() {
            pararCamera();
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 480 },
                        height: { ideal: 360 }
                    }
                });
                
                video.srcObject = stream;
                streamAtual = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                
                feedbackCamera.innerText = "✅ Câmera ativa! Posicione o rosto.";
                feedbackCamera.classList.remove('erro-camera');
                return true;
                
            } catch (err) {
                console.error("Erro ao acessar câmera:", err);
                feedbackCamera.innerText = "❌ Não foi possível acessar a câmera. Verifique as permissões.";
                feedbackCamera.classList.add('erro-camera');
                return false;
            }
        }
        
        // Capturar foto atual
        function capturarFotoAtual() {
            if (!video.videoWidth || !video.videoHeight) {
                return null;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            return canvas.toDataURL('image/jpeg', 0.7);
        }
        
        // Calcular cor média da imagem
        function calcularCorMedia(fotoBase64) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 50;
                    canvas.height = 50;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 50, 50);
                    const imageData = ctx.getImageData(0, 0, 50, 50);
                    let r = 0, g = 0, b = 0;
                    for (let i = 0; i < imageData.data.length; i += 4) {
                        r += imageData.data[i];
                        g += imageData.data[i+1];
                        b += imageData.data[i+2];
                    }
                    const total = imageData.data.length / 4;
                    resolve([r/total, g/total, b/total]);
                };
                img.src = fotoBase64;
            });
        }
        
        function diferencaCores(cor1, cor2) {
            const dr = cor1[0] - cor2[0];
            const dg = cor1[1] - cor2[1];
            const db = cor1[2] - cor2[2];
            return Math.sqrt(dr*dr + dg*dg + db*db);
        }
        
        // Cadastrar usuário
        function cadastrarUsuario() {
            const nome = nomeCadastroInput.value.trim();
            
            if (!nome) {
                feedbackCamera.innerText = "⚠️ Digite um nome antes de cadastrar!";
                return;
            }
            
            const existe = bancoUsuarios.some(u => u.nome.toLowerCase() === nome.toLowerCase());
            if (existe) {
                feedbackCamera.innerText = "❌ Este nome já está cadastrado! Use outro.";
                return;
            }
            
            const foto = capturarFotoAtual();
            if (!foto) {
                feedbackCamera.innerText = "❌ Aguarde a câmera estabilizar. Tente novamente.";
                return;
            }
            
            bancoUsuarios.push({
                nome: nome,
                foto: foto,
                dataCadastro: new Date().toISOString()
            });
            
            localStorage.setItem('meuBancoFacial', JSON.stringify(bancoUsuarios));
            
            feedbackCamera.innerHTML = `✅ "${nome}" cadastrado com sucesso!`;
            nomeCadastroInput.value = "";
            
            setTimeout(() => {
                fecharCameraEVoltar();
            }, 1500);
        }
        
        // Consulta facial
        async function realizarConsultaFacial() {
            if (bancoUsuarios.length === 0) {
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado-consulta resultado-erro";
                resultadoConsultaDiv.innerHTML = "📭 Nenhum usuário cadastrado. Vá em CADASTRAR primeiro.";
                feedbackCamera.innerText = "Nenhum cadastro encontrado.";
                return;
            }
            
            feedbackCamera.innerText = "📸 Analisando rosto atual...";
            
            const fotoAtual = capturarFotoAtual();
            if (!fotoAtual) {
                feedbackCamera.innerText = "❌ Não foi possível capturar o rosto. Tente novamente.";
                return;
            }
            
            const corAtual = await calcularCorMedia(fotoAtual);
            
            let melhorMatch = null;
            let menorDiferenca = 60;
            
            for (const usuario of bancoUsuarios) {
                const corCadastrada = await calcularCorMedia(usuario.foto);
                const diff = diferencaCores(corAtual, corCadastrada);
                
                if (diff < menorDiferenca) {
                    menorDiferenca = diff;
                    melhorMatch = usuario;
                }
            }
            
            if (melhorMatch && menorDiferenca < 55) {
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado-consulta resultado-sucesso";
                resultadoConsultaDiv.innerHTML = `✅ ACESSO LIBERADO!<br>👤 ${melhorMatch.nome}`;
                feedbackCamera.innerHTML = `🟢 Reconhecido: ${melhorMatch.nome}`;
            } else {
                resultadoConsultaDiv.style.display = "block";
                resultadoConsultaDiv.className = "resultado-consulta resultado-erro";
                resultadoConsultaDiv.innerHTML = "❌ ACESSO NEGADO!<br>Rosto não reconhecido.";
                feedbackCamera.innerText = "🔴 Nenhuma correspondência encontrada.";
            }
        }
        
        // Abrir modo
        async function abrirModo(modo) {
            modoAtual = modo;
            
            zonaCadastroDiv.style.display = "none";
            zonaConsultaDiv.style.display = "none";
            resultadoConsultaDiv.style.display = "none";
            nomeCadastroInput.value = "";
            feedbackCamera.classList.remove('erro-camera');
            
            if (modo === 'cadastro') {
                tituloCamera.innerText = "📸 CADASTRO DE ROSTO";
                zonaCadastroDiv.style.display = "block";
                feedbackCamera.innerText = "📷 Olhe para a câmera e digite seu nome.";
            } else {
                tituloCamera.innerText = "🔍 CONSULTA DE ACESSO";
                zonaConsultaDiv.style.display = "block";
                feedbackCamera.innerText = "📷 Olhe para a câmera e clique em VERIFICAR.";
            }
            
            const cameraOk = await iniciarCamera();
            if (!cameraOk) {
                setTimeout(() => {
                    if (modoAtual === modo) {
                        feedbackCamera.innerText = "❌ Sem acesso à câmera. Verifique as permissões.";
                    }
                }, 100);
            }
            
            telaCamera.classList.add('ativa');
        }
        
        function fecharCameraEVoltar() {
            pararCamera();
            telaCamera.classList.remove('ativa');
            telaInicial.style.display = 'flex';
            modoAtual = null;
        }
        
        // Eventos
        btnAbrirCadastro.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            abrirModo('cadastro');
        });
        
        btnAbrirConsulta.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            abrirModo('consulta');
        });
        
        btnVoltarMenu.addEventListener('click', () => {
            fecharCameraEVoltar();
        });
        
        btnFecharCamera.addEventListener('click', () => {
            fecharCameraEVoltar();
        });
        
        btnConfirmarCadastro.addEventListener('click', cadastrarUsuario);
        btnBuscarFace.addEventListener('click', realizarConsultaFacial);
        
        nomeCadastroInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                cadastrarUsuario();
            }
        });
        
        // Inicialização
        telaInicial.style.display = 'flex';
        
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("Seu navegador não suporta acesso à câmera.");
        }
        
        console.log(`Banco de dados: ${bancoUsuarios.length} usuários cadastrados.`);
    </script>
</body>
</html>
