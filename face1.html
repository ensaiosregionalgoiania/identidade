<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reconhecimento Facial - Identificar Pessoa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 4/3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-recognize {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .log-area {
            background: #2c3e50;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .log-message {
            padding: 5px 0;
            border-bottom: 1px solid #3d5a6c;
            color: #ecf0f1;
        }

        .log-message.success {
            color: #2ecc71;
        }

        .log-message.error {
            color: #e74c3c;
        }

        .log-message.warning {
            color: #f39c12;
        }

        .log-message.info {
            color: #3498db;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .result-success {
            background: #d4edda;
            border: 2px solid #27ae60;
        }

        .result-error {
            background: #f8d7da;
            border: 2px solid #e74c3c;
        }

        .result-warning {
            background: #fff3cd;
            border: 2px solid #f39c12;
        }

        .result-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }

        .result-confidence {
            font-size: 1rem;
            color: #666;
            margin: 5px 0;
        }

        .result-date {
            font-size: 0.8rem;
            color: #999;
            margin-top: 10px;
        }

        .captured-image {
            max-width: 150px;
            border-radius: 10px;
            margin: 10px auto;
            display: block;
            border: 2px solid #ddd;
        }

        .matched-image {
            max-width: 80px;
            border-radius: 10px;
            margin: 5px;
            border: 2px solid #27ae60;
        }

        .status {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
        }

        .users-count {
            text-align: center;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        @media (max-width: 480px) {
            .card {
                padding: 15px;
            }
            
            button {
                padding: 10px 16px;
                font-size: 12px;
            }
            
            .result-name {
                font-size: 1.2rem;
            }
            
            .log-area {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔍 Reconhecimento Facial</h1>
            <div class="subtitle">Capture uma nova imagem e tente reconhecer a pessoa</div>

            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>

            <canvas id="canvas"></canvas>

            <div class="controls">
                <button id="startCameraBtn" onclick="startCamera()">📷 Iniciar Câmera</button>
                <button id="captureBtn" onclick="captureImage()" disabled>📸 Capturar para Reconhecer</button>
            </div>

            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div id="status" class="status info">
                👆 Clique em "Iniciar Câmera" para começar
            </div>

            <div class="log-area" id="logArea">
                <div class="log-message info">🟢 Sistema inicializado. Aguardando comandos...</div>
            </div>

            <div id="resultArea" style="display: none;">
                <div class="result-card" id="resultCard">
                    <h3 id="resultTitle">🎯 Resultado da Identificação</h3>
                    <img id="capturedImagePreview" class="captured-image" alt="Imagem capturada">
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>📋 Pessoas Cadastradas (<span id="userCount">0</span>)</h3>
            <div id="usersList" class="users-list">
                <div class="empty-message" style="text-align: center; color: #999; padding: 20px;">Nenhuma pessoa cadastrada</div>
            </div>
            <div class="users-count" id="usersCountInfo"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let stream = null;
        let capturedImageData = null;
        let modelsLoaded = false;
        let users = [];

        // Adicionar mensagem ao log
        function addLogMessage(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const logDiv = document.createElement('div');
            logDiv.className = `log-message ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('pt-BR');
            
            let icon = '📌';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warning') icon = '⚠️';
            if (type === 'info') icon = 'ℹ️';
            
            logDiv.innerHTML = `[${timestamp}] ${icon} ${message}`;
            logArea.appendChild(logDiv);
            logArea.scrollTop = logArea.scrollHeight;
            
            // Limitar número de mensagens
            while (logArea.children.length > 20) {
                logArea.removeChild(logArea.firstChild);
            }
        }

        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            if (percent > 0 && percent < 100) {
                progressBar.style.display = 'block';
                progressFill.style.width = percent + '%';
            } else {
                progressBar.style.display = 'none';
                progressFill.style.width = '0%';
            }
        }

        function loadUsers() {
            const saved = localStorage.getItem('face_users');
            if (saved) {
                users = JSON.parse(saved);
                updateUsersList();
                addLogMessage(`${users.length} pessoa(s) carregada(s) do banco de dados`, 'info');
            } else {
                // Criar usuários de exemplo para teste
                addLogMessage('Nenhuma pessoa cadastrada encontrada. Cadastre alguém primeiro!', 'warning');
            }
        }

        function updateUsersList() {
            const container = document.getElementById('usersList');
            const countSpan = document.getElementById('userCount');
            
            if (users.length === 0) {
                container.innerHTML = '<div class="empty-message" style="text-align: center; color: #999; padding: 20px;">Nenhuma pessoa cadastrada</div>';
                countSpan.textContent = '0';
                document.getElementById('usersCountInfo').innerHTML = '';
                return;
            }
            
            countSpan.textContent = users.length;
            document.getElementById('usersCountInfo').innerHTML = `📊 ${users.length} pessoa(s) cadastrada(s) no sistema`;
            
            container.innerHTML = users.map((user) => `
                <div class="user-item" style="background: #f8f9fa; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div class="user-info" style="flex: 1;">
                        <div class="user-name" style="font-weight: bold; color: #333;">👤 ${escapeHtml(user.name)}</div>
                        <div class="user-date" style="font-size: 0.7rem; color: #666;">📅 ${user.date}</div>
                    </div>
                    <div>
                        <img src="${user.image}" class="preview-img" style="max-width: 50px; border-radius: 8px;" alt="${user.name}">
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function showResult(matchedUser, confidence, capturedImage, detectionStatus) {
            const resultArea = document.getElementById('resultArea');
            const resultCard = document.getElementById('resultCard');
            const capturedImagePreview = document.getElementById('capturedImagePreview');
            const resultContent = document.getElementById('resultContent');
            
            resultArea.style.display = 'block';
            capturedImagePreview.src = capturedImage;
            
            if (matchedUser) {
                resultCard.className = 'result-card result-success';
                resultContent.innerHTML = `
                    <div class="result-name">✅ ${matchedUser.name}</div>
                    <div class="result-confidence">🎯 Confiança: ${(confidence * 100).toFixed(1)}%</div>
                    <div class="result-date">📅 Cadastrado em: ${matchedUser.date}</div>
                    <div style="margin-top: 15px;">
                        <img src="${matchedUser.image}" class="matched-image" alt="Cadastro">
                        <span style="font-size: 0.8rem;">↔️</span>
                        <img src="${capturedImage}" class="matched-image" alt="Capturado">
                    </div>
                    <div style="margin-top: 15px; font-size: 0.85rem; color: #27ae60;">
                        🎉 Pessoa identificada com sucesso! Encontrou o nome: ${matchedUser.name}
                    </div>
                `;
                addLogMessage(`✅ Correspondência encontrada! Identificado como: ${matchedUser.name} (${(confidence * 100).toFixed(1)}% confiança)`, 'success');
            } else if (detectionStatus === false) {
                resultCard.className = 'result-card result-warning';
                resultContent.innerHTML = `
                    <div class="result-name">⚠️ Nenhum Rosto Detectado</div>
                    <div style="margin-top: 15px; font-size: 0.85rem; color: #f39c12;">
                        Não foi possível detectar um rosto na imagem capturada.
                        <br>Tente novamente com uma iluminação melhor e olhando diretamente para a câmera.
                    </div>
                `;
                addLogMessage('❌ Nenhum rosto detectado na imagem capturada', 'warning');
            } else {
                resultCard.className = 'result-card result-error';
                resultContent.innerHTML = `
                    <div class="result-name">❌ Pessoa Não Reconhecida</div>
                    <div class="result-confidence">🎯 Melhor correspondência: ${(confidence * 100).toFixed(1)}%</div>
                    <div style="margin-top: 15px; font-size: 0.85rem; color: #e74c3c;">
                        ⚠️ Não foi possível identificar esta pessoa no sistema.
                        <br>Verifique se ela está cadastrada ou tente uma imagem mais nítida.
                    </div>
                `;
                addLogMessage(`❌ Análise concluída: nenhuma correspondência encontrada (confiança máxima: ${(confidence * 100).toFixed(1)}%)`, 'error');
            }
            
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function loadModels() {
            // Usando CDN com os modelos corretos
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            
            addLogMessage('Iniciando carregamento dos modelos de IA...', 'info');
            showStatus('📥 Carregando modelos de IA...', 'info');
            updateProgress(10);
            
            try {
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                updateProgress(40);
                addLogMessage('✓ Modelo de detecção facial carregado', 'success');
                
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                updateProgress(70);
                addLogMessage('✓ Modelo de landmarks faciais carregado', 'success');
                
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                updateProgress(100);
                addLogMessage('✓ Modelo de reconhecimento facial carregado', 'success');
                
                modelsLoaded = true;
                showStatus('✅ Modelos carregados! Inicie a câmera', 'success');
                addLogMessage('✅ Todos os modelos carregados com sucesso!', 'success');
                document.getElementById('startCameraBtn').disabled = false;
                updateProgress(0);
                
            } catch (error) {
                console.error('Erro ao carregar modelos:', error);
                addLogMessage(`❌ Erro ao carregar modelos: ${error.message}`, 'error');
                showStatus('❌ Erro ao carregar modelos. Verifique sua internet.', 'error');
                updateProgress(0);
            }
        }

        async function startCamera() {
            addLogMessage('Iniciando solicitação de acesso à câmera...', 'info');
            
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    addLogMessage('Câmera anterior foi desligada', 'info');
                }
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                video.srcObject = stream;
                
                addLogMessage('✅ Acesso à câmera concedido', 'success');
                
                await video.play();
                
                await new Promise((resolve) => {
                    if (video.readyState >= 2) {
                        resolve();
                    } else {
                        video.onloadeddata = () => resolve();
                    }
                });
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                addLogMessage(`📹 Câmera ativada (resolução: ${video.videoWidth}x${video.videoHeight})`, 'success');
                showStatus('✅ Câmera ativada! Clique em "Capturar para Reconhecer"', 'success');
                document.getElementById('startCameraBtn').disabled = true;
                document.getElementById('captureBtn').disabled = false;
                
            } catch (error) {
                console.error('Erro ao acessar câmera:', error);
                addLogMessage(`❌ Erro ao acessar câmera: ${error.message}`, 'error');
                showStatus('❌ Erro ao acessar a câmera. Verifique as permissões.', 'error');
            }
        }

        // Função corrigida para extrair descriptor facial
        async function getFaceDescriptorFromImage(imageElement) {
            // Detectar rosto na imagem
            const detection = await faceapi.detectSingleFace(
                imageElement, 
                new faceapi.TinyFaceDetectorOptions()
            ).withFaceLandmarks().withFaceDescriptor();
            
            return detection;
        }

        // Função corrigida para processar imagem e extrair descriptor
        async function extractFaceDescriptorFromDataURL(dataURL) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = async () => {
                    try {
                        addLogMessage('Imagem carregada, processando detecção facial...', 'info');
                        const detection = await getFaceDescriptorFromImage(img);
                        if (detection && detection.descriptor) {
                            addLogMessage('Rosto detectado e descritor extraído com sucesso!', 'success');
                            resolve(detection);
                        } else {
                            addLogMessage('Nenhum rosto detectado na imagem', 'warning');
                            resolve(null);
                        }
                    } catch (error) {
                        reject(error);
                    }
                };
                img.onerror = () => reject(new Error('Erro ao carregar imagem'));
                img.src = dataURL;
            });
        }

        async function recognizePerson(capturedDescriptor) {
            if (users.length === 0) {
                addLogMessage('Banco de dados vazio. Nenhuma pessoa cadastrada para comparar.', 'warning');
                return { matched: null, confidence: 0, bestDistance: 1 };
            }
            
            addLogMessage(`🔍 Iniciando comparação com ${users.length} pessoa(s) cadastrada(s)...`, 'info');
            
            let bestMatch = null;
            let bestDistance = 0.6; // Limiar de distância (menor = mais similar)
            let bestDistanceValue = 1;
            
            for (const user of users) {
                try {
                    addLogMessage(`Comparando com ${user.name}...`, 'info');
                    
                    // Extrair descriptor da imagem do usuário cadastrado
                    const userDetection = await extractFaceDescriptorFromDataURL(user.image);
                    
                    if (userDetection && userDetection.descriptor) {
                        const distance = faceapi.euclideanDistance(capturedDescriptor, userDetection.descriptor);
                        addLogMessage(`  → Distância para ${user.name}: ${distance.toFixed(4)}`, 'info');
                        
                        if (distance < bestDistance) {
                            bestDistance = distance;
                            bestMatch = user;
                            bestDistanceValue = distance;
                            addLogMessage(`  → Nova melhor correspondência: ${user.name} (distância: ${distance.toFixed(4)})`, 'success');
                        }
                    } else {
                        addLogMessage(`  → Não foi possível extrair descritor facial de ${user.name}`, 'warning');
                    }
                } catch (error) {
                    console.error(`Erro ao processar usuário ${user.name}:`, error);
                    addLogMessage(`  → Erro ao processar ${user.name}: ${error.message}`, 'error');
                }
            }
            
            // Converter distância para confiança (1 - distância, com limite máximo)
            const confidence = bestMatch ? Math.min(1, Math.max(0, 1 - bestDistanceValue)) : 0;
            
            addLogMessage(`📊 Análise concluída! Melhor correspondência: ${bestMatch ? bestMatch.name : 'nenhuma'} (confiança: ${(confidence * 100).toFixed(1)}%)`, bestMatch ? 'success' : 'warning');
            
            return { matched: bestMatch, confidence, bestDistance: bestDistanceValue };
        }

        async function captureImage() {
            if (!stream) {
                addLogMessage('❌ Câmera não está ativa. Inicie a câmera primeiro.', 'error');
                showStatus('❌ Câmera não está ativa.', 'error');
                return;
            }
            
            if (!modelsLoaded) {
                addLogMessage('⏳ Modelos de IA ainda não carregados. Aguarde...', 'warning');
                showStatus('⏳ Aguarde os modelos carregarem...', 'warning');
                return;
            }
            
            if (users.length === 0) {
                addLogMessage('⚠️ Nenhuma pessoa cadastrada. Cadastre alguém primeiro.', 'warning');
                showStatus('⚠️ Nenhuma pessoa cadastrada.', 'warning');
                return;
            }
            
            addLogMessage('📸 Iniciando captura de imagem...', 'info');
            showStatus('🔍 Capturando imagem...', 'info');
            document.getElementById('captureBtn').disabled = true;
            updateProgress(10);
            
            try {
                // Capturar imagem do vídeo
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const capturedImage = canvas.toDataURL('image/jpeg', 0.9);
                addLogMessage('✅ Imagem capturada com sucesso!', 'success');
                updateProgress(30);
                
                addLogMessage('🔍 Analisando imagem em busca de rosto...', 'info');
                
                // Extrair descriptor da imagem capturada
                const captureDetection = await extractFaceDescriptorFromDataURL(capturedImage);
                updateProgress(60);
                
                if (!captureDetection || !captureDetection.descriptor) {
                    addLogMessage('❌ Nenhum rosto detectado na imagem capturada!', 'warning');
                    showStatus('❌ Nenhum rosto detectado.', 'error');
                    showResult(null, null, capturedImage, false);
                    document.getElementById('captureBtn').disabled = false;
                    updateProgress(0);
                    return;
                }
                
                addLogMessage('✅ Rosto detectado com sucesso! Iniciando comparação...', 'success');
                updateProgress(70);
                
                const { matched, confidence } = await recognizePerson(captureDetection.descriptor);
                updateProgress(100);
                
                if (matched) {
                    addLogMessage(`🎉 CORRESPONDÊNCIA ENCONTRADA! Identificado como: ${matched.name} (${(confidence * 100).toFixed(1)}% confiança)`, 'success');
                    addLogMessage(`✅ Encontrou o nome: ${matched.name}`, 'success');
                    showStatus(`✅ Pessoa reconhecida: ${matched.name}`, 'success');
                    showResult(matched, confidence, capturedImage, true);
                } else {
                    addLogMessage(`❌ Nenhuma correspondência encontrada. Confiança máxima: ${(confidence * 100).toFixed(1)}%`, 'error');
                    showStatus('❌ Pessoa não reconhecida.', 'error');
                    showResult(null, confidence, capturedImage, true);
                }
                
            } catch (error) {
                console.error('Erro no reconhecimento:', error);
                addLogMessage(`❌ Erro durante o reconhecimento: ${error.message}`, 'error');
                showStatus('❌ Erro ao processar imagem.', 'error');
            } finally {
                document.getElementById('captureBtn').disabled = false;
                setTimeout(() => updateProgress(0), 1000);
            }
        }

        async function init() {
            document.getElementById('startCameraBtn').disabled = true;
            document.getElementById('captureBtn').disabled = true;
            
            addLogMessage('📱 Sistema de Reconhecimento Facial iniciado', 'success');
            loadUsers();
            await loadModels();
        }
        
        init();
    </script>
</body>
</html>
