<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reconhecimento Facial - Corrigido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 4/3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .log-area {
            background: #2c3e50;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .log-message {
            padding: 5px 0;
            border-bottom: 1px solid #3d5a6c;
            color: #ecf0f1;
        }

        .log-message.success {
            color: #2ecc71;
        }

        .log-message.error {
            color: #e74c3c;
        }

        .log-message.warning {
            color: #f39c12;
        }

        .log-message.info {
            color: #3498db;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .result-success {
            background: #d4edda;
            border: 2px solid #27ae60;
        }

        .result-error {
            background: #f8d7da;
            border: 2px solid #e74c3c;
        }

        .result-warning {
            background: #fff3cd;
            border: 2px solid #f39c12;
        }

        .result-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }

        .result-confidence {
            font-size: 1rem;
            color: #666;
            margin: 5px 0;
        }

        .captured-image {
            max-width: 150px;
            border-radius: 10px;
            margin: 10px auto;
            display: block;
            border: 2px solid #ddd;
        }

        .matched-image {
            max-width: 80px;
            border-radius: 10px;
            margin: 5px;
            border: 2px solid #27ae60;
        }

        .status {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
        }

        .users-count {
            text-align: center;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .btn-add {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            margin-bottom: 10px;
        }

        .add-user-form {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .add-user-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 15px;
            }
            
            button {
                padding: 10px 16px;
                font-size: 12px;
            }
            
            .result-name {
                font-size: 1.2rem;
            }
            
            .log-area {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔍 Reconhecimento Facial 2</h1>
            <div class="subtitle">Capture uma nova imagem e tente reconhecer a pessoa</div>

            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>

            <canvas id="canvas"></canvas>

            <div class="controls">
                <button id="startCameraBtn" onclick="startCamera()">📷 Iniciar Câmera</button>
                <button id="captureBtn" onclick="captureImage()" disabled>📸 Capturar para Reconhecer</button>
            </div>

            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div id="status" class="status info">
                👆 Clique em "Iniciar Câmera" para começar
            </div>

            <div class="log-area" id="logArea">
                <div class="log-message info">🟢 Sistema inicializado. Aguardando comandos...</div>
            </div>

            <div id="resultArea" style="display: none;">
                <div class="result-card" id="resultCard">
                    <h3 id="resultTitle">🎯 Resultado da Identificação</h3>
                    <img id="capturedImagePreview" class="captured-image" alt="Imagem capturada">
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <button class="btn-add" onclick="showAddUserForm()">➕ Adicionar Nova Pessoa</button>
            <div id="addUserForm" style="display: none;" class="add-user-form">
                <input type="text" id="userName" placeholder="Nome da pessoa" autocomplete="off">
                <button onclick="addNewUser()">📸 Capturar e Salvar</button>
                <button onclick="hideAddUserForm()" style="background: #95a5a6;">Cancelar</button>
            </div>
            
            <h3>📋 Pessoas Cadastradas (<span id="userCount">0</span>)</h3>
            <div id="usersList" class="users-list">
                <div class="empty-message" style="text-align: center; color: #999; padding: 20px;">Nenhuma pessoa cadastrada</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let stream = null;
        let modelsLoaded = false;
        let users = [];
        let isProcessing = false;

        function addLogMessage(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const logDiv = document.createElement('div');
            logDiv.className = `log-message ${type}`;
            const timestamp = new Date().toLocaleTimeString('pt-BR');
            let icon = '📌';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warning') icon = '⚠️';
            if (type === 'info') icon = 'ℹ️';
            logDiv.innerHTML = `[${timestamp}] ${icon} ${message}`;
            logArea.appendChild(logDiv);
            logArea.scrollTop = logArea.scrollHeight;
            while (logArea.children.length > 20) {
                logArea.removeChild(logArea.firstChild);
            }
        }

        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            if (percent > 0 && percent < 100) {
                progressBar.style.display = 'block';
                progressFill.style.width = percent + '%';
            } else {
                progressBar.style.display = 'none';
                progressFill.style.width = '0%';
            }
        }

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            setTimeout(() => {
                if (statusDiv.className === `status ${type}`) {
                    setTimeout(() => {
                        if (statusDiv.className === `status ${type}`) {
                            statusDiv.className = 'status info';
                            statusDiv.textContent = '✅ Sistema pronto';
                        }
                    }, 3000);
                }
            }, 3000);
        }

        function showAddUserForm() {
            document.getElementById('addUserForm').style.display = 'block';
        }

        function hideAddUserForm() {
            document.getElementById('addUserForm').style.display = 'none';
            document.getElementById('userName').value = '';
        }

        async function addNewUser() {
            const name = document.getElementById('userName').value.trim();
            if (!name) {
                addLogMessage('Por favor, insira um nome', 'warning');
                return;
            }

            if (!stream) {
                addLogMessage('Câmera não está ativa', 'error');
                return;
            }

            addLogMessage(`Capturando imagem para cadastrar: ${name}`, 'info');
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.9);
            
            // Detectar rosto antes de salvar
            const img = new Image();
            img.src = imageData;
            await new Promise((resolve) => { img.onload = resolve; });
            
            try {
                const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();
                
                if (!detection) {
                    addLogMessage('Nenhum rosto detectado! Tente novamente com boa iluminação', 'error');
                    return;
                }
                
                users.push({
                    name: name,
                    image: imageData,
                    date: new Date().toLocaleDateString('pt-BR'),
                    descriptor: Array.from(detection.descriptor) // Salvar descritor
                });
                
                localStorage.setItem('face_users', JSON.stringify(users));
                updateUsersList();
                addLogMessage(`✅ ${name} cadastrado com sucesso!`, 'success');
                hideAddUserForm();
                
            } catch (error) {
                addLogMessage(`Erro ao cadastrar: ${error.message}`, 'error');
            }
        }

        function loadUsers() {
            const saved = localStorage.getItem('face_users');
            if (saved) {
                users = JSON.parse(saved);
                addLogMessage(`${users.length} pessoa(s) carregada(s)`, 'success');
            } else {
                addLogMessage('Nenhuma pessoa cadastrada. Adicione alguém usando o formulário!', 'warning');
            }
            updateUsersList();
        }

        function updateUsersList() {
            const container = document.getElementById('usersList');
            const countSpan = document.getElementById('userCount');
            
            if (users.length === 0) {
                container.innerHTML = '<div class="empty-message" style="text-align: center; color: #999; padding: 20px;">Nenhuma pessoa cadastrada</div>';
                countSpan.textContent = '0';
                return;
            }
            
            countSpan.textContent = users.length;
            container.innerHTML = users.map((user, index) => `
                <div style="background: #f8f9fa; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="font-weight: bold;">👤 ${escapeHtml(user.name)}</div>
                        <div style="font-size: 0.7rem; color: #666;">📅 ${user.date}</div>
                    </div>
                    <div>
                        <img src="${user.image}" style="max-width: 50px; border-radius: 8px;">
                        <button onclick="deleteUser(${index})" style="background: #e74c3c; padding: 5px 10px; margin-left: 10px; font-size: 11px;">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteUser(index) {
            users.splice(index, 1);
            localStorage.setItem('face_users', JSON.stringify(users));
            updateUsersList();
            addLogMessage('Usuário removido', 'info');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadModels() {
            addLogMessage('Carregando modelos de IA...', 'info');
            showStatus('📥 Carregando modelos...', 'info');
            updateProgress(10);
            
            try {
                // Usar modelos do CDN oficial
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights');
                updateProgress(50);
                addLogMessage('✓ Detector facial carregado', 'success');
                
                await faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights');
                updateProgress(75);
                addLogMessage('✓ Landmarks faciais carregados', 'success');
                
                await faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights');
                updateProgress(100);
                addLogMessage('✓ Reconhecimento facial carregado', 'success');
                
                modelsLoaded = true;
                showStatus('✅ Modelos carregados!', 'success');
                document.getElementById('startCameraBtn').disabled = false;
                updateProgress(0);
                
            } catch (error) {
                addLogMessage(`Erro ao carregar modelos: ${error.message}`, 'error');
                showStatus('❌ Erro ao carregar modelos', 'error');
            }
        }

        async function startCamera() {
            addLogMessage('Solicitando acesso à câmera...', 'info');
            
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: 640, height: 480 } 
                });
                video.srcObject = stream;
                await video.play();
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                addLogMessage('✅ Câmera ativada!', 'success');
                showStatus('✅ Câmera ativa!', 'success');
                document.getElementById('startCameraBtn').disabled = true;
                document.getElementById('captureBtn').disabled = false;
                
            } catch (error) {
                addLogMessage(`Erro na câmera: ${error.message}`, 'error');
            }
        }

        async function captureImage() {
            if (isProcessing) {
                addLogMessage('Processamento em andamento, aguarde...', 'warning');
                return;
            }
            
            if (!stream) {
                addLogMessage('Câmera não ativa', 'error');
                return;
            }
            
            if (!modelsLoaded) {
                addLogMessage('Modelos não carregados', 'error');
                return;
            }
            
            if (users.length === 0) {
                addLogMessage('Nenhuma pessoa cadastrada! Adicione alguém primeiro.', 'warning');
                return;
            }
            
            isProcessing = true;
            document.getElementById('captureBtn').disabled = true;
            updateProgress(10);
            
            try {
                addLogMessage('Capturando imagem...', 'info');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const capturedImage = canvas.toDataURL('image/jpeg', 0.9);
                updateProgress(30);
                
                addLogMessage('Processando imagem capturada...', 'info');
                
                // Carregar imagem capturada
                const capturedImg = new Image();
                capturedImg.src = capturedImage;
                await new Promise((resolve) => { capturedImg.onload = resolve; });
                
                updateProgress(50);
                addLogMessage('Detectando rosto na imagem...', 'info');
                
                // Detectar rosto na imagem capturada
                const captureDetection = await faceapi.detectSingleFace(capturedImg, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();
                
                updateProgress(70);
                
                if (!captureDetection || !captureDetection.descriptor) {
                    addLogMessage('❌ Nenhum rosto detectado!', 'warning');
                    showResult(null, 0, capturedImage, false);
                    updateProgress(0);
                    isProcessing = false;
                    document.getElementById('captureBtn').disabled = false;
                    return;
                }
                
                addLogMessage('✅ Rosto detectado! Comparando com cadastros...', 'success');
                
                // Comparar com usuários cadastrados
                let bestMatch = null;
                let bestDistance = 0.6;
                
                for (const user of users) {
                    if (user.descriptor) {
                        const userDescriptor = new Float32Array(user.descriptor);
                        const distance = faceapi.euclideanDistance(captureDetection.descriptor, userDescriptor);
                        addLogMessage(`Comparação com ${user.name}: distância ${distance.toFixed(4)}`, 'info');
                        
                        if (distance < bestDistance) {
                            bestDistance = distance;
                            bestMatch = user;
                        }
                    }
                }
                
                updateProgress(100);
                const confidence = bestMatch ? Math.max(0, 1 - bestDistance) : 0;
                
                if (bestMatch && confidence > 0.5) {
                    addLogMessage(`🎉 RECONHECIDO: ${bestMatch.name} (${(confidence * 100).toFixed(1)}%)`, 'success');
                    showResult(bestMatch, confidence, capturedImage, true);
                } else {
                    addLogMessage(`❌ Não reconhecido. Melhor confiança: ${(confidence * 100).toFixed(1)}%`, 'error');
                    showResult(null, confidence, capturedImage, true);
                }
                
            } catch (error) {
                addLogMessage(`Erro: ${error.message}`, 'error');
                console.error(error);
            } finally {
                setTimeout(() => {
                    updateProgress(0);
                    isProcessing = false;
                    document.getElementById('captureBtn').disabled = false;
                }, 1000);
            }
        }

        function showResult(matchedUser, confidence, capturedImage, detected) {
            const resultArea = document.getElementById('resultArea');
            const resultCard = document.getElementById('resultCard');
            const capturedImagePreview = document.getElementById('capturedImagePreview');
            const resultContent = document.getElementById('resultContent');
            
            resultArea.style.display = 'block';
            capturedImagePreview.src = capturedImage;
            
            if (matchedUser && detected) {
                resultCard.className = 'result-card result-success';
                resultContent.innerHTML = `
                    <div class="result-name">✅ ${matchedUser.name}</div>
                    <div class="result-confidence">🎯 Confiança: ${(confidence * 100).toFixed(1)}%</div>
                    <div class="result-date">📅 Cadastrado em: ${matchedUser.date}</div>
                    <div style="margin-top: 15px;">
                        <img src="${matchedUser.image}" style="max-width: 80px; border-radius: 10px; margin: 5px; border: 2px solid #27ae60;">
                        <span> ↔️ </span>
                        <img src="${capturedImage}" style="max-width: 80px; border-radius: 10px; margin: 5px; border: 2px solid #27ae60;">
                    </div>
                `;
            } else if (!detected) {
                resultCard.className = 'result-card result-warning';
                resultContent.innerHTML = `
                    <div class="result-name">⚠️ Nenhum Rosto Detectado</div>
                    <div>Certifique-se de estar com o rosto visível e bem iluminado</div>
                `;
            } else {
                resultCard.className = 'result-card result-error';
                resultContent.innerHTML = `
                    <div class="result-name">❌ Pessoa Não Reconhecida</div>
                    <div class="result-confidence">Melhor correspondência: ${(confidence * 100).toFixed(1)}%</div>
                    <div style="margin-top: 10px;">Tente cadastrar esta pessoa primeiro</div>
                `;
            }
            
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function init() {
            document.getElementById('startCameraBtn').disabled = true;
            document.getElementById('captureBtn').disabled = true;
            loadUsers();
            await loadModels();
        }
        
        init();
    </script>
</body>
</html>
