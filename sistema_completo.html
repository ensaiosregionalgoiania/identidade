<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identidade Ministerial - Manutenção de Usuários</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .top-bar {
            background: white;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .logo h1 { color: #2c3e50; font-size: 1.3rem; }
        .logo h1 i { color: #3498db; margin-right: 10px; }
        .top-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-evento { background: #f39c12; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-presenca { background: #9b59b6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            flex: 1; padding: 12px; background: rgba(255,255,255,0.2); color: white;
            border: none; border-radius: 10px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease;
        }
        .tab-btn.active { background: white; color: #2c3e50; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .card-header { border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; padding-bottom: 10px; }
        .card-header h2 { color: #2c3e50; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        
        button { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219a52; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-edit { background: #3498db; }
        .btn-edit:hover { background: #2980b9; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        thead { background: #2c3e50; color: white; }
        tr:hover { background: #f8f9fa; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 15px; padding: 25px; width: 90%; max-width: 400px; text-align: center; }
        .modal-buttons { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        
        .search-box { width: 100%; padding: 10px; margin-bottom: 20px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #27ae60; color: white; padding: 12px 24px; border-radius: 8px; z-index: 1000; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .loading { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="logo">
                <h1><i class="fas fa-church"></i> Identidade Ministerial</h1>
            </div>
            <div class="top-buttons">
                <a href="presenca.html" class="btn-presenca">✅ Controle de Presença</a>
                <button class="btn-evento" onclick="window.location.href='cadastro_evento.html'">🎉 Cadastrar Evento</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="trocarAba('lista')">📋 Lista de Membros</button>
            <button class="tab-btn" onclick="trocarAba('adicionar')">➕ Adicionar Membro</button>
        </div>

        <!-- Aba Lista -->
        <div id="abaLista" class="tab-content active">
            <div class="card">
                <div class="card-header"><h2>📋 Membros Cadastrados</h2></div>
                <input type="text" id="busca" class="search-box" placeholder="🔍 Buscar por nome..." onkeyup="filtrarMembros()">
                <div class="table-container">
                    <table id="tabelaMembros">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Instrumento</th>
                                <th>Congregação</th>
                                <th>Cargo</th>
                                <th>Nível</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela">
                            <tr><td colspan="6" class="loading">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Aba Adicionar\/Editar -->
        <div id="abaAdicionar" class="tab-content">
            <div class="card">
                <div class="card-header"><h2 id="formTitle">➕ Adicionar Novo Membro</h2></div>
                <form id="formMembro">
                    <input type="hidden" id="membroId">
                    
                    <div class="form-group">
                        <label>Nome Completo *</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="form-group">
                        <label>Instrumento *</label>
                        <select id="instrumentoId" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Congregação *</label>
                        <select id="congregacaoId" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cargo *</label>
                        <select id="cargoId" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Nível *</label>
                        <select id="nivelId" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>

                    <button type="submit">💾 Salvar Membro</button>
                    <button type="button" class="btn-danger" onclick="cancelarEdicao()" style="margin-top: 10px;">❌ Cancelar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal para adicionar novo item -->
    <div id="modalNovoItem" class="modal">
        <div class="modal-content">
            <h3 id="modalNovoTitulo">Adicionar Novo</h3>
            <input type="text" id="novoItemNome" placeholder="Digite o nome" style="width: 100%; padding: 10px; margin: 15px 0; border: 2px solid #e0e0e0; border-radius: 8px;">
            <div class="modal-buttons">
                <button onclick="fecharModalNovoItem()" style="background:#95a5a6;">Cancelar</button>
                <button onclick="salvarNovoItem()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal de exclusão -->
    <div id="modalExcluir" class="modal">
        <div class="modal-content">
            <h3>Confirmar exclusão</h3>
            <p id="modalMsg"></p>
            <div class="modal-buttons">
                <button onclick="confirmarExclusao()">Excluir</button>
                <button onclick="fecharModalExcluir()" style="background:#95a5a6;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
            authDomain: "identidadeccb.firebaseapp.com",
            projectId: "identidadeccb",
            storageBucket: "identidadeccb.firebasestorage.app",
            messagingSenderId: "385467794937",
            appId: "1:385467794937:web:d2eb32429586f018e2a928"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const membrosCollection = db.collection("membros");
        const instrumentosCollection = db.collection("instrumentos");
        const congregacoesCollection = db.collection("congregacoes");
        const cargosCollection = db.collection("cargos");
        const niveisCollection = db.collection("niveis");

        let instrumentos = [];
        let congregacoes = [];
        let cargos = [];
        let niveis = [];
        let membros = [];
        let membroParaExcluir = null;
        let tipoItemAdicionando = null;

        function mostrarToast(msg) {
            const toast = document.createElement('div'); 
            toast.className = 'toast'; 
            toast.textContent = msg;
            document.body.appendChild(toast); 
            setTimeout(() => toast.remove(), 3000);
        }

        async function carregarColecoes() {
            const instSnapshot = await instrumentosCollection.orderBy('nome').get();
            instrumentos = [];
            instSnapshot.forEach(doc => instrumentos.push({ id: doc.id, ...doc.data() }));

            const congSnapshot = await congregacoesCollection.orderBy('nome').get();
            congregacoes = [];
            congSnapshot.forEach(doc => congregacoes.push({ id: doc.id, ...doc.data() }));

            const cargoSnapshot = await cargosCollection.orderBy('nome').get();
            cargos = [];
            cargoSnapshot.forEach(doc => cargos.push({ id: doc.id, ...doc.data() }));

            const nivelSnapshot = await niveisCollection.orderBy('nome').get();
            niveis = [];
            nivelSnapshot.forEach(doc => niveis.push({ id: doc.id, ...doc.data() }));
        }

        function renderizarSelects() {
            const instSelect = document.getElementById('instrumentoId');
            instSelect.innerHTML = '<option value="">Selecione...</option>';
            instrumentos.forEach(i => { instSelect.innerHTML += `<option value="${i.id}">${i.nome}</option>`; });
            instSelect.innerHTML += '<option value="__NOVO__" style="color: #27ae60; font-weight: bold;">➕ Novo Instrumento</option>';

            const congSelect = document.getElementById('congregacaoId');
            congSelect.innerHTML = '<option value="">Selecione...</option>';
            congregacoes.forEach(c => { congSelect.innerHTML += `<option value="${c.id}">${c.nome}</option>`; });
            congSelect.innerHTML += '<option value="__NOVO__" style="color: #27ae60; font-weight: bold;">➕ Nova Congregação</option>';

            const cargoSelect = document.getElementById('cargoId');
            cargoSelect.innerHTML = '<option value="">Selecione...</option>';
            cargos.forEach(c => { cargoSelect.innerHTML += `<option value="${c.id}">${c.nome}</option>`; });
            cargoSelect.innerHTML += '<option value="__NOVO__" style="color: #27ae60; font-weight: bold;">➕ Novo Cargo</option>';

            const nivelSelect = document.getElementById('nivelId');
            nivelSelect.innerHTML = '<option value="">Selecione...</option>';
            niveis.forEach(n => { nivelSelect.innerHTML += `<option value="${n.id}">${n.nome}</option>`; });
            nivelSelect.innerHTML += '<option value="__NOVO__" style="color: #27ae60; font-weight: bold;">➕ Novo Nível</option>';
        }

        function configurarSelectsNovo() {
            document.getElementById('instrumentoId').addEventListener('change', function(e) {
                if (this.value === '__NOVO__') {
                    tipoItemAdicionando = 'instrumento';
                    document.getElementById('modalNovoTitulo').textContent = 'Adicionar Novo Instrumento';
                    document.getElementById('novoItemNome').value = '';
                    document.getElementById('modalNovoItem').style.display = 'flex';
                    this.value = '';
                }
            });

            document.getElementById('congregacaoId').addEventListener('change', function(e) {
                if (this.value === '__NOVO__') {
                    tipoItemAdicionando = 'congregacao';
                    document.getElementById('modalNovoTitulo').textContent = 'Adicionar Nova Congregação';
                    document.getElementById('novoItemNome').value = '';
                    document.getElementById('modalNovoItem').style.display = 'flex';
                    this.value = '';
                }
            });

            document.getElementById('cargoId').addEventListener('change', function(e) {
                if (this.value === '__NOVO__') {
                    tipoItemAdicionando = 'cargo';
                    document.getElementById('modalNovoTitulo').textContent = 'Adicionar Novo Cargo';
                    document.getElementById('novoItemNome').value = '';
                    document.getElementById('modalNovoItem').style.display = 'flex';
                    this.value = '';
                }
            });

            document.getElementById('nivelId').addEventListener('change', function(e) {
                if (this.value === '__NOVO__') {
                    tipoItemAdicionando = 'nivel';
                    document.getElementById('modalNovoTitulo').textContent = 'Adicionar Novo Nível';
                    document.getElementById('novoItemNome').value = '';
                    document.getElementById('modalNovoItem').style.display = 'flex';
                    this.value = '';
                }
            });
        }

        function fecharModalNovoItem() {
            document.getElementById('modalNovoItem').style.display = 'none';
            tipoItemAdicionando = null;
        }

        async function salvarNovoItem() {
            const novoNome = document.getElementById('novoItemNome').value.trim();
            if (!novoNome) {
                mostrarToast('Digite um nome válido');
                return;
            }

            try {
                if (tipoItemAdicionando === 'instrumento') {
                    await instrumentosCollection.add({ nome: novoNome });
                    mostrarToast('✅ Instrumento adicionado!');
                } else if (tipoItemAdicionando === 'congregacao') {
                    await congregacoesCollection.add({ nome: novoNome });
                    mostrarToast('✅ Congregação adicionada!');
                } else if (tipoItemAdicionando === 'cargo') {
                    await cargosCollection.add({ nome: novoNome });
                    mostrarToast('✅ Cargo adicionado!');
                } else if (tipoItemAdicionando === 'nivel') {
                    await niveisCollection.add({ nome: novoNome });
                    mostrarToast('✅ Nível adicionado!');
                }

                await carregarColecoes();
                renderizarSelects();
                fecharModalNovoItem();
            } catch(error) {
                mostrarToast('❌ Erro: ' + error.message);
            }
        }

        async function carregarMembros() {
            const snapshot = await membrosCollection.get();
            membros = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                membros.push({ 
                    id: doc.id, 
                    nome: data.nome,
                    instrumentoId: data.instrumentoId,
                    congregacaoId: data.congregacaoId,
                    cargoId: data.cargoId,
                    nivelId: data.nivelId
                });
            });
            return membros;
        }

        function getNomePorId(lista, id) {
            const item = lista.find(i => i.id == id);
            return item ? item.nome : "Desconhecido";
        }

        async function renderizarTabela() {
            await carregarMembros();
            
            const busca = document.getElementById('busca')?.value.toLowerCase() || '';
            const filtrados = membros.filter(m => m.nome?.toLowerCase().includes(busca));
            
            const tbody = document.getElementById('corpoTabela');
            
            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">Nenhum membro encontrado</td></tr>';
                return;
            }
            
            let html = '';
            for (const m of filtrados) {
                const instrumento = getNomePorId(instrumentos, m.instrumentoId);
                const congregacao = getNomePorId(congregacoes, m.congregacaoId);
                const cargo = getNomePorId(cargos, m.cargoId);
                const nivel = getNomePorId(niveis, m.nivelId);
                
                html += `<tr>
                    <td><strong>${m.nome || ''}</strong></td>
                    <td>${instrumento}</td>
                    <td>${congregacao}</td>
                    <td>${cargo}</td>
                    <td>${nivel}</td>
                    <td>
                        <button class="btn-edit" onclick="editarMembro('${m.id}')">✏️ Editar</button>
                        <button class="btn-danger" onclick="abrirModalExcluir('${m.id}', '${m.nome}')">🗑️ Excluir</button>
                     </td>
                 </tr>`;
            }
            tbody.innerHTML = html;
        }

        document.getElementById('formMembro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('membroId').value;
            const dados = {
                nome: document.getElementById('nome').value,
                instrumentoId: document.getElementById('instrumentoId').value,
                congregacaoId: document.getElementById('congregacaoId').value,
                cargoId: document.getElementById('cargoId').value,
                nivelId: document.getElementById('nivelId').value
            };
            
            if (!dados.instrumentoId || !dados.congregacaoId || !dados.cargoId || !dados.nivelId) {
                mostrarToast('Preencha todos os campos!');
                return;
            }
            
            try {
                if (id) {
                    await membrosCollection.doc(id).update(dados);
                    mostrarToast('✅ Membro atualizado!');
                } else {
                    await membrosCollection.add(dados);
                    mostrarToast('✅ Membro adicionado!');
                }
                cancelarEdicao();
                trocarAba('lista');
                await renderizarTabela();
            } catch(error) { 
                mostrarToast('❌ Erro: ' + error.message); 
            }
        });

        async function editarMembro(id) {
            const membro = membros.find(m => m.id === id);
            if (membro) {
                document.getElementById('formTitle').textContent = '✏️ Editar Membro';
                document.getElementById('membroId').value = id;
                document.getElementById('nome').value = membro.nome || '';
                
                setTimeout(() => {
                    document.getElementById('instrumentoId').value = membro.instrumentoId || '';
                    document.getElementById('congregacaoId').value = membro.congregacaoId || '';
                    document.getElementById('cargoId').value = membro.cargoId || '';
                    document.getElementById('nivelId').value = membro.nivelId || '';
                }, 100);
                
                trocarAba('adicionar');
            } else {
                mostrarToast('❌ Membro não encontrado!');
            }
        }

        function cancelarEdicao() {
            document.getElementById('formTitle').textContent = '➕ Adicionar Novo Membro';
            document.getElementById('formMembro').reset();
            document.getElementById('membroId').value = '';
        }

        function abrirModalExcluir(id, nome) { 
            membroParaExcluir = id; 
            document.getElementById('modalMsg').innerHTML = `Excluir <strong>${nome}</strong>?`; 
            document.getElementById('modalExcluir').style.display = 'flex'; 
        }
        
        function fecharModalExcluir() { 
            document.getElementById('modalExcluir').style.display = 'none'; 
            membroParaExcluir = null; 
        }
        
        async function confirmarExclusao() {
            if (membroParaExcluir) { 
                await membrosCollection.doc(membroParaExcluir).delete(); 
                mostrarToast('✅ Membro excluído!'); 
                await renderizarTabela(); 
                fecharModalExcluir(); 
            }
        }

        function filtrarMembros() { renderizarTabela(); }

        async function trocarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if (aba === 'lista') {
                document.getElementById('abaLista').classList.add('active');
                document.querySelector('.tab-btn:first-child').classList.add('active');
                await renderizarTabela();
            } else if (aba === 'adicionar') {
                document.getElementById('abaAdicionar').classList.add('active');
                document.querySelector('.tab-btn:last-child').classList.add('active');
            }
        }

        async function init() {
            await carregarColecoes();
            renderizarSelects();
            configurarSelectsNovo();
            await renderizarTabela();
        }
        
        init();
    </script>
</body>
</html>
