<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identidade Ministerial - Manutenção</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .top-bar {
            background: white;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .logo h1 { color: #2c3e50; font-size: 1.3rem; }
        .top-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-evento { background: #f39c12; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-presenca { background: #9b59b6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-novo { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .card-header { border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { color: #2c3e50; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        
        button { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #219a52; }
        .btn-danger { background: #e74c3c; }
        .btn-edit { background: #3498db; }
        .btn-foto { background: #9b59b6; }
        .btn-foto:hover { background: #8e44ad; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        thead { background: #2c3e50; color: white; }
        tr:hover { background: #f8f9fa; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 15px; padding: 25px; width: 90%; max-width: 500px; text-align: center; }
        .modal-content h3 { margin-bottom: 15px; color: #2c3e50; }
        .modal-buttons { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        
        .search-box { width: 100%; padding: 10px; margin-bottom: 20px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #27ae60; color: white; padding: 12px 24px; border-radius: 8px; z-index: 1000; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .loading { text-align: center; padding: 20px; color: #999; }
        
        .foto-preview { text-align: center; margin-bottom: 15px; }
        .foto-preview img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #3498db; }
        
        .camera-area { margin: 15px 0; }
        #cameraVideo { width: 100%; border-radius: 10px; background: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="logo">
                <h1>🎵 Identidade Ministerial</h1>
            </div>
            <div class="top-buttons">
                <a href="presenca.html" class="btn-presenca">✅ Presença</a>
                <button class="btn-evento" onclick="window.location.href='cadastro_evento.html'">🎉 Evento</button>
                <button class="btn-novo" onclick="abrirFormularioNovo()">➕ Novo Membro</button>
            </div>
        </div>

        <div class="card" id="cardLista">
            <div class="card-header"><h2>📋 Membros Cadastrados</h2></div>
            <input type="text" id="busca" class="search-box" placeholder="🔍 Buscar por nome..." onkeyup="filtrarMembros()">
            <div class="table-container">
                <table id="tabelaMembros">
                    <thead>
                        <tr><th>ID</th><th>Nome</th><th>Instrumento</th><th>Congregação</th><th>Cargo</th><th>Nível</th><th>Foto</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="corpoTabela"><tr><td colspan="8" class="loading">Carregando...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="card" id="cardFormulario" style="display: none;">
            <div class="card-header"><h2 id="formTitle">➕ Adicionar Membro</h2></div>
            <form id="formMembro">
                <input type="hidden" id="membroDocId">
                <div class="form-group"><label>ID do Membro *</label><input type="number" id="membroId" required></div>
                <div class="form-group"><label>Nome Completo *</label><input type="text" id="nome" required></div>
                <div class="form-group"><label>Instrumento *</label><select id="instrumentoId" required></select></div>
                <div class="form-group"><label>Congregação *</label><select id="congregacaoId" required></select></div>
                <div class="form-group"><label>Cargo *</label><select id="cargoId" required></select></div>
                <div class="form-group"><label>Nível *</label><select id="nivelId" required></select></div>
                
                <div class="foto-preview" id="fotoPreview">
                    <img id="previewImg" src="https://via.placeholder.com/100?text=Sem+Foto" style="width:100px; height:100px; border-radius:50%;">
                </div>
                <button type="button" id="btnFoto" class="btn-foto" style="margin-top: 10px;">📷 Tirar Foto</button>
                
                <button type="submit">💾 Salvar</button>
                <button type="button" class="btn-danger" onclick="cancelarEdicao()">❌ Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Modal para foto -->
    <div id="modalFoto" class="modal">
        <div class="modal-content">
            <h3>📷 Capturar Foto</h3>
            <div class="camera-area">
                <video id="cameraVideo" autoplay playsinline style="width:100%; border-radius:10px;"></video>
                <canvas id="cameraCanvas" style="display:none;"></canvas>
            </div>
            <div class="modal-buttons">
                <button id="btnTirarFoto" class="btn-camera">📸 Tirar Foto</button>
                <button onclick="fecharModalFoto()" style="background:#95a5a6;">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalExcluir" class="modal">
        <div class="modal-content">
            <h3>Confirmar exclusão</h3>
            <p id="modalMsg"></p>
            <div class="modal-buttons">
                <button onclick="confirmarExclusao()">Excluir</button>
                <button onclick="fecharModalExcluir()" style="background:#95a5a6;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
            authDomain: "identidadeccb.firebaseapp.com",
            projectId: "identidadeccb",
            storageBucket: "identidadeccb.firebasestorage.app",
            messagingSenderId: "385467794937",
            appId: "1:385467794937:web:d2eb32429586f018e2a928"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const membrosCollection = db.collection("membros");
        const instrumentosCollection = db.collection("instrumentos");
        const congregacoesCollection = db.collection("congregacoes");
        const cargosCollection = db.collection("cargos");
        const niveisCollection = db.collection("niveis");

        let instrumentos = [];
        let congregacoes = [];
        let cargos = [];
        let niveis = [];
        let membros = [];
        let membroParaExcluir = null;
        let fotoBase64 = null;
        let streamCamera = null;

        function mostrarToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function getNomeInstrumento(id) {
            const item = instrumentos.find(i => i.id == id);
            return item ? item.nome : 'ID ' + id;
        }

        function getNomeCongregacao(id) {
            const item = congregacoes.find(c => c.id == id);
            return item ? item.nome : 'ID ' + id;
        }

        function getNomeCargo(id) {
            const item = cargos.find(c => c.id == id);
            return item ? item.nome : 'ID ' + id;
        }

        function getNomeNivel(id) {
            const item = niveis.find(n => n.id == id);
            return item ? item.nome : 'ID ' + id;
        }

        async function carregarDados() {
            const instSnap = await instrumentosCollection.get();
            instrumentos = [];
            instSnap.forEach(doc => {
                const data = doc.data();
                instrumentos.push({ id: data.id, nome: data.nome });
            });
            instrumentos.sort((a, b) => a.id - b.id);

            const congSnap = await congregacoesCollection.get();
            congregacoes = [];
            congSnap.forEach(doc => {
                congregacoes.push({ id: doc.id, nome: doc.data().nome });
            });

            const cargoSnap = await cargosCollection.get();
            cargos = [];
            cargoSnap.forEach(doc => {
                const data = doc.data();
                cargos.push({ id: data.id, nome: data.nome });
            });
            cargos.sort((a, b) => a.id - b.id);

            const nivelSnap = await niveisCollection.get();
            niveis = [];
            nivelSnap.forEach(doc => {
                const data = doc.data();
                niveis.push({ id: data.id, nome: data.nome });
            });
            niveis.sort((a, b) => a.id - b.id);

            await carregarMembros();
        }

        async function carregarMembros() {
            const snap = await membrosCollection.get();
            membros = [];
            snap.forEach(doc => {
                const data = doc.data();
                if (data.id !== undefined) {
                    membros.push({
                        docId: doc.id,
                        id: data.id,
                        nome: data.nome || '',
                        instrumentoId: data.instrumentoId || 0,
                        congregacaoId: data.congregacaoId || '',
                        cargoId: data.cargoId || 0,
                        nivelId: data.nivelId || 0,
                        fotoUrl: data.fotoUrl || null
                    });
                }
            });
            membros.sort((a, b) => a.id - b.id);
            renderizarTabela();
        }

        function renderizarSelects() {
            const instSelect = document.getElementById('instrumentoId');
            if (instSelect) {
                instSelect.innerHTML = '<option value="">Selecione...</option>';
                instrumentos.forEach(i => {
                    instSelect.innerHTML += '<option value="' + i.id + '">' + i.nome + '</option>';
                });
            }

            const congSelect = document.getElementById('congregacaoId');
            if (congSelect) {
                congSelect.innerHTML = '<option value="">Selecione...</option>';
                congregacoes.forEach(c => {
                    congSelect.innerHTML += '<option value="' + c.id + '">' + c.nome + '</option>';
                });
            }

            const cargoSelect = document.getElementById('cargoId');
            if (cargoSelect) {
                cargoSelect.innerHTML = '<option value="">Selecione...</option>';
                cargos.forEach(c => {
                    cargoSelect.innerHTML += '<option value="' + c.id + '">' + c.nome + '</option>';
                });
            }

            const nivelSelect = document.getElementById('nivelId');
            if (nivelSelect) {
                nivelSelect.innerHTML = '<option value="">Selecione...</option>';
                niveis.forEach(n => {
                    nivelSelect.innerHTML += '<option value="' + n.id + '">' + n.nome + '</option>';
                });
            }
        }

        function renderizarTabela() {
            const buscaElement = document.getElementById('busca');
            const busca = buscaElement ? buscaElement.value.toLowerCase() : '';
            
            let filtrados = membros;
            if (busca) {
                filtrados = membros.filter(m => m.nome && m.nome.toLowerCase().includes(busca));
            }
            
            const tbody = document.getElementById('corpoTabela');
            if (!tbody) return;
            
            if (filtrados.length === 0) {
                tbody.innerHTML = '<td><td colspan="8" class="loading">Nenhum membro encontrado</td></tr>';
                return;
            }
            
            let html = '';
            for (const m of filtrados) {
                const temFoto = m.fotoUrl && m.fotoUrl !== '';
                html += '<tr>';
                html += '<td>' + m.id + '</td>';
                html += '<td><strong>' + (m.nome || '') + '</strong></td>';
                html += '<td>' + getNomeInstrumento(m.instrumentoId) + '</td>';
                html += '<td>' + getNomeCongregacao(m.congregacaoId) + '</td>';
                html += '<td>' + getNomeCargo(m.cargoId) + '</td>';
                html += '<td>' + getNomeNivel(m.nivelId) + '</td>';
                html += '<td>' + (temFoto ? '📷 Sim' : '❌ Não') + '</td>';
                html += '<td>';
                html += '<button class="btn-edit" onclick="editarMembro(' + m.id + ')">✏️ Editar</button> ';
                html += '<button class="btn-danger" onclick="abrirModalExcluir(' + m.id + ', \'' + m.nome + '\')">🗑️ Excluir</button>';
                html += '</td></tr>';
            }
            tbody.innerHTML = html;
        }

        function filtrarMembros() { renderizarTabela(); }

        function abrirFormularioNovo() {
            document.getElementById('formTitle').innerHTML = '➕ Adicionar Membro';
            document.getElementById('membroDocId').value = '';
            document.getElementById('membroId').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('instrumentoId').value = '';
            document.getElementById('congregacaoId').value = '';
            document.getElementById('cargoId').value = '';
            document.getElementById('nivelId').value = '';
            fotoBase64 = null;
            atualizarPreview();
            document.getElementById('cardLista').style.display = 'none';
            document.getElementById('cardFormulario').style.display = 'block';
            renderizarSelects();
        }

        function cancelarEdicao() {
            document.getElementById('cardLista').style.display = 'block';
            document.getElementById('cardFormulario').style.display = 'none';
            carregarMembros();
        }

        function atualizarPreview() {
            const preview = document.getElementById('previewImg');
            if (preview) {
                if (fotoBase64) {
                    preview.src = fotoBase64;
                } else {
                    preview.src = 'https://via.placeholder.com/100?text=Sem+Foto';
                }
            }
        }

        function abrirModalFoto() {
            document.getElementById('modalFoto').style.display = 'flex';
            iniciarCamera();
        }

        function fecharModalFoto() {
            pararCamera();
            document.getElementById('modalFoto').style.display = 'none';
        }

        async function iniciarCamera() {
            const video = document.getElementById('cameraVideo');
            if (!video) return;
            
            try {
                if (streamCamera) {
                    streamCamera.getTracks().forEach(track => track.stop());
                }
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                streamCamera = stream;
                video.srcObject = stream;
            } catch (error) {
                mostrarToast('❌ Erro ao acessar câmera: ' + error.message);
            }
        }

        function pararCamera() {
            if (streamCamera) {
                streamCamera.getTracks().forEach(track => track.stop());
                streamCamera = null;
            }
            const video = document.getElementById('cameraVideo');
            if (video) {
                video.srcObject = null;
            }
        }

        function tirarFoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cameraCanvas');
            if (!video || !canvas) return;
            
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            atualizarPreview();
            fecharModalFoto();
            mostrarToast('✅ Foto capturada!');
        }

        function editarMembro(idNumerico) {
            const membro = membros.find(m => m.id === idNumerico);
            if (membro) {
                document.getElementById('formTitle').innerHTML = '✏️ Editar Membro - ID: ' + membro.id;
                document.getElementById('membroDocId').value = membro.docId;
                document.getElementById('membroId').value = membro.id;
                document.getElementById('nome').value = membro.nome || '';
                document.getElementById('instrumentoId').value = membro.instrumentoId;
                document.getElementById('congregacaoId').value = membro.congregacaoId;
                document.getElementById('cargoId').value = membro.cargoId;
                document.getElementById('nivelId').value = membro.nivelId;
                fotoBase64 = membro.fotoUrl || null;
                atualizarPreview();
                document.getElementById('cardLista').style.display = 'none';
                document.getElementById('cardFormulario').style.display = 'block';
                renderizarSelects();
            } else {
                mostrarToast('❌ Membro com ID ' + idNumerico + ' não encontrado!');
            }
        }

        document.getElementById('btnFoto').addEventListener('click', () => {
            abrirModalFoto();
        });

        document.getElementById('btnTirarFoto').addEventListener('click', tirarFoto);

        document.getElementById('formMembro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const docId = document.getElementById('membroDocId').value;
            const idNumerico = parseInt(document.getElementById('membroId').value);
            const dados = {
                id: idNumerico,
                nome: document.getElementById('nome').value,
                instrumentoId: parseInt(document.getElementById('instrumentoId').value),
                congregacaoId: document.getElementById('congregacaoId').value,
                cargoId: parseInt(document.getElementById('cargoId').value),
                nivelId: parseInt(document.getElementById('nivelId').value)
            };
            
            if (fotoBase64) {
                dados.fotoUrl = fotoBase64;
            }
            
            try {
                if (docId) {
                    await membrosCollection.doc(docId).update(dados);
                    mostrarToast('✅ Membro atualizado!');
                } else {
                    const existe = membros.some(m => m.id === idNumerico);
                    if (existe) {
                        mostrarToast('❌ ID ' + idNumerico + ' já existe! Use outro ID.');
                        return;
                    }
                    await membrosCollection.add(dados);
                    mostrarToast('✅ Membro adicionado!');
                    
                    if (!fotoBase64) {
                        alert('📷 Lembre-se de adicionar uma foto para este membro! Clique em "Tirar Foto" ao editar.');
                    }
                }
                cancelarEdicao();
            } catch(error) {
                mostrarToast('❌ Erro: ' + error.message);
            }
        });

        function abrirModalExcluir(idNumerico, nome) {
            membroParaExcluir = idNumerico;
            document.getElementById('modalMsg').innerHTML = 'Excluir <strong>' + nome + '</strong>?';
            document.getElementById('modalExcluir').style.display = 'flex';
        }
        
        function fecharModalExcluir() {
            document.getElementById('modalExcluir').style.display = 'none';
            membroParaExcluir = null;
        }
        
        async function confirmarExclusao() {
            if (membroParaExcluir !== null) {
                const membro = membros.find(m => m.id === membroParaExcluir);
                if (membro) {
                    await membrosCollection.doc(membro.docId).delete();
                    mostrarToast('✅ Membro excluído!');
                    fecharModalExcluir();
                    carregarMembros();
                }
            }
        }

        carregarDados();
    </script>
</body>
</html>
