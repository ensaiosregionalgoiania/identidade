<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identidade Ministerial - Sistema Completo</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Abas */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            flex: 1; padding: 12px; background: rgba(255,255,255,0.2); color: white;
            border: none; border-radius: 10px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease;
        }
        .tab-btn.active { background: white; color: #2c3e50; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Cards */
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .card-header { border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; padding-bottom: 10px; }
        .card-header h2 { color: #2c3e50; }
        
        /* Formulário */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        
        /* Botões */
        button { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219a52; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-edit { background: #3498db; }
        .btn-edit:hover { background: #2980b9; }
        
        /* Tabela */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        thead { background: #2c3e50; color: white; }
        tr:hover { background: #f8f9fa; }
        
        /* Status */
        .status-presente { background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; display: inline-block; }
        .status-ausente { background: #e74c3c; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; display: inline-block; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 15px; padding: 25px; width: 90%; max-width: 500px; text-align: center; }
        .modal-buttons { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        
        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { flex: 1; background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center; min-width: 100px; }
        .stat-number { font-size: 2rem; font-weight: bold; }
        .stat-label { font-size: 0.8rem; color: #7f8c8d; }
        
        .search-box { width: 100%; padding: 10px; margin-bottom: 20px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #27ae60; color: white; padding: 12px 24px; border-radius: 8px; z-index: 1000; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .loading { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="trocarAba('lista')">📋 Lista de Membros</button>
            <button class="tab-btn" onclick="trocarAba('estatisticas')">📊 Estatísticas</button>
            <button class="tab-btn" onclick="trocarAba('adicionar')">➕ Adicionar Membro</button>
        </div>

        <!-- Aba Lista -->
        <div id="abaLista" class="tab-content active">
            <div class="card">
                <div class="card-header"><h2>📋 Membros Cadastrados</h2></div>
                <input type="text" id="busca" class="search-box" placeholder="🔍 Buscar por nome..." onkeyup="filtrarMembros()">
                <div class="table-container">
                    <table id="tabelaMembros">
                        <thead><tr><th>Nome</th><th>Instrumento</th><th>Cargo</th><th>Nível</th><th>Presença Hoje</th><th>Ações</th></tr></thead>
                        <tbody id="corpoTabela"><tr><td colspan="6" class="loading">Carregando...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Aba Estatísticas -->
        <div id="abaEstatisticas" class="tab-content">
            <div class="card">
                <div class="card-header"><h2>📊 Controle de Presença</h2></div>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="totalMembros">0</div><div class="stat-label">Total</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalPresentes">0</div><div class="stat-label">Presentes</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalAusentes">0</div><div class="stat-label">Ausentes</div></div>
                </div>
                <input type="text" id="buscaEst" class="search-box" placeholder="🔍 Buscar por nome..." onkeyup="filtrarEstatisticas()">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Nome</th><th>Instrumento</th><th>Cargo</th><th>Status</th><th>Ação</th></tr></thead>
                        <tbody id="tabelaEstatisticas"><tr><td colspan="5" class="loading">Carregando...</td></tr></tbody>
                    </table>
                </div>
                <button class="btn-danger" onclick="limparPresencas()" style="margin-top: 20px;">🗑️ Limpar Presenças de Hoje</button>
            </div>
        </div>

        <!-- Aba Adicionar/Editar -->
        <div id="abaAdicionar" class="tab-content">
            <div class="card">
                <div class="card-header"><h2 id="formTitle">➕ Adicionar Novo Membro</h2></div>
                <form id="formMembro">
                    <input type="hidden" id="membroId">
                    
                    <div class="form-group">
                        <label>Nome Completo *</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="form-group">
                        <label>Instrumento *</label>
                        <select id="instrumentoId" required></select>
                    </div>

                    <div class="form-group">
                        <label>Congregação *</label>
                        <select id="congregacaoId" required></select>
                    </div>

                    <div class="form-group">
                        <label>Cargo *</label>
                        <select id="cargoId" required></select>
                    </div>

                    <div class="form-group">
                        <label>Nível *</label>
                        <select id="nivelId" required></select>
                    </div>

                    <button type="submit">💾 Salvar Membro</button>
                    <button type="button" class="btn-danger" onclick="cancelarEdicao()" style="margin-top: 10px;">❌ Cancelar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Confirmar exclusão</h3>
            <p id="modalMsg"></p>
            <div class="modal-buttons">
                <button onclick="confirmarExclusao()">Excluir</button>
                <button onclick="fecharModal()" style="background:#95a5a6;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // 🔧 CONFIGURAÇÃO DO FIREBASE 🔧
        const firebaseConfig = {
            apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
            authDomain: "identidadeccb.firebaseapp.com",
            projectId: "identidadeccb",
            storageBucket: "identidadeccb.firebasestorage.app",
            messagingSenderId: "385467794937",
            appId: "1:385467794937:web:d2eb32429586f018e2a928"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Coleções
        const membrosCollection = db.collection("membros");
        const instrumentosCollection = db.collection("instrumentos");
        const congregacoesCollection = db.collection("congregacoes");
        const cargosCollection = db.collection("cargos");
        const niveisCollection = db.collection("niveis");
        const presencasCollection = db.collection("presencas");

        // Dados carregados
        let instrumentos = [];
        let congregacoes = [];
        let cargos = [];
        let niveis = [];
        let membros = [];
        let presencasHoje = {};

        let membroParaExcluir = null;

        // Funções auxiliares
        function getDataHoje() { return new Date().toISOString().split('T')[0]; }
        
        function mostrarToast(msg) {
            const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg;
            document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000);
        }

        // Carregar todas as coleções auxiliares
        async function carregarColecoes() {
            // Instrumentos
            const instSnapshot = await instrumentosCollection.orderBy('nome').get();
            instrumentos = [];
            instSnapshot.forEach(doc => instrumentos.push({ id: parseInt(doc.id), ...doc.data() }));

            // Congregações
            const congSnapshot = await congregacoesCollection.orderBy('nome').get();
            congregacoes = [];
            congSnapshot.forEach(doc => congregacoes.push({ id: parseInt(doc.id), ...doc.data() }));

            // Cargos
            const cargoSnapshot = await cargosCollection.orderBy('nome').get();
            cargos = [];
            cargoSnapshot.forEach(doc => cargos.push({ id: parseInt(doc.id), ...doc.data() }));

            // Níveis
            const nivelSnapshot = await niveisCollection.orderBy('id').get();
            niveis = [];
            nivelSnapshot.forEach(doc => niveis.push({ id: parseInt(doc.id), ...doc.data() }));
        }

        // Carregar membros
        async function carregarMembros() {
            const snapshot = await membrosCollection.get();
            membros = [];
            snapshot.forEach(doc => {
                membros.push({ id: doc.id, ...doc.data() });
            });
            return membros;
        }

        // Carregar presenças de hoje
        async function carregarPresencasHoje() {
            const hoje = getDataHoje();
            const snapshot = await presencasCollection.where('data', '==', hoje).get();
            presencasHoje = {};
            snapshot.forEach(doc => { presencasHoje[doc.data().membroId] = true; });
        }

        // Obter nome pelo ID
        function getNomePorId(lista, id) {
            const item = lista.find(i => i.id == id);
            return item ? item.nome : "Desconhecido";
        }

        // Renderizar selects
        function renderizarSelects() {
            const instSelect = document.getElementById('instrumentoId');
            instSelect.innerHTML = '<option value="">Selecione...</option>';
            instrumentos.forEach(i => { instSelect.innerHTML += `<option value="${i.id}">${i.nome}</option>`; });

            const congSelect = document.getElementById('congregacaoId');
            congSelect.innerHTML = '<option value="">Selecione...</option>';
            congregacoes.forEach(c => { congSelect.innerHTML += `<option value="${c.id}">${c.nome}</option>`; });

            const cargoSelect = document.getElementById('cargoId');
            cargoSelect.innerHTML = '<option value="">Selecione...</option>';
            cargos.forEach(c => { cargoSelect.innerHTML += `<option value="${c.id}">${c.nome}</option>`; });

            const nivelSelect = document.getElementById('nivelId');
            nivelSelect.innerHTML = '<option value="">Selecione...</option>';
            niveis.forEach(n => { nivelSelect.innerHTML += `<option value="${n.id}">${n.nome}</option>`; });
        }

        // Renderizar tabela principal
        async function renderizarTabela() {
            await carregarMembros();
            await carregarPresencasHoje();
            
            const busca = document.getElementById('busca')?.value.toLowerCase() || '';
            const filtrados = membros.filter(m => m.nome?.toLowerCase().includes(busca));
            
            const tbody = document.getElementById('corpoTabela');
            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">Nenhum membro encontrado</td></tr>';
                return;
            }
            
            let html = '';
            for (const m of filtrados) {
                const instrumento = getNomePorId(instrumentos, m.instrumentoId);
                const cargo = getNomePorId(cargos, m.cargoId);
                const nivel = getNomePorId(niveis, m.nivelId);
                const presente = presencasHoje[m.id] ? '<span class="status-presente">✅ Presente</span>' : '<span class="status-ausente">❌ Ausente</span>';
                
                html += `<tr>
                    <td><strong>${m.nome || ''}</strong></td>
                    <td>${instrumento}</td>
                    <td>${cargo}</td>
                    <td>${nivel}</td>
                    <td>${presente}</td>
                    <td>
                        <button class="btn-edit" onclick="editarMembro('${m.id}')">✏️ Editar</button>
                        <button class="btn-danger" onclick="abrirModalExcluir('${m.id}', '${m.nome}')">🗑️ Excluir</button>
                        <button onclick="registrarPresenca('${m.id}', '${m.nome}')">✅ Marcar Presença</button>
                    </td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }

        // Renderizar estatísticas
        async function renderizarEstatisticas() {
            await carregarMembros();
            await carregarPresencasHoje();
            
            const busca = document.getElementById('buscaEst')?.value.toLowerCase() || '';
            const filtrados = membros.filter(m => m.nome?.toLowerCase().includes(busca));
            
            const total = filtrados.length;
            const presentesCount = filtrados.filter(m => presencasHoje[m.id]).length;
            document.getElementById('totalMembros').textContent = total;
            document.getElementById('totalPresentes').textContent = presentesCount;
            document.getElementById('totalAusentes').textContent = total - presentesCount;
            
            const tbody = document.getElementById('tabelaEstatisticas');
            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="loading">Nenhum membro encontrado</td></tr>';
                return;
            }
            
            let html = '';
            for (const m of filtrados) {
                const instrumento = getNomePorId(instrumentos, m.instrumentoId);
                const cargo = getNomePorId(cargos, m.cargoId);
                const presente = presencasHoje[m.id];
                
                html += `<tr>
                    <td><strong>${m.nome || ''}</strong></td>
                    <td>${instrumento}</td>
                    <td>${cargo}</td>
                    <td>${presente ? '<span class="status-presente">✅ Presente</span>' : '<span class="status-ausente">❌ Ausente</span>'}</td>
                    <td>${!presente ? `<button onclick="registrarPresenca('${m.id}', '${m.nome}')">✅ Marcar Presença</button>` : '-'}</td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }

        // Registrar presença
        async function registrarPresenca(id, nome) {
            const hoje = getDataHoje();
            try {
                const snapshot = await presencasCollection.where('membroId', '==', id).where('data', '==', hoje).get();
                if (!snapshot.empty) { mostrarToast(`⚠️ ${nome} já registrou presença hoje!`); return; }
                
                await presencasCollection.add({ membroId: id, nome: nome, data: hoje, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                mostrarToast(`✅ Presença registrada: ${nome}`);
                renderizarTabela();
                renderizarEstatisticas();
            } catch(error) { mostrarToast('❌ Erro: ' + error.message); }
        }

        // Limpar presenças
        async function limparPresencas() {
            if (!confirm('⚠️ Tem certeza? Isso vai apagar TODAS as presenças de hoje!')) return;
            const hoje = getDataHoje();
            const snapshot = await presencasCollection.where('data', '==', hoje).get();
            for (const doc of snapshot.docs) await presencasCollection.doc(doc.id).delete();
            mostrarToast('✅ Presenças de hoje foram limpas!');
            renderizarTabela();
            renderizarEstatisticas();
        }

        // Salvar membro (adicionar/editar)
        document.getElementById('formMembro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('membroId').value;
            const dados = {
                nome: document.getElementById('nome').value,
                instrumentoId: parseInt(document.getElementById('instrumentoId').value),
                congregacaoId: parseInt(document.getElementById('congregacaoId').value),
                cargoId: parseInt(document.getElementById('cargoId').value),
                nivelId: parseInt(document.getElementById('nivelId').value)
            };
            
            try {
                if (id) {
                    await membrosCollection.doc(id).update(dados);
                    mostrarToast('✅ Membro atualizado!');
                } else {
                    await membrosCollection.add(dados);
                    mostrarToast('✅ Membro adicionado!');
                }
                cancelarEdicao();
                trocarAba('lista');
                renderizarTabela();
                renderizarEstatisticas();
            } catch(error) { mostrarToast('❌ Erro: ' + error.message); }
        });

        // Editar membro
        async function editarMembro(id) {
            const membro = membros.find(m => m.id === id);
            if (membro) {
                document.getElementById('formTitle').textContent = '✏️ Editar Membro';
                document.getElementById('membroId').value = id;
                document.getElementById('nome').value = membro.nome || '';
                document.getElementById('instrumentoId').value = membro.instrumentoId || '';
                document.getElementById('congregacaoId').value = membro.congregacaoId || '';
                document.getElementById('cargoId').value = membro.cargoId || '';
                document.getElementById('nivelId').value = membro.nivelId || '';
                trocarAba('adicionar');
            }
        }

        function cancelarEdicao() {
            document.getElementById('formTitle').textContent = '➕ Adicionar Novo Membro';
            document.getElementById('formMembro').reset();
            document.getElementById('membroId').value = '';
        }

        function abrirModalExcluir(id, nome) { 
            membroParaExcluir = id; 
            document.getElementById('modalMsg').innerHTML = `Excluir <strong>${nome}</strong>?`; 
            document.getElementById('modal').style.display = 'flex'; 
        }
        
        function fecharModal() { 
            document.getElementById('modal').style.display = 'none'; 
            membroParaExcluir = null; 
        }
        
        async function confirmarExclusao() {
            if (membroParaExcluir) { 
                await membrosCollection.doc(membroParaExcluir).delete(); 
                mostrarToast('✅ Membro excluído!'); 
                renderizarTabela(); 
                renderizarEstatisticas(); 
                fecharModal(); 
            }
        }

        function filtrarMembros() { renderizarTabela(); }
        function filtrarEstatisticas() { renderizarEstatisticas(); }

        async function trocarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if (aba === 'lista') {
                document.getElementById('abaLista').classList.add('active');
                document.querySelector('.tab-btn:first-child').classList.add('active');
                await renderizarTabela();
            } else if (aba === 'estatisticas') {
                document.getElementById('abaEstatisticas').classList.add('active');
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                await renderizarEstatisticas();
            } else if (aba === 'adicionar') {
                document.getElementById('abaAdicionar').classList.add('active');
                document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
            }
        }

        // Inicialização
        async function init() {
            await carregarColecoes();
            renderizarSelects();
            await renderizarTabela();
            await renderizarEstatisticas();
        }
        
        init();
    </script>
</body>
</html>
