<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Manifest para PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Ícones para PWA -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Login - Identidade Ministerial CCB</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-card h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .login-card h2 {
            color: #667eea;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #219a52; }
        .mensagem {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .erro { background: #fee; color: #e74c3c; border-left: 4px solid #e74c3c; }
        .sucesso { background: #efe; color: #27ae60; border-left: 4px solid #27ae60; }
        .info { background: #e3f2fd; color: #2980b9; border-left: 4px solid #3498db; }
        .link {
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🎵 Identidade Ministerial</h1>
        <h2>CCB - Acesso ao Sistema</h2>
        
        <div class="form-group">
            <label>📧 E-mail</label>
            <input type="email" id="email" placeholder="seuemail@ccb.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label>🔒 Senha</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        
        <button id="btnLogin" onclick="login()">🔐 Entrar</button>
        
        <div class="link">
            <a onclick="recuperarSenha()">Esqueci minha senha</a> | 
            <a href="cadastrar_admin.html" style="color:#e74c3c;">➕ Cadastrar Admin</a>
        </div>
        
        <div id="mensagem"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
            authDomain: "identidadeccb.firebaseapp.com",
            projectId: "identidadeccb",
            storageBucket: "identidadeccb.firebasestorage.app",
            messagingSenderId: "385467794937",
            appId: "1:385467794937:web:d2eb32429586f018e2a928"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Verificar se já está logado
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Verificar se é admin
                try {
                    const adminDoc = await db.collection("administradores").doc(user.uid).get();
                    if (adminDoc.exists && adminDoc.data().ativo) {
                        // Verificar se precisa trocar a senha temporária
                        if (adminDoc.data().senhaTemporaria === true) {
                            window.location.href = 'primeiro_acesso.html';
                        } else {
                            // Já está logado e não precisa trocar senha
                            sessionStorage.setItem('adminLogado', JSON.stringify({
                                uid: user.uid,
                                email: user.email,
                                nome: adminDoc.data().nome || 'Administrador'
                            }));
                            window.location.href = 'index.html';
                        }
                    }
                } catch(error) {
                    console.error('Erro:', error);
                }
            }
        });

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('mensagem');
            const btnLogin = document.getElementById('btnLogin');
            
            // Limpar mensagem anterior
            msgDiv.innerHTML = '';
            
            if (!email || !password) {
                msgDiv.innerHTML = '<div class="mensagem erro">❌ Preencha e-mail e senha</div>';
                return;
            }
            
            // Desabilitar botão durante o login
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="loading"></span> Autenticando...';
            
            try {
                // 1. Fazer login com e-mail e senha
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // 2. Buscar dados do administrador no Firestore
                const adminDoc = await db.collection("administradores").doc(user.uid).get();
                
                // 3. Verificar se existe e está ativo
                if (!adminDoc.exists) {
                    await auth.signOut();
                    msgDiv.innerHTML = '<div class="mensagem erro">❌ Acesso negado. Você não é administrador.</div>';
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = '🔐 Entrar';
                    return;
                }
                
                if (!adminDoc.data().ativo) {
                    await auth.signOut();
                    msgDiv.innerHTML = '<div class="mensagem erro">❌ Conta desativada. Contate o suporte.</div>';
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = '🔐 Entrar';
                    return;
                }
                
                // 4. VERIFICAR SE É PRIMEIRO ACESSO (senha temporária)
                if (adminDoc.data().senhaTemporaria === true) {
                    msgDiv.innerHTML = '<div class="mensagem info">🔄 Primeiro acesso! Redirecionando para troca de senha...</div>';
                    setTimeout(() => {
                        window.location.href = 'primeiro_acesso.html';
                    }, 1500);
                    return;
                }
                
                // 5. Login normal - salvar na sessão e redirecionar
                sessionStorage.setItem('adminLogado', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    nome: adminDoc.data().nome || 'Administrador',
                    papel: adminDoc.data().papel || 'administrador'
                }));
                
                msgDiv.innerHTML = '<div class="mensagem sucesso">✅ Login realizado! Redirecionando...</div>';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                
            } catch(error) {
                console.error('Erro detalhado:', error);
                
                let mensagem = '❌ Erro ao fazer login';
                switch(error.code) {
                    case 'auth/user-not-found':
                        mensagem = '❌ Usuário não encontrado';
                        break;
                    case 'auth/wrong-password':
                        mensagem = '❌ Senha incorreta';
                        break;
                    case 'auth/invalid-email':
                        mensagem = '❌ E-mail inválido';
                        break;
                    case 'auth/too-many-requests':
                        mensagem = '❌ Muitas tentativas. Tente mais tarde.';
                        break;
                    case 'auth/user-disabled':
                        mensagem = '❌ Conta desativada. Contate o suporte.';
                        break;
                    default:
                        mensagem = '❌ ' + error.message;
                }
                
                msgDiv.innerHTML = '<div class="mensagem erro">' + mensagem + '</div>';
                btnLogin.disabled = false;
                btnLogin.innerHTML = '🔐 Entrar';
            }
        }
        
        async function recuperarSenha() {
            const email = prompt('Digite seu e-mail para recuperar a senha:');
            if (email && email.includes('@')) {
                const msgDiv = document.getElementById('mensagem');
                msgDiv.innerHTML = '<div class="mensagem">🔄 Enviando e-mail de recuperação...</div>';
                
                try {
                    await auth.sendPasswordResetEmail(email);
                    msgDiv.innerHTML = '<div class="mensagem sucesso">✅ E-mail de recuperação enviado! Verifique sua caixa de entrada.</div>';
                } catch(error) {
                    let mensagem = '❌ Erro ao enviar';
                    if (error.code === 'auth/user-not-found') {
                        mensagem = '❌ Nenhum usuário encontrado com este e-mail';
                    } else {
                        mensagem = '❌ ' + error.message;
                    }
                    msgDiv.innerHTML = '<div class="mensagem erro">' + mensagem + '</div>';
                }
            } else if (email) {
                alert('❌ Digite um e-mail válido');
            }
        }
        
        // Permitir login com Enter
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
