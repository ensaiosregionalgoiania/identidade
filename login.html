<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Identidade Ministerial CCB</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-card h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .login-card h2 {
            color: #667eea;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #219a52; }
        .mensagem {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .erro { background: #fee; color: #e74c3c; }
        .sucesso { background: #efe; color: #27ae60; }
        .link {
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-card" id="loginCard">
        <h1>🎵 Identidade Ministerial</h1>
        <h2>CCB - Acesso ao Sistema</h2>
        
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seuemail@ccb.com">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button onclick="login()">🔐 Entrar</button>
        
        <div class="link">
            <a onclick="recuperarSenha()">Esqueci minha senha</a> | 
            <a href="setup_admin.html" style="color:#e74c3c;">⚙️ Criar Admin (primeiro acesso)</a>
        </div>
        
        <div id="mensagem"></div>
    </div>

    <script>
       alert("ok")
       const firebaseConfig = {
            apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
            authDomain: "identidadeccb.firebaseapp.com",
            projectId: "identidadeccb",
            storageBucket: "identidadeccb.firebasestorage.app",
            messagingSenderId: "385467794937",
            appId: "1:385467794937:web:d2eb32429586f018e2a928"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // IMPEDIR LOOP: Verificar se já está logado e é admin
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Verificar se é admin
                try {
                    const adminDoc = await db.collection("administradores").doc(user.uid).get();
                    if (adminDoc.exists && adminDoc.data().ativo) {
                        // Já está logado como admin, vai direto para o index
                        sessionStorage.setItem('adminLogado', JSON.stringify({
                            uid: user.uid,
                            email: user.email,
                            nome: adminDoc.data().nome
                        }));
                        window.location.href = 'index.html';
                    }
                } catch(error) {
                    console.error('Erro:', error);
                }
            }
        });

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('mensagem');
            
            if (!email || !password) {
                msgDiv.innerHTML = '<div class="mensagem erro">❌ Preencha e-mail e senha</div>';
                return;
            }
            
            msgDiv.innerHTML = '<div class="mensagem">🔄 Autenticando...</div>';
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                const adminDoc = await db.collection("administradores").doc(user.uid).get();
                
                if (!adminDoc.exists || !adminDoc.data().ativo) {
                    await auth.signOut();
                    msgDiv.innerHTML = '<div class="mensagem erro">❌ Acesso negado. Você não é administrador.</div>';
                    return;
                }
                
                sessionStorage.setItem('adminLogado', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    nome: adminDoc.data().nome || 'Administrador'
                }));
                
                msgDiv.innerHTML = '<div class="mensagem sucesso">✅ Login realizado! Redirecionando...</div>';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                
            } catch(error) {
                let mensagem = '❌ Erro ao fazer login';
                if (error.code === 'auth/user-not-found') mensagem = '❌ Usuário não encontrado';
                else if (error.code === 'auth/wrong-password') mensagem = '❌ Senha incorreta';
                else if (error.code === 'auth/invalid-email') mensagem = '❌ E-mail inválido';
                else if (error.code === 'auth/too-many-requests') mensagem = '❌ Muitas tentativas. Tente mais tarde.';
                else mensagem = '❌ ' + error.message;
                
                msgDiv.innerHTML = '<div class="mensagem erro">' + mensagem + '</div>';
            }
        }
        
        async function recuperarSenha() {
            const email = prompt('Digite seu e-mail para recuperar a senha:');
            if (email) {
                try {
                    await auth.sendPasswordResetEmail(email);
                    alert('✅ E-mail de recuperação enviado! Verifique sua caixa de entrada.');
                } catch(error) {
                    alert('❌ Erro: ' + error.message);
                }
            }
        }
        
        // Permitir login com Enter
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
