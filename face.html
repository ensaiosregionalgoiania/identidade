<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sistema de Reconhecimento Facial - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .main-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        /* Alternador de modo */
        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* Container de vídeo */
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ddd;
            margin-bottom: 15px;
            aspect-ratio: 4/3;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #video {
            transform: scaleX(-1);
        }

        #canvas {
            transform: scaleX(-1);
        }

        /* Botões de controle */
        .controls {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .controls button {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        /* Input group */
        .input-group {
            margin: 15px 0;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 2;
            padding: 12px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .input-group button {
            flex: 1;
            padding: 12px;
        }

        /* Lista de usuários */
        .users-list {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .users-list h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1rem;
        }

        .user-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .user-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border-left: 3px solid #667eea;
        }

        .user-name {
            font-weight: bold;
            color: #333;
            font-size: 0.9rem;
            margin-bottom: 3px;
            word-break: break-word;
        }

        .user-id {
            font-size: 10px;
            color: #666;
        }

        .user-card button {
            margin-top: 8px;
            padding: 5px 10px;
            font-size: 11px;
            background: #dc3545;
        }

        /* Status */
        .status {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        /* Resultado flutuante */
        .recognition-result {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none;
            animation: slideUp 0.3s ease;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Scrollbar */
        .user-cards::-webkit-scrollbar {
            width: 4px;
        }

        .user-cards::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .user-cards::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
            }
            
            .user-cards {
                grid-template-columns: 1fr;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .input-group input,
            .input-group button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <h1>👤 Reconhecimento Facial</h1>
            <div class="subtitle">Cadastre ou identifique usuários</div>

            <!-- Alternador de modo -->
            <div class="mode-switch">
                <button class="mode-btn active" id="modeCaptureBtn" onclick="setMode('capture')">📸 CADASTRAR</button>
                <button class="mode-btn" id="modeRecognizeBtn" onclick="setMode('recognize')">🔍 RECONHECER</button>
            </div>

            <!-- Container único para vídeo -->
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="canvas"></canvas>
            </div>

            <!-- Botões de controle -->
            <div class="controls">
                <button id="startCameraBtn" onclick="startCamera()">📷 Iniciar Câmera</button>
                <button id="actionBtn" onclick="actionButtonClick()" disabled>---</button>
                <button id="stopActionBtn" onclick="stopAction()" disabled>⏹️ Parar</button>
                <button id="clearBtn" onclick="clearAllUsers()" class="btn-danger">🗑️ Limpar</button>
            </div>

            <!-- Área de cadastro -->
            <div class="input-group" id="captureGroup" style="display: none;">
                <input type="text" id="userName" placeholder="Digite o nome do usuário" maxlength="30">
                <button onclick="saveUser()" class="btn-success">💾 Salvar</button>
                <button onclick="cancelCapture()">❌ Cancelar</button>
            </div>

            <div id="status" class="status info">
                ✅ Clique em "Iniciar Câmera"
            </div>
        </div>

        <!-- Lista de usuários -->
        <div class="users-list">
            <h3>📋 Usuários Cadastrados (<span id="userCount">0</span>)</h3>
            <div id="usersContainer" class="user-cards">
                <div style="text-align: center; color: #999; font-size: 12px;">Nenhum usuário</div>
            </div>
        </div>
    </div>

    <div id="recognitionResult" class="recognition-result"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let modelsLoaded = false;
        let stream = null;
        let recognitionInterval = null;
        let isRecognizing = false;
        let currentMode = 'capture';
        
        let users = [];
        let capturedDescriptor = null;

        // Carregar usuários
        function loadUsers() {
            const saved = localStorage.getItem('facialUsers');
            if (saved) {
                users = JSON.parse(saved);
                updateUsersList();
            }
        }

        function saveUsers() {
            localStorage.setItem('facialUsers', JSON.stringify(users));
            updateUsersList();
        }

        function updateUsersList() {
            const container = document.getElementById('usersContainer');
            const countSpan = document.getElementById('userCount');
            
            if (users.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #999; font-size: 12px;">Nenhum usuário cadastrado</div>';
                countSpan.textContent = '0';
                return;
            }
            
            countSpan.textContent = users.length;
            container.innerHTML = users.map((user, index) => `
                <div class="user-card">
                    <div class="user-name">👤 ${escapeHtml(user.name)}</div>
                    <div class="user-id">ID: ${user.id}</div>
                    <button onclick="deleteUser(${index})">Excluir</button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function deleteUser(index) {
            if (confirm(`Excluir ${users[index].name}?`)) {
                const name = users[index].name;
                users.splice(index, 1);
                saveUsers();
                showStatus(`${name} removido!`, 'success');
                if (currentMode === 'recognize' && users.length === 0) {
                    stopAction();
                }
            }
        }

        function clearAllUsers() {
            if (confirm('⚠️ Apagar TODOS os usuários?')) {
                users = [];
                saveUsers();
                capturedDescriptor = null;
                showStatus('Todos os usuários removidos!', 'success');
                document.getElementById('captureGroup').style.display = 'none';
                if (currentMode === 'recognize') {
                    stopAction();
                }
                updateActionButton();
            }
        }

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            setTimeout(() => {
                if (statusDiv.className.includes(type)) {
                    setTimeout(() => {
                        if (!statusDiv.className.includes('error')) {
                            statusDiv.className = 'status info';
                            statusDiv.textContent = '✅ Sistema pronto';
                        }
                    }, 3000);
                }
            }, 3000);
        }

        function showRecognitionResult(message, isSuccess = true) {
            const resultDiv = document.getElementById('recognitionResult');
            resultDiv.textContent = message;
            resultDiv.style.display = 'block';
            resultDiv.style.background = isSuccess ? '#d4edda' : '#f8d7da';
            resultDiv.style.color = isSuccess ? '#155724' : '#721c24';
            
            setTimeout(() => {
                resultDiv.style.display = 'none';
            }, 2000);
        }

        // Alternar modo
        function setMode(mode) {
            currentMode = mode;
            
            document.getElementById('modeCaptureBtn').classList.toggle('active', mode === 'capture');
            document.getElementById('modeRecognizeBtn').classList.toggle('active', mode === 'recognize');
            
            stopAction();
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('captureGroup').style.display = 'none';
            capturedDescriptor = null;
            
            updateActionButton();
            
            if (mode === 'capture') {
                showStatus('📸 Modo Cadastro - Capture um rosto para cadastrar', 'info');
            } else {
                if (users.length === 0) {
                    showStatus('🔍 Modo Reconhecimento - Cadastre usuários primeiro', 'info');
                } else {
                    showStatus('🔍 Modo Reconhecimento - Clique em "Reconhecer"', 'info');
                }
            }
        }
        
        function updateActionButton() {
            const actionBtn = document.getElementById('actionBtn');
            if (currentMode === 'capture') {
                actionBtn.textContent = '📸 Capturar Face';
                actionBtn.disabled = !modelsLoaded || !stream;
            } else {
                actionBtn.textContent = '🔍 Iniciar Reconhecimento';
                actionBtn.disabled = !modelsLoaded || !stream || users.length === 0;
            }
        }
        
        function actionButtonClick() {
            if (currentMode === 'capture') {
                captureFace();
            } else {
                startRecognition();
            }
        }
        
        function stopAction() {
            if (currentMode === 'recognize') {
                stopRecognition();
            } else {
                cancelCapture();
            }
        }

        // Carregar modelos
        async function loadModels() {
            const modelUrl = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            
            showStatus('📥 Baixando modelos de IA...', 'info');
            
            try {
                await faceapi.nets.tinyFaceDetector.loadFromUri(modelUrl);
                await faceapi.nets.faceLandmark68Net.loadFromUri(modelUrl);
                await faceapi.nets.faceRecognitionNet.loadFromUri(modelUrl);
                
                modelsLoaded = true;
                showStatus('✅ Modelos carregados! Inicie a câmera', 'success');
                document.getElementById('startCameraBtn').disabled = false;
                updateActionButton();
            } catch (error) {
                console.error(error);
                showStatus('❌ Erro ao carregar modelos. Verifique sua internet.', 'error');
            }
        }

        // Iniciar câmera
        async function startCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                video.srcObject = stream;
                
                await video.play();
                
                // Aguardar o vídeo carregar completamente
                await new Promise((resolve) => {
                    if (video.readyState >= 2) {
                        resolve();
                    } else {
                        video.onloadeddata = () => resolve();
                    }
                });
                
                // Configurar canvas com as dimensões corretas
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                showStatus('✅ Câmera ativada!', 'success');
                document.getElementById('startCameraBtn').disabled = true;
                updateActionButton();
                document.getElementById('stopActionBtn').disabled = false;
                
            } catch (error) {
                console.error(error);
                showStatus('❌ Erro ao acessar câmera. Verifique as permissões.', 'error');
            }
        }

        // Capturar face (modo cadastro)
        async function captureFace() {
            if (!modelsLoaded) {
                showStatus('⏳ Aguarde os modelos carregarem...', 'error');
                return;
            }
            
            if (!stream) {
                showStatus('❌ Câmera não está ativa', 'error');
                return;
            }
            
            showStatus('📸 Detectando rosto... Aguarde', 'info');
            
            try {
                // Garantir que o canvas tem o tamanho correto
                if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
                
                // Detectar face
                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();
                
                if (detection) {
                    capturedDescriptor = detection.descriptor;
                    
                    // Desenhar a detecção no canvas
                    const displaySize = { width: canvas.width, height: canvas.height };
                    const resizedDetection = faceapi.resizeResults(detection, displaySize);
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    faceapi.draw.drawDetections(canvas, resizedDetection);
                    faceapi.draw.drawFaceLandmarks(canvas, resizedDetection);
                    
                    showStatus('✅ Face capturada! Digite o nome e salve', 'success');
                    document.getElementById('captureGroup').style.display = 'flex';
                    document.getElementById('userName').value = '';
                    document.getElementById('userName').focus();
                    document.getElementById('actionBtn').disabled = true;
                } else {
                    showStatus('❌ Nenhum rosto detectado. Tente novamente com boa iluminação.', 'error');
                    // Limpar canvas se não detectou nada
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            } catch (error) {
                console.error('Erro na captura:', error);
                showStatus('❌ Erro ao capturar face. Tente novamente.', 'error');
            }
        }

        // Salvar usuário
        function saveUser() {
            const name = document.getElementById('userName').value.trim();
            
            if (!name) {
                showStatus('❌ Digite um nome', 'error');
                return;
            }
            
            if (!capturedDescriptor) {
                showStatus('❌ Capture uma face primeiro', 'error');
                return;
            }
            
            const newUser = {
                id: Date.now(),
                name: name,
                descriptor: Array.from(capturedDescriptor),
                date: new Date().toLocaleString()
            };
            
            users.push(newUser);
            saveUsers();
            
            showStatus(`✅ ${name} cadastrado com sucesso!`, 'success');
            
            // Limpar captura
            capturedDescriptor = null;
            document.getElementById('captureGroup').style.display = 'none';
            document.getElementById('userName').value = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('actionBtn').disabled = false;
        }

        function cancelCapture() {
            capturedDescriptor = null;
            document.getElementById('captureGroup').style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('actionBtn').disabled = false;
            showStatus('Captura cancelada', 'info');
        }

        // Reconhecer face
        async function recognizeFace() {
            if (!modelsLoaded || users.length === 0) {
                return null;
            }
            
            try {
                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();
                
                if (!detection) {
                    return null;
                }
                
                let bestMatch = null;
                let bestDistance = 0.6; // Limiar de reconhecimento
                
                for (const user of users) {
                    const userDescriptor = new Float32Array(user.descriptor);
                    const distance = faceapi.euclideanDistance(detection.descriptor, userDescriptor);
                    
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        bestMatch = user;
                    }
                }
                
                return bestMatch;
            } catch (error) {
                console.error('Erro no reconhecimento:', error);
                return null;
            }
        }

        // Iniciar reconhecimento contínuo
        async function startRecognition() {
            if (users.length === 0) {
                showStatus('⚠️ Cadastre usuários primeiro', 'error');
                return;
            }
            
            if (isRecognizing) return;
            
            isRecognizing = true;
            document.getElementById('actionBtn').disabled = true;
            document.getElementById('stopActionBtn').disabled = false;
            
            showStatus('🔍 Reconhecimento ativo - Olhe para a câmera', 'info');
            
            async function recognizeLoop() {
                if (!isRecognizing) return;
                
                try {
                    // Garantir que o canvas tem o tamanho correto
                    if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    }
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                        .withFaceLandmarks();
                    
                    if (detection) {
                        const displaySize = { width: canvas.width, height: canvas.height };
                        const resizedDetection = faceapi.resizeResults(detection, displaySize);
                        
                        faceapi.draw.drawDetections(canvas, resizedDetection);
                        faceapi.draw.drawFaceLandmarks(canvas, resizedDetection);
                        
                        const recognizedUser = await recognizeFace();
                        
                        if (recognizedUser) {
                            const box = resizedDetection.detection.box;
                            ctx.font = "bold 16px Arial";
                            ctx.fillStyle = "#00ff00";
                            ctx.shadowBlur = 0;
                            ctx.fillText(`✅ ${recognizedUser.name}`, box.x, box.y - 8);
                            
                            showRecognitionResult(`👋 Olá, ${recognizedUser.name}!`, true);
                        } else {
                            const box = resizedDetection.detection.box;
                            ctx.font = "14px Arial";
                            ctx.fillStyle = "#ff6600";
                            ctx.fillText("❓ Desconhecido", box.x, box.y - 8);
                        }
                    }
                    
                } catch (error) {
                    console.error('Erro no loop de reconhecimento:', error);
                }
                
                if (isRecognizing) {
                    requestAnimationFrame(recognizeLoop);
                }
            }
            
            recognizeLoop();
        }

        // Parar reconhecimento
        function stopRecognition() {
            isRecognizing = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('actionBtn').disabled = false;
            document.getElementById('stopActionBtn').disabled = true;
            showStatus('✅ Reconhecimento finalizado', 'success');
        }

        // Inicializar
        async function init() {
            document.getElementById('startCameraBtn').disabled = true;
            document.getElementById('actionBtn').disabled = true;
            document.getElementById('stopActionBtn').disabled = true;
            
            loadUsers();
            await loadModels();
        }
        
        init();
    </script>
</body>
</html>
