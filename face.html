<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cadastro Facial - Simple Face Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 4/3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .input-group {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 2;
            padding: 12px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .input-group button {
            flex: 1;
            margin-top: 0;
        }

        .preview {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .preview h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 1rem;
        }

        .preview-img {
            max-width: 100px;
            border-radius: 10px;
            margin: 5px;
            border: 2px solid #ddd;
        }

        .users-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .user-item {
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            color: #333;
        }

        .user-date {
            font-size: 0.7rem;
            color: #666;
        }

        .user-actions button {
            padding: 5px 10px;
            font-size: 11px;
            background: #dc3545;
        }

        .status {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 15px;
            }
            
            button {
                padding: 10px 16px;
                font-size: 12px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .input-group input,
            .input-group button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📸 Cadastro Facial</h1>
            <div class="subtitle">Capture seu rosto e salve no sistema</div>

            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>

            <canvas id="canvas"></canvas>

            <div class="controls">
                <button id="startCameraBtn" onclick="startCamera()">📷 Iniciar Câmera</button>
                <button id="captureBtn" onclick="captureImage()" disabled>📸 Capturar</button>
                <button id="clearAllBtn" onclick="clearAllUsers()" class="btn-danger">🗑️ Limpar Todos</button>
            </div>

            <div id="captureGroup" class="input-group" style="display: none;">
                <input type="text" id="userName" placeholder="Digite o nome da pessoa" maxlength="50">
                <button onclick="saveUser()">💾 Salvar</button>
                <button onclick="cancelCapture()">❌ Cancelar</button>
            </div>

            <div id="status" class="status info">
                👆 Clique em "Iniciar Câmera" para começar
            </div>
        </div>

        <div class="card">
            <h3>📋 Pessoas Cadastradas (<span id="userCount">0</span>)</h3>
            <div id="usersList" class="users-list">
                <div class="empty-message">Nenhuma pessoa cadastrada</div>
            </div>
        </div>
    </div>

    <script>
        // Elementos
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Variáveis
        let stream = null;
        let capturedImageData = null;
        let currentUserImage = null;
        
        // Lista de usuários
        let users = [];

        // Carregar usuários do localStorage
        function loadUsers() {
            const saved = localStorage.getItem('face_users');
            if (saved) {
                users = JSON.parse(saved);
                updateUsersList();
            }
        }

        // Salvar usuários no localStorage
        function saveUsers() {
            localStorage.setItem('face_users', JSON.stringify(users));
            updateUsersList();
        }

        // Atualizar lista de usuários na tela
        function updateUsersList() {
            const container = document.getElementById('usersList');
            const countSpan = document.getElementById('userCount');
            
            if (users.length === 0) {
                container.innerHTML = '<div class="empty-message">Nenhuma pessoa cadastrada</div>';
                countSpan.textContent = '0';
                return;
            }
            
            countSpan.textContent = users.length;
            container.innerHTML = users.map((user, index) => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-name">👤 ${escapeHtml(user.name)}</div>
                        <div class="user-date">📅 ${user.date}</div>
                    </div>
                    <div class="user-actions">
                        <img src="${user.image}" class="preview-img" alt="${user.name}">
                        <button onclick="deleteUser(${index})">🗑️ Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Deletar usuário
        function deleteUser(index) {
            if (confirm(`Tem certeza que deseja excluir ${users[index].name}?`)) {
                const name = users[index].name;
                users.splice(index, 1);
                saveUsers();
                showStatus(`✅ ${name} removido com sucesso!`, 'success');
            }
        }

        // Limpar todos os usuários
        function clearAllUsers() {
            if (confirm('⚠️ Isso irá apagar TODAS as pessoas cadastradas. Continuar?')) {
                users = [];
                saveUsers();
                capturedImageData = null;
                currentUserImage = null;
                showStatus('🗑️ Todos os usuários foram removidos!', 'success');
                document.getElementById('captureGroup').style.display = 'none';
            }
        }

        // Mostrar mensagem de status
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            setTimeout(() => {
                if (statusDiv.className.includes(type)) {
                    setTimeout(() => {
                        statusDiv.className = 'status info';
                        statusDiv.textContent = '✅ Sistema pronto';
                    }, 3000);
                }
            }, 3000);
        }

        // Iniciar câmera
        async function startCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                video.srcObject = stream;
                
                await video.play();
                
                // Aguardar vídeo carregar
                await new Promise((resolve) => {
                    if (video.readyState >= 2) {
                        resolve();
                    } else {
                        video.onloadeddata = () => resolve();
                    }
                });
                
                // Configurar canvas com as dimensões do vídeo
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                showStatus('✅ Câmera ativada! Clique em "Capturar" para tirar uma foto', 'success');
                document.getElementById('startCameraBtn').disabled = true;
                document.getElementById('captureBtn').disabled = false;
                
            } catch (error) {
                console.error('Erro ao acessar câmera:', error);
                showStatus('❌ Erro ao acessar a câmera. Verifique as permissões.', 'error');
            }
        }

        // Capturar imagem da câmera
        function captureImage() {
            if (!stream) {
                showStatus('❌ Câmera não está ativa. Inicie a câmera primeiro.', 'error');
                return;
            }
            
            try {
                // Desenhar o frame atual do vídeo no canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Converter para base64 (JPEG com qualidade 0.8)
                capturedImageData = canvas.toDataURL('image/jpeg', 0.8);
                currentUserImage = capturedImageData;
                
                showStatus('✅ Foto capturada! Digite o nome e clique em Salvar', 'success');
                document.getElementById('captureGroup').style.display = 'flex';
                document.getElementById('userName').value = '';
                document.getElementById('userName').focus();
                document.getElementById('captureBtn').disabled = true;
                
            } catch (error) {
                console.error('Erro ao capturar imagem:', error);
                showStatus('❌ Erro ao capturar imagem. Tente novamente.', 'error');
            }
        }

        // Salvar usuário
        function saveUser() {
            const name = document.getElementById('userName').value.trim();
            
            if (!name) {
                showStatus('❌ Por favor, digite o nome da pessoa', 'error');
                return;
            }
            
            if (!capturedImageData) {
                showStatus('❌ Nenhuma foto capturada. Capture uma imagem primeiro.', 'error');
                return;
            }
            
            // Verificar se já existe um usuário com este nome
            const existingUser = users.find(u => u.name.toLowerCase() === name.toLowerCase());
            if (existingUser) {
                showStatus(`⚠️ Já existe uma pessoa com o nome "${name}". Use outro nome.`, 'error');
                return;
            }
            
            // Criar novo usuário
            const newUser = {
                id: Date.now(),
                name: name,
                image: capturedImageData,
                date: new Date().toLocaleString('pt-BR')
            };
            
            users.push(newUser);
            saveUsers();
            
            showStatus(`✅ ${name} cadastrado com sucesso!`, 'success');
            
            // Limpar captura
            capturedImageData = null;
            currentUserImage = null;
            document.getElementById('captureGroup').style.display = 'none';
            document.getElementById('captureBtn').disabled = false;
            document.getElementById('userName').value = '';
        }

        function cancelCapture() {
            capturedImageData = null;
            currentUserImage = null;
            document.getElementById('captureGroup').style.display = 'none';
            document.getElementById('captureBtn').disabled = false;
            showStatus('Captura cancelada', 'info');
        }

        // Inicializar
        function init() {
            loadUsers();
            showStatus('👆 Clique em "Iniciar Câmera" para começar', 'info');
        }
        
        init();
    </script>
</body>
</html>
