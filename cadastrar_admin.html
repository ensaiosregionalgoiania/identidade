<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Administrador - CCB</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #2c3e50; margin-bottom: 10px; text-align: center; }
        h2 { color: #667eea; font-size: 1rem; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #219a52; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        .btn-voltar { background: #3498db; }
        .btn-voltar:hover { background: #2980b9; }
        .mensagem { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 0.9rem; text-align: center; }
        .erro { background: #fee; color: #c0392b; border-left: 4px solid #e74c3c; }
        .sucesso { background: #efe; color: #27ae60; border-left: 4px solid #27ae60; }
        .info { background: #e3f2fd; color: #2980b9; border-left: 4px solid #3498db; }
        .aviso { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        select[disabled] { background: #f0f0f0; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Identidade Ministerial CCB</h1>
        <h2 id="subtitle">➕ Cadastrar Administrador</h2>
        
        <div id="avisoArea"></div>
        
        <div class="form-group">
            <label>👤 Nome completo</label>
            <input type="text" id="nome" placeholder="Ex: José da Silva">
        </div>
        <div class="form-group">
            <label>📧 E-mail (será o login)</label>
            <input type="email" id="email" placeholder="admin@ccb.com">
        </div>
        <div class="form-group">
            <label>📍 Congregação</label>
            <select id="congregacaoSelect">
                <option value="">Carregando congregações...</option>
            </select>
        </div>
        <div class="form-group">
            <label>🔑 Cargo/Papel</label>
            <select id="papel">
                <option value="administrador">Administrador</option>
                <option value="secretario">Secretário</option>
                <option value="obreiro">Obreiro</option>
            </select>
        </div>
        
        <div class="info" style="margin-bottom: 15px; padding: 10px;">
            🔐 A senha temporária será: <strong>123456</strong><br>
            O usuário será obrigado a trocar a senha no primeiro login.
        </div>
        
        <button id="btnCadastrar" onclick="cadastrarAdmin()">✨ Cadastrar Administrador</button>
        <button class="btn-voltar" onclick="voltar()">🔙 Voltar</button>
        
        <div id="mensagem"></div>
    </div>

    <script>
        // Verificar se o Firebase já foi inicializado
        let db, auth;
        let congregacoes = [];
        let usuarioLogado = null;
        let congregacoesIdUsuario = null;
        
        try {
            if (firebase.apps.length === 0) {
                const firebaseConfig = {
                    apiKey: "AIzaSyA4COgeJSENsHrQHDx39gpZvif3zVrGjYE",
                    authDomain: "identidadeccb.firebaseapp.com",
                    projectId: "identidadeccb",
                    storageBucket: "identidadeccb.firebasestorage.app",
                    messagingSenderId: "385467794937",
                    appId: "1:385467794937:web:d2eb32429586f018e2a928"
                };
                firebase.initializeApp(firebaseConfig);
                console.log("Firebase inicializado nesta página");
            } else {
                console.log("Firebase já estava inicializado");
            }
            
            auth = firebase.auth();
            db = firebase.firestore();
            
        } catch(error) {
            console.error("Erro ao inicializar Firebase:", error);
            alert("Erro ao conectar com o Firebase. Recarregue a página.");
        }

        let podeCadastrar = true;
        let ehPrimeiroAdmin = false;

        // Função para carregar congregações baseado no usuário logado
        async function carregarCongregacoes() {
            const congregacaoSelect = document.getElementById('congregacaoSelect');
            congregacaoSelect.innerHTML = '<option value="">Carregando congregações...</option>';
            congregacaoSelect.disabled = true;
            
            try {
                // Buscar todas as congregações
                const congregacoesSnapshot = await db.collection("congregacoes").orderBy('nome').get();
                congregacoes = [];
                congregacoesSnapshot.forEach(doc => {
                    const data = doc.data();
                    congregacoes.push({
                        docId: doc.id,           // ID do documento no Firestore
                        id: data.id,             // Campo id dentro do documento
                        nome: data.nome,
                        cidade: data.cidade || ''
                    });
                });
                
                console.log("Congregações carregadas:", congregacoes.length);
                console.log("congregacoesId do usuário:", congregacoesIdUsuario);
                console.log("Tipo do congregacoesIdUsuario:", typeof congregacoesIdUsuario);
                
                // Filtrar congregações baseado no congregacoesId do usuário
                let congregacoesFiltradas = [];
                
                if (congregacoesIdUsuario && congregacoesIdUsuario !== 0 && congregacoesIdUsuario !== '0') {
                    // Usuário tem uma congregação específica - mostrar apenas essa
                    console.log("Filtrando para mostrar apenas a congregação com valor:", congregacoesIdUsuario);
                    
                    const idUsuarioStr = String(congregacoesIdUsuario);
                    
                    // Procurar a congregação que corresponde ao ID (seja pelo docId ou pelo campo id)
                    congregacoesFiltradas = congregacoes.filter(c => {
                        // Verificar se o docId é igual (ex: "kpUJf9FKUMF2jxJSddCu")
                        const matchDocId = String(c.docId) === idUsuarioStr;
                        // Verificar se o campo id é igual (ex: 2)
                        const matchCampoId = String(c.id) === idUsuarioStr;
                        
                        if (matchDocId || matchCampoId) {
                            console.log(`✅ Congregação encontrada: ${c.nome} (docId: ${c.docId}, campoId: ${c.id})`);
                        }
                        return matchDocId || matchCampoId;
                    });
                    
                    console.log("Congregações filtradas:", congregacoesFiltradas.length);
                    
                    if (congregacoesFiltradas.length === 0) {
                        console.warn("Nenhuma congregação encontrada com o valor:", congregacoesIdUsuario);
                        console.log("Congregações disponíveis:");
                        congregacoes.forEach(c => {
                            console.log(`  - ${c.nome}: docId="${c.docId}", campoId=${c.id}`);
                        });
                    }
                } else {
                    // Usuário pode ver todas as congregações (administrador geral)
                    console.log("Usuário tem acesso a todas as congregações");
                    congregacoesFiltradas = congregacoes;
                }
                
                // Popular o select
                congregacaoSelect.innerHTML = '<option value="">Selecione uma congregação...</option>';
                
                if (congregacoesFiltradas.length === 0) {
                    congregacaoSelect.innerHTML = '<option value="">Nenhuma congregação disponível</option>';
                    congregacaoSelect.disabled = true;
                    console.error("Nenhuma congregação disponível para este usuário");
                    return;
                }
                
                // Para usuário com restrição, pré-selecionar a única opção
                let temOpcaoSelecionada = false;
                
                for (const cong of congregacoesFiltradas) {
                    const cidadeTexto = cong.cidade ? ` (${cong.cidade})` : '';
                    const optionValue = cong.docId; // Usar o docId como value
                    congregacaoSelect.innerHTML += `<option value="${optionValue}">${cong.nome}${cidadeTexto}</option>`;
                }
                
                congregacaoSelect.disabled = false;
                console.log(`${congregacoesFiltradas.length} congregações carregadas no select`);
                
                // Se for acesso restrito e só tem uma opção, selecionar automaticamente
                if (congregacoesFiltradas.length === 1 && congregacoesIdUsuario && congregacoesIdUsuario !== 0) {
                    congregacaoSelect.selectedIndex = 1; // Seleciona a primeira opção (índice 0 é o placeholder)
                    console.log("Opção única selecionada automaticamente");
                }
                
            } catch(error) {
                console.error("Erro ao carregar congregações:", error);
                congregacaoSelect.innerHTML = '<option value="">Erro ao carregar congregações</option>';
                congregacaoSelect.disabled = true;
            }
        }

        async function inicializar() {
            console.log("Inicializando página de cadastro...");
            
            try {
                // Verificar se existem administradores no sistema
                const admins = await db.collection("administradores").limit(1).get();
                
                if (admins.empty) {
                    ehPrimeiroAdmin = true;
                    podeCadastrar = true;
                    congregacoesIdUsuario = 0; // Primeiro admin pode ver todas
                    document.getElementById('subtitle').innerHTML = '👑 Criar Primeiro Administrador';
                    document.getElementById('avisoArea').innerHTML = `
                        <div class="aviso" style="margin-bottom: 20px; padding: 12px;">
                            ⚠️ <strong>Primeiro acesso ao sistema!</strong><br>
                            Nenhum administrador foi encontrado. Você está criando o administrador principal.
                        </div>
                    `;
                    document.getElementById('papel').disabled = true;
                    document.getElementById('papel').value = 'administrador';
                    
                    // Carregar todas as congregações para o primeiro admin
                    await carregarCongregacoes();
                    return;
                }
                
                // Verificar usuário logado
                const user = auth.currentUser;
                
                if (!user) {
                    document.getElementById('avisoArea').innerHTML = `
                        <div class="aviso" style="margin-bottom: 20px; padding: 12px;">
                            ⚠️ Já existe um administrador no sistema.<br>
                            Você precisa estar logado para cadastrar novos usuários.
                        </div>
                    `;
                    document.getElementById('btnCadastrar').disabled = true;
                    document.getElementById('congregacaoSelect').disabled = true;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                    return;
                }
                
                usuarioLogado = user;
                
                // Buscar dados do administrador logado
                const adminDoc = await db.collection("administradores").doc(user.uid).get();
                
                if (!adminDoc.exists || !adminDoc.data().ativo) {
                    document.getElementById('avisoArea').innerHTML = `
                        <div class="erro" style="margin-bottom: 20px; padding: 12px;">
                            ❌ Acesso negado! Apenas administradores podem cadastrar novos usuários.
                        </div>
                    `;
                    document.getElementById('btnCadastrar').disabled = true;
                    document.getElementById('congregacaoSelect').disabled = true;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                    return;
                }
                
                const adminData = adminDoc.data();
                congregacoesIdUsuario = adminData.congregacoes_id || 0;
                
                console.log("Usuário logado:", {
                    nome: adminData.nome,
                    email: user.email,
                    congregacoes_id: congregacoesIdUsuario,
                    papel: adminData.papel
                });
                
                podeCadastrar = true;
                
                let mensagemAcesso = `<div class="info" style="margin-bottom: 20px; padding: 12px;">
                    🔐 Logado como: <strong>${adminData.nome || user.email}</strong><br>`;
                
                if (congregacoesIdUsuario && congregacoesIdUsuario !== 0 && congregacoesIdUsuario !== '0') {
                    mensagemAcesso += `📍 Acesso restrito à congregação com ID: ${congregacoesIdUsuario}<br>`;
                } else {
                    mensagemAcesso += `🌍 Acesso a todas as congregações<br>`;
                }
                
                mensagemAcesso += `✅ Você pode criar novos usuários.</div>`;
                document.getElementById('avisoArea').innerHTML = mensagemAcesso;
                
                // Carregar congregações baseado no congregacoes_id do usuário
                await carregarCongregacoes();
                
            } catch(error) {
                console.error("Erro na inicialização:", error);
                document.getElementById('avisoArea').innerHTML = `
                    <div class="erro" style="margin-bottom: 20px; padding: 12px;">
                        ❌ Erro: ${error.message}
                    </div>
                `;
            }
        }

        async function cadastrarAdmin() {
            if (!podeCadastrar) {
                alert("Você não tem permissão para cadastrar.");
                return;
            }
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const papel = document.getElementById('papel').value;
            const congregacaoId = document.getElementById('congregacaoSelect').value;
            const senhaTemporaria = "123456";
            const msgDiv = document.getElementById('mensagem');
            const btn = document.getElementById('btnCadastrar');
            
            if (!nome || !email) {
                msgDiv.innerHTML = '<div class="mensagem erro">❌ Preencha todos os campos</div>';
                return;
            }
            
            if (!email.includes('@')) {
                msgDiv.innerHTML = '<div class="mensagem erro">❌ Digite um e-mail válido</div>';
                return;
            }
            
            if (!congregacaoId) {
                msgDiv.innerHTML = '<div class="mensagem erro">❌ Selecione uma congregação</div>';
                return;
            }
            
            // Validar se o usuário tem permissão para cadastrar nesta congregação
            if (congregacoesIdUsuario && congregacoesIdUsuario !== 0 && congregacoesIdUsuario !== '0') {
                const idUsuarioStr = String(congregacoesIdUsuario);
                
                // Buscar a congregação selecionada para verificar se corresponde
                const congregacaoSelecionada = congregacoes.find(c => c.docId === congregacaoId);
                
                let temPermissao = false;
                
                if (congregacaoSelecionada) {
                    // Verificar se o campo id da congregação corresponde ao ID do usuário
                    temPermissao = String(congregacaoSelecionada.id) === idUsuarioStr ||
                                   String(congregacaoSelecionada.docId) === idUsuarioStr;
                }
                
                if (!temPermissao) {
                    msgDiv.innerHTML = '<div class="mensagem erro">❌ Você não tem permissão para cadastrar usuários nesta congregação!</div>';
                    return;
                }
            }
            
            msgDiv.innerHTML = '<div class="mensagem">🔄 Criando administrador...</div>';
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Cadastrando...';
            
            try {
                let uid;
                
                if (ehPrimeiroAdmin) {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, senhaTemporaria);
                    uid = userCredential.user.uid;
                    await auth.signOut();
                } else {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, senhaTemporaria);
                    uid = userCredential.user.uid;
                }
                
                // Buscar o nome da congregação selecionada
                const congregacaoSelecionada = congregacoes.find(c => c.docId === congregacaoId);
                const congregacaoNome = congregacaoSelecionada ? congregacaoSelecionada.nome : '';
                const congregacaoCampoId = congregacaoSelecionada ? congregacaoSelecionada.id : null;
                
                await db.collection("administradores").doc(uid).set({
                    uid: uid,
                    nome: nome,
                    email: email,
                    papel: papel,
                    congregacao_id: congregacaoCampoId || congregacaoId,  // Salvar o campo id (número)
                    congregacao_doc_id: congregacaoId,                    // Salvar o docId também
                    congregacao_nome: congregacaoNome,
                    senhaTemporaria: true,
                    ativo: true,
                    criadoEm: new Date().toISOString(),
                    criadoPor: ehPrimeiroAdmin ? 'primeiro_acesso' : (auth.currentUser ? auth.currentUser.email : 'sistema')
                });
                
                let mensagemSucesso = `✅ Administrador cadastrado!<br><br>📧 ${email}<br>🔑 Senha: 123456<br>📍 Congregação: ${congregacaoNome}`;
                
                if (ehPrimeiroAdmin) {
                    mensagemSucesso += `<br><br>🔐 Agora faça login com esta senha.`;
                    msgDiv.innerHTML = `<div class="mensagem sucesso">${mensagemSucesso}</div>`;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 4000);
                } else {
                    msgDiv.innerHTML = `<div class="mensagem sucesso">${mensagemSucesso}<br>✅ O usuário precisará trocar a senha no primeiro acesso.</div>`;
                    document.getElementById('nome').value = '';
                    document.getElementById('email').value = '';
                    // Não resetar o select de congregação
                }
                
            } catch(error) {
                console.error('Erro:', error);
                
                let mensagemErro = '';
                if (error.code === 'auth/email-already-in-use') {
                    mensagemErro = 'Este e-mail já está em uso.';
                } else if (error.code === 'auth/operation-not-allowed') {
                    mensagemErro = 'Authentication não está ativado! Ative no Firebase Console.';
                } else {
                    mensagemErro = error.message;
                }
                
                msgDiv.innerHTML = `<div class="mensagem erro">❌ ${mensagemErro}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '✨ Cadastrar Administrador';
            }
        }
        
        function voltar() {
            window.location.href = 'login.html';
        }
        
        window.addEventListener('load', function() {
            setTimeout(inicializar, 500);
        });
    </script>
</body>
</html>
