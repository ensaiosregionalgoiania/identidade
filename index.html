<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Membros - Identidade Ministerial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 1.5rem;
        }

        .header h1 i {
            color: #3498db;
            margin-right: 10px;
        }

        .btn-novo {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-novo:hover {
            background: #219a52;
            transform: translateY(-2px);
        }

        /* Barra de busca */
        .search-bar {
            background: white;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search-bar input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #3498db;
        }

        /* Tabela */
        .table-container {
            background: white;
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #2c3e50;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .btn-editar, .btn-excluir, .btn-qrcode {
            padding: 6px 12px;
            margin: 0 3px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-editar {
            background: #3498db;
            color: white;
        }

        .btn-editar:hover {
            background: #2980b9;
        }

        .btn-excluir {
            background: #e74c3c;
            color: white;
        }

        .btn-excluir:hover {
            background: #c0392b;
        }

        .btn-qrcode {
            background: #9b59b6;
            color: white;
        }

        .btn-qrcode:hover {
            background: #8e44ad;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-oficializado { background: #27ae60; color: white; }
        .badge-rjm { background: #f39c12; color: white; }
        .badge-culte { background: #3498db; color: white; }
        .badge-meia { background: #95a5a6; color: white; }

        .empty-row td {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* Modal de confirmação */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 400px;
            text-align: center;
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-confirmar {
            background: #e74c3c;
            color: white;
        }

        .btn-cancelar {
            background: #95a5a6;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-church"></i> Identidade Ministerial</h1>
            <a href="editar.html" class="btn-novo">+ Novo Membro</a>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por nome..." onkeyup="buscarMembros()">
        </div>

        <div class="table-container">
            <table id="tabelaMembros">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Instrumento</th>
                        <th>Congregação</th>
                        <th>Cargo</th>
                        <th>Nível</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr class="empty-row">
                        <td colspan="6">Carregando membros...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Confirmar exclusão</h3>
            <p>Tem certeza que deseja excluir <strong id="nomeExcluir"></strong>?</p>
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirmar" onclick="confirmarExclusao()">Excluir</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script src="dados.js"></script>
    <script>
        let membroParaExcluir = null;

        // Carregar membros ao iniciar
        document.addEventListener('DOMContentLoaded', () => {
            carregarTabela();
        });

        function carregarTabela(filtro = '') {
            const tbody = document.getElementById('corpoTabela');
            const membrosFiltrados = filtro === '' 
                ? membros 
                : membros.filter(m => m.nome.toLowerCase().includes(filtro.toLowerCase()));
            
            if (membrosFiltrados.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Nenhum membro encontrado</td></tr>';
                return;
            }
            
            let html = '';
            for (const m of membrosFiltrados) {
                const membroCompleto = getMembroCompleto(m);
                
                let badgeClass = '';
                if (membroCompleto.nivel === 'OFICIALIZADO(A)') badgeClass = 'badge-oficializado';
                else if (membroCompleto.nivel === 'RJM') badgeClass = 'badge-rjm';
                else if (membroCompleto.nivel === 'CULTO OFICIAL') badgeClass = 'badge-culte';
                else badgeClass = 'badge-meia';
                
                html += `<tr>
                    <td><strong>${membroCompleto.nome}</strong></td>
                    <td>${membroCompleto.instrumento}</td>
                    <td>${membroCompleto.congregacao}</td>
                    <td>${membroCompleto.cargo}</td>
                    <td><span class="badge ${badgeClass}">${membroCompleto.nivel}</span></td>
                    <td>
                        <button class="btn-editar" onclick="editarMembro(${m.id})"><i class="fas fa-edit"></i> Editar</button>
                        <button class="btn-qrcode" onclick="gerarQRCode(${m.id})"><i class="fas fa-qrcode"></i> QR</button>
                        <button class="btn-excluir" onclick="abrirModalExcluir(${m.id}, '${m.nome.replace(/'/g, "\\'")}')"><i class="fas fa-trash"></i> Excluir</button>
                    </td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }

        function buscarMembros() {
            const filtro = document.getElementById('searchInput').value;
            carregarTabela(filtro);
        }

        function editarMembro(id) {
            window.location.href = `editar.html?id=${id}`;
        }

        function gerarQRCode(id) {
            window.location.href = `editar.html?id=${id}&qr=true`;
        }

        function abrirModalExcluir(id, nome) {
            membroParaExcluir = id;
            document.getElementById('nomeExcluir').textContent = nome;
            document.getElementById('modal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
            membroParaExcluir = null;
        }

        function confirmarExclusao() {
            if (membroParaExcluir !== null) {
                excluirMembro(membroParaExcluir);
                fecharModal();
            }
        }

        function excluirMembro(id) {
            const index = membros.findIndex(m => m.id === id);
            if (index !== -1) {
                membros.splice(index, 1);
                salvarDados();
                carregarTabela(document.getElementById('searchInput').value);
                mostrarToast('Membro excluído com sucesso!');
            }
        }

        function mostrarToast(mensagem) {
            const toast = document.createElement('div');
            toast.textContent = mensagem;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.background = '#27ae60';
            toast.style.color = 'white';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '8px';
            toast.style.zIndex = '1000';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
