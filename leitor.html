<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leitor de Presença - Identidade Ministerial</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Abas */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: white;
            color: #2c3e50;
        }

        /* Conteúdo das abas */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Leitor */
        .reader-area {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .reader-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .reader-header h2 {
            color: #2c3e50;
            font-size: 1.3rem;
        }

        #reader {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
        }

        .btn-toggle {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
        }

        .status.success {
            background: #d5f4e6;
            color: #27ae60;
        }

        .status.error {
            background: #fee;
            color: #e74c3c;
        }

        .status.info {
            background: #e3f2fd;
            color: #3498db;
        }

        /* Identidade */
        .identity-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
            display: none;
        }

        .card-header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .card-header h3 {
            font-size: 1.1rem;
        }

        .card-content {
            padding: 20px;
        }

        .info-field {
            margin-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }

        .info-label {
            font-size: 0.7rem;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 1rem;
            color: #2c3e50;
            font-weight: 500;
        }

        .level-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #27ae60;
            color: white;
        }

        /* Estatísticas */
        .stats-area {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .stats-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .stats-header h2 {
            color: #2c3e50;
        }

        .stats-resumo {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        .stat-card.presentes .stat-number {
            color: #27ae60;
        }

        .stat-card.ausentes .stat-number {
            color: #e74c3c;
        }

        .stat-card.total .stat-number {
            color: #3498db;
        }

        .filtro-busca {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .lista-membros {
            max-height: 400px;
            overflow-y: auto;
        }

        .membro-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .membro-item:hover {
            background: #f8f9fa;
        }

        .membro-info {
            flex: 1;
        }

        .membro-nome {
            font-weight: bold;
            color: #2c3e50;
        }

        .membro-instrumento {
            font-size: 0.75rem;
            color: #7f8c8d;
        }

        .status-presenca {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-presente {
            background: #d5f4e6;
            color: #27ae60;
        }

        .status-ausente {
            background: #fee;
            color: #e74c3c;
        }

        .btn-limpar {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            z-index: 1000;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Abas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="trocarAba('leitor')">📷 Leitor</button>
            <button class="tab-btn" onclick="trocarAba('estatisticas')">📊 Estatísticas</button>
        </div>

        <!-- Aba Leitor -->
        <div id="abaLeitor" class="tab-content active">
            <div class="reader-area">
                <div class="reader-header">
                    <h2>📷 Leitor de QR Code</h2>
                    <p>Aponte a câmera para o QR Code do membro</p>
                </div>
                <div id="reader"></div>
                <button class="btn-toggle" id="toggleCameraBtn">📷 Iniciar Câmera</button>
                <div id="status" class="status info">✅ Clique em "Iniciar Câmera" para começar</div>
            </div>

            <!-- Identidade que aparece após leitura -->
            <div class="identity-card" id="identityCard">
                <div class="card-header">
                    <h3>🎵 IDENTIDADE MINISTERIAL</h3>
                </div>
                <div class="card-content">
                    <div class="info-field">
                        <div class="info-label">📌 Nome Completo</div>
                        <div class="info-value" id="nome">---</div>
                    </div>
                    <div class="info-field">
                        <div class="info-label">🏛️ Congregação</div>
                        <div class="info-value" id="congregacao">---</div>
                    </div>
                    <div class="info-field">
                        <div class="info-label">⭐ Cargo</div>
                        <div class="info-value" id="cargo">---</div>
                    </div>
                    <div class="info-field">
                        <div class="info-label">📊 Nível</div>
                        <div class="info-value" id="nivel">---</div>
                    </div>
                    <div class="info-field">
                        <div class="info-label">🎷 Instrumento</div>
                        <div class="info-value" id="instrumento">---</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Aba Estatísticas -->
        <div id="abaEstatisticas" class="tab-content">
            <div class="stats-area">
                <div class="stats-header">
                    <h2>📊 Controle de Presença</h2>
                    <p id="dataAtual"></p>
                </div>

                <div class="stats-resumo">
                    <div class="stat-card total">
                        <div class="stat-number" id="totalMembros">0</div>
                        <div class="stat-label">Total de Membros</div>
                    </div>
                    <div class="stat-card presentes">
                        <div class="stat-number" id="totalPresentes">0</div>
                        <div class="stat-label">Presentes</div>
                    </div>
                    <div class="stat-card ausentes">
                        <div class="stat-number" id="totalAusentes">0</div>
                        <div class="stat-label">Ausentes</div>
                    </div>
                </div>

                <input type="text" id="buscaMembro" class="filtro-busca" placeholder="🔍 Buscar por nome..." onkeyup="filtrarMembros()">

                <div class="lista-membros" id="listaMembros"></div>

                <button class="btn-limpar" onclick="limparPresencasHoje()">🗑️ Limpar Presenças de Hoje</button>
            </div>
        </div>
    </div>

    <script src="dados.js"></script>
    <script>
        // ========== VARIÁVEIS ==========
        let html5QrCode = null;
        let leitorAtivo = false;
        let leituraRealizada = false;
        
        // Chave para armazenar presenças no localStorage
        const STORAGE_KEY = 'presencas_identidade';

        // ========== FUNÇÕES DE PRESENÇA ==========
        
        // Obter a data de hoje no formato YYYY-MM-DD
        function getDataHoje() {
            const hoje = new Date();
            return hoje.toISOString().split('T')[0];
        }

        // Carregar presenças do localStorage
        function carregarPresencas() {
            const salvo = localStorage.getItem(STORAGE_KEY);
            if (salvo) {
                return JSON.parse(salvo);
            }
            return {};
        }

        // Salvar presenças no localStorage
        function salvarPresencas(presencas) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(presencas));
        }

        // Registrar presença de um membro
        function registrarPresenca(membroId, membroNome) {
            const hoje = getDataHoje();
            const presencas = carregarPresencas();
            
            if (!presencas[hoje]) {
                presencas[hoje] = {};
            }
            
            if (presencas[hoje][membroId]) {
                return false; // Já registrado hoje
            }
            
            presencas[hoje][membroId] = {
                id: membroId,
                nome: membroNome,
                timestamp: new Date().toISOString()
            };
            
            salvarPresencas(presencas);
            return true; // Registrado com sucesso
        }

        // Verificar se um membro está presente hoje
        function estaPresente(membroId) {
            const hoje = getDataHoje();
            const presencas = carregarPresencas();
            return presencas[hoje] && presencas[hoje][membroId] ? true : false;
        }

        // Obter todos os membros com status de presença
        function getMembrosComStatus() {
            const membrosCompletos = listarMembrosCompletos();
            const hoje = getDataHoje();
            const presencas = carregarPresencas();
            const presencasHoje = presencas[hoje] || {};
            
            return membrosCompletos.map(membro => ({
                ...membro,
                presente: !!presencasHoje[membro.id]
            }));
        }

        // ========== FUNÇÕES DA ABA ESTATÍSTICAS ==========
        
        function atualizarEstatisticas() {
            const membrosComStatus = getMembrosComStatus();
            const total = membrosComStatus.length;
            const presentes = membrosComStatus.filter(m => m.presente).length;
            const ausentes = total - presentes;
            
            document.getElementById('totalMembros').textContent = total;
            document.getElementById('totalPresentes').textContent = presentes;
            document.getElementById('totalAusentes').textContent = ausentes;
            document.getElementById('dataAtual').textContent = `📅 ${new Date().toLocaleDateString('pt-BR')}`;
            
            return membrosComStatus;
        }

        function exibirListaMembros(filtro = '') {
            let membrosComStatus = getMembrosComStatus();
            
            if (filtro) {
                membrosComStatus = membrosComStatus.filter(m => 
                    m.nome.toLowerCase().includes(filtro.toLowerCase())
                );
            }
            
            const listaDiv = document.getElementById('listaMembros');
            
            if (membrosComStatus.length === 0) {
                listaDiv.innerHTML = '<p style="text-align: center; padding: 20px; color: #999;">Nenhum membro encontrado</p>';
                return;
            }
            
            let html = '';
            for (const m of membrosComStatus) {
                const statusClass = m.presente ? 'status-presente' : 'status-ausente';
                const statusText = m.presente ? '✅ Presente' : '❌ Ausente';
                
                html += `
                    <div class="membro-item">
                        <div class="membro-info">
                            <div class="membro-nome">${m.nome}</div>
                            <div class="membro-instrumento">${m.instrumento} • ${m.cargo}</div>
                        </div>
                        <div class="status-presenca ${statusClass}">${statusText}</div>
                    </div>
                `;
            }
            listaDiv.innerHTML = html;
        }

        function filtrarMembros() {
            const filtro = document.getElementById('buscaMembro').value;
            exibirListaMembros(filtro);
        }

        function limparPresencasHoje() {
            if (confirm('Tem certeza que deseja limpar todas as presenças de hoje?')) {
                const hoje = getDataHoje();
                const presencas = carregarPresencas();
                delete presencas[hoje];
                salvarPresencas(presencas);
                
                // Recarregar estatísticas
                atualizarEstatisticas();
                exibirListaMembros();
                
                mostrarToast('✅ Presenças de hoje foram limpas!');
            }
        }

        // ========== FUNÇÕES DO LEITOR ==========
        
        function mostrarStatus(mensagem, tipo) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = mensagem;
            statusDiv.className = `status ${tipo}`;
        }

        function mostrarToast(mensagem) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = mensagem;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function exibirIdentidade(membro) {
            document.getElementById('nome').textContent = membro.nome;
            document.getElementById('congregacao').textContent = membro.congregacao;
            document.getElementById('cargo').textContent = membro.cargo;
            document.getElementById('nivel').innerHTML = `<span class="level-badge">${membro.nivel}</span>`;
            document.getElementById('instrumento').textContent = membro.instrumento;
            
            document.getElementById('identityCard').style.display = 'block';
        }

        function processarQRCode(decodedText) {
            if (leituraRealizada) return;
            
            try {
                const dados = JSON.parse(decodedText);
                const membroId = dados.id;
                
                if (!membroId) {
                    mostrarStatus('❌ QR Code inválido: ID não encontrado', 'error');
                    return;
                }
                
                const membro = getMembroCompletoPorId(membroId);
                
                if (!membro) {
                    mostrarStatus(`❌ Membro com ID ${membroId} não encontrado`, 'error');
                    return;
                }
                
                // Exibir identidade
                exibirIdentidade(membro);
                
                // Registrar presença
                const registrado = registrarPresenca(membro.id, membro.nome);
                
                if (registrado) {
                    mostrarStatus(`✅ Presença registrada: ${membro.nome}`, 'success');
                    mostrarToast(`✅ ${membro.nome} - Presença registrada!`);
                    leituraRealizada = true;
                    
                    // Parar a câmera após registrar
                    setTimeout(() => {
                        if (leitorAtivo) {
                            pararLeitor();
                            mostrarStatus('📷 Leitura concluída! Clique em "Iniciar Câmera" para próximo', 'info');
                        }
                    }, 2000);
                } else {
                    mostrarStatus(`⚠️ ${membro.nome} já registrou presença hoje!`, 'error');
                    mostrarToast(`⚠️ ${membro.nome} já está presente!`);
                }
                
            } catch (error) {
                mostrarStatus('❌ QR Code inválido', 'error');
            }
        }

        async function iniciarLeitor() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 300, height: 300 } },
                    (decodedText) => {
                        processarQRCode(decodedText);
                    },
                    (errorMessage) => {}
                );
                leitorAtivo = true;
                leituraRealizada = false;
                document.getElementById('toggleCameraBtn').textContent = '🔴 Parar Câmera';
                mostrarStatus('📷 Câmera ativa. Aponte para o QR Code.', 'success');
            } catch (err) {
                mostrarStatus('❌ Erro ao acessar câmera. Verifique as permissões.', 'error');
            }
        }

        async function pararLeitor() {
            if (html5QrCode && leitorAtivo) {
                try {
                    await html5QrCode.stop();
                    leitorAtivo = false;
                    document.getElementById('toggleCameraBtn').textContent = '📷 Iniciar Câmera';
                    mostrarStatus('⏹️ Câmera parada.', 'info');
                } catch (err) {}
            }
        }

        function reiniciarLeitor() {
            leituraRealizada = false;
            document.getElementById('identityCard').style.display = 'none';
            
            if (!leitorAtivo) {
                iniciarLeitor();
            }
        }

        // ========== TROCAR ABA ==========
        function trocarAba(aba) {
            // Atualizar botões
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Mostrar/esconder conteúdo
            document.getElementById('abaLeitor').classList.remove('active');
            document.getElementById('abaEstatisticas').classList.remove('active');
            
            if (aba === 'leitor') {
                document.getElementById('abaLeitor').classList.add('active');
                reiniciarLeitor();
            } else {
                document.getElementById('abaEstatisticas').classList.add('active');
                atualizarEstatisticas();
                exibirListaMembros();
                
                // Parar câmera quando sair da aba leitor
                if (leitorAtivo) {
                    pararLeitor();
                }
            }
        }

        // ========== EVENTOS ==========
        document.getElementById('toggleCameraBtn').addEventListener('click', () => {
            if (leitorAtivo) {
                pararLeitor();
            } else {
                leituraRealizada = false;
                document.getElementById('identityCard').style.display = 'none';
                iniciarLeitor();
            }
        });

        // Verificar HTTPS
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            mostrarStatus('⚠️ Para usar a câmera, a página precisa estar em HTTPS', 'error');
        }
        
        // Atualizar data atual
        document.getElementById('dataAtual').textContent = `📅 ${new Date().toLocaleDateString('pt-BR')}`;
    </script>
</body>
</html>
