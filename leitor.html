<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de QR Code</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .resultado {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Teste de Leitura do QR Code</h1>
    <p>Cole o conteúdo lido do QR Code abaixo:</p>
    <textarea id="qrTexto" placeholder='{"id": 20}'></textarea>
    <button onclick="lerQRCode()">Buscar Membro</button>
    
    <div id="resultado" class="resultado"></div>

    <script src="dados.js"></script>
    <script>
        function lerQRCode() {
            const texto = document.getElementById('qrTexto').value;
            try {
                const dados = JSON.parse(texto);
                const membro = getMembroCompletoPorId(dados.id);
                
                if (membro) {
                    document.getElementById('resultado').innerHTML = `
                        <h3>✅ Membro Encontrado!</h3>
                        <p><strong>Nome:</strong> ${membro.nome}</p>
                        <p><strong>Instrumento:</strong> ${membro.instrumento}</p>
                        <p><strong>Congregação:</strong> ${membro.congregacao}</p>
                        <p><strong>Cargo:</strong> ${membro.cargo}</p>
                        <p><strong>Nível:</strong> ${membro.nivel}</p>
                    `;
                } else {
                    document.getElementById('resultado').innerHTML = `<p style="color:red">❌ Membro com ID ${dados.id} não encontrado!</p>`;
                }
            } catch(e) {
                document.getElementById('resultado').innerHTML = `<p style="color:red">❌ QR Code inválido: ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
