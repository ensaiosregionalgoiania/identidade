<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconhecimento Facial em Tempo Real</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        /* O vídeo e o canvas de desenho devem ficar sobrepostos */
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
    <!-- Carregando a face-api.js via CDN público (versão mantida pela comunidade) -->
    <script defer src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="status">Carregando modelos de IA...</div>

    <div class="container">
        <video id="webcam" width="640" height="480" autoplay muted playsinline></video>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');

        // 1. Carregar as redes neurais (modelos) da face-api
        async function carregarModelos() {
            // Usamos os modelos hospedados remotamente para facilitar o exemplo de arquivo único
            const MODEL_URL = 'https://jsdelivr.net';
            
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
            
            statusDiv.innerText = "Modelos carregados! Iniciando câmera...";
            iniciarVideo();
        }

        // 2. Solicitar acesso à webcam do usuário
        function iniciarVideo() {
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => {
                    video.srcObject = stream;
                    statusDiv.innerText = "Reconhecimento Ativo";
                })
                .catch(err => {
                    console.error("Erro ao acessar a webcam: ", err);
                    statusDiv.innerText = "Erro ao acessar a webcam.";
                });
        }

        // 3. Executar a detecção contínua assim que o vídeo começar a rodar
        video.addEventListener('play', () => {
            // Cria um canvas com as dimensões exatas do vídeo para desenhar as marcações por cima
            const canvas = faceapi.createCanvasFromMedia(video);
            document.querySelector('.container').append(canvas);
            
            const displaySize = { width: video.width, height: video.height };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                // Detecta rostos, expressões e pontos faciais na imagem atual do vídeo
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceExpressions();

                // Redimensiona as coordenadas detectadas para o tamanho atual do canvas
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                
                // Limpa o frame anterior do canvas
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

                // Desenha a caixa delimitadora, os pontos do rosto e as expressões na tela
                faceapi.draw.drawDetections(canvas, resizedDetections);
                faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);
                faceapi.draw.drawFaceExpressions(canvas, resizedDetections);
            }, 100); // Executa a cada 100 milissegundos
        });

        // Iniciar o processo ao abrir a página
        carregarModelos();
    </script>
</body>
</html>
