<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconhecimento Facial em Tempo Real</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
    <!-- CORRIGIDO: Carregando as bibliotecas corretamente -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

    <div id="status">Carregando modelos de IA...</div>

    <div class="container">
        <video id="webcam" width="640" height="480" autoplay muted playsinline></video>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');
        let canvas = null;

        // CORRIGIDO: URL correta para os modelos (usando o repositório oficial)
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';

        // 1. Carregar as redes neurais (modelos) da face-api
        async function carregarModelos() {
            statusDiv.innerText = "Carregando modelos de IA... (pode levar alguns segundos)";
            
            try {
                // CORRIGIDO: Carregar os modelos na ordem correta
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                statusDiv.innerText = "✓ Modelo de detecção carregado...";
                
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                statusDiv.innerText = "✓ Modelo de landmarks carregado...";
                
                await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                
                statusDiv.innerText = "✓ Todos os modelos carregados! Iniciando câmera...";
                console.log("Modelos carregados com sucesso!");
                iniciarVideo();
                
            } catch (error) {
                console.error("Erro ao carregar modelos:", error);
                statusDiv.innerText = "Erro ao carregar modelos. Verifique sua internet.";
            }
        }

        // 2. Solicitar acesso à webcam do usuário
        function iniciarVideo() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then(stream => {
                    video.srcObject = stream;
                    statusDiv.innerText = "✅ Reconhecimento Ativo";
                })
                .catch(err => {
                    console.error("Erro ao acessar a webcam: ", err);
                    statusDiv.innerText = "❌ Erro ao acessar a webcam. Verifique as permissões.";
                });
        }

        // CORRIGIDO: Aguardar o vídeo carregar completamente
        video.addEventListener('loadeddata', () => {
            // Criar canvas apenas se não existir
            if (!canvas) {
                canvas = faceapi.createCanvasFromMedia(video);
                document.querySelector('.container').appendChild(canvas);
                
                const displaySize = { width: video.width, height: video.height };
                faceapi.matchDimensions(canvas, displaySize);
                
                statusDiv.innerText = "✅ Câmera ativa! Detectando rostos...";
                
                // Iniciar detecção contínua
                detectarRostos();
            }
        });

        // Função para detecção contínua usando requestAnimationFrame (melhor que setInterval)
        async function detectarRostos() {
            if (!video.srcObject) return;
            
            try {
                const displaySize = { width: video.width, height: video.height };
                
                // Detecta rostos, landmarks e expressões
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceExpressions();

                // Redimensiona as coordenadas detectadas para o tamanho atual do canvas
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                
                // Limpa o frame anterior do canvas
                if (canvas) {
                    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Desenha as detecções
                    if (resizedDetections.length > 0) {
                        faceapi.draw.drawDetections(canvas, resizedDetections);
                        faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);
                        faceapi.draw.drawFaceExpressions(canvas, resizedDetections);
                        
                        // Atualizar status com número de rostos detectados
                        if (resizedDetections.length === 1) {
                            statusDiv.innerText = `✅ Detectando ${resizedDetections.length} rosto`;
                        } else if (resizedDetections.length > 1) {
                            statusDiv.innerText = `✅ Detectando ${resizedDetections.length} rostos`;
                        }
                    } else {
                        statusDiv.innerText = "🔍 Nenhum rosto detectado";
                    }
                }
                
                // Continuar o loop de detecção
                requestAnimationFrame(detectarRostos);
                
            } catch (error) {
                console.error("Erro na detecção:", error);
                // Continuar tentando mesmo com erro
                requestAnimationFrame(detectarRostos);
            }
        }

        // Iniciar o processo ao abrir a página
        carregarModelos();
    </script>
</body>
</html>
